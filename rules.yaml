  born_from_th: 'audit governance 2026-08-16 (ADR 0054) — SBOM ของ image มี 8 ไฟล์แต่ ไม่มีใครสแกน
    OS layer เลย: มี SBOM ไม่เท่ากับมีคนอ่าน CVE ของ glibc/openssl ใน image คือของที่เราจะรู้ก็ต่อเมื่อคนอื่นบอก'
  reference:
    kind: step
    job: image
    step: ตัดสินผลสแกนเทียบรายการยกเว้น — สองทิศ
- id: image-exceptions-honest
  layer: baseline
  pillar: security
  title: The image's CVE exception list is checked in both directions, and every ID has a documented
    reason
  title_th: รายการยกเว้น CVE ของ image ตรวจสองทิศ และทุก ID มีเหตุผลในเอกสาร
  born_from: The same principle as pins-exceptions-honest — an exception list nobody removes entries
    from becomes a real muzzle one day, and a scan scope (severity, unfixed) that quietly goes missing
