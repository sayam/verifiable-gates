- id: licensing-no-copyleft
  layer: baseline
  pillar: security
  title: The LICENSE is the real text the ADR declares · the core carries no dependency with a copyleft
    obligation
  title_th: LICENSE เป็นของจริงตามที่ ADR ประกาศ · core ไม่มี dependency ที่แบกภาระ copyleft
  born_from: That library was LGPLv3 and happened to sit in the group of optional dependencies — separating
    the supply chain separated the legal obligation too, without anyone designing it that way · "not
    found" is not the same as "unreadable, therefore not found" · ADR 0070 (2026-08-19) changed the
    licences to AGPL-3.0 and CC BY-SA 4.0 — so this gate checks the body of the AGPL (including clause
    13 on network use, which is the entire reason that licence was chosen) and that LICENSE-docs exists
    · **the dependency-copyleft half is unchanged**, because that obligation belongs to the downstream
    user, not to us.
  born_from_th: ไลบรารีตัวนั้นเป็น LGPLv3 และอยู่ในกลุ่ม dependency ที่ไม่บังคับพอดี — การแยก supply
    chain แยกภาระทางกฎหมายไปด้วยโดยไม่มีใครออกแบบ · "ไม่พบ" ≠ "อ่านไม่ได้จึงไม่พบ" · ADR 0070 (2026-08-19)
    เปลี่ยนสัญญาอนุญาตเป็น AGPL-3.0 + CC BY-SA 4.0 — ด่านนี้จึงตรวจเนื้อของ AGPL (รวมข้อ 13 เรื่องการให้บริการผ่านเครือข่าย
    ซึ่งเป็นเหตุผลทั้งหมดที่เลือกใบนั้น) และตรวจว่า LICENSE-docs มีจริง · **ส่วนที่ตรวจ copyleft ของ
    dependency ไม่เปลี่ยน** เพราะภาระนั้นเป็นของ ผู้ใช้ปลายทาง ไม่ใช่ของเรา
  reference:
    kind: test
    job: test
    tests:
    - tests/test_licensing.py
