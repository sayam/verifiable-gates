- id: conventional-commits
  layer: baseline
  pillar: devx
  title: Commits are Conventional Commits of at most 72 characters and carry Signed-off-by (DCO),
    checked only on what the branch actually adds
  title_th: commit เป็น Conventional Commits ≤72 ตัว และมี Signed-off-by (DCO) ตรวจเฉพาะที่เพิ่มจริง
  born_from: 'A required check that gets skipped on a pull request leaves it BLOCKED forever with
    nothing red to see — and the merge commit from the Update branch button once failed the gate itself
    · **ADR 0073 brought the DCO signature into the same gate**: the project had never asked contributors
    to certify their legal right to what they send, which was the one unmet item of the 19 in OSPS
    Baseline level 2, and the same reason the badge''s silver-level `dco` criterion had been Unmet
    from the start.'
  born_from_th: 'required check ที่ถูก skip บน PR ทำให้ PR ค้าง BLOCKED ตลอดกาลโดยไม่มี อะไรแดงให้เห็น
    — และ merge commit ของปุ่ม Update branch เคยตกด่านเอง · **ADR 0073 เพิ่มลายเซ็น DCO เข้ามาในด่านเดียวกัน**:
    โปรเจกต์ไม่เคยขอให้ ผู้ส่งโค้ดรับรองสิทธิ์ตามกฎหมายของสิ่งที่ส่งเลย ซึ่งเป็นข้อเดียวจาก 19 ข้อ
    ของ OSPS Baseline ระดับ 2 ที่ไม่ผ่าน และเป็นเหตุผลเดียวกับที่เกณฑ์ `dco` ของ badge ระดับ silver
    เป็น Unmet มาตั้งแต่ต้น'
  reference:
    kind: job
    job: commit-lint
- id: core-deps-cve-audit
  layer: baseline
  pillar: security
  title: pip-audit over the core — a CVE in something that cannot be removed must be able to stop
