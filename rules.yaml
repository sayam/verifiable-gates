  born_from_th: หลักเดียวกับ pins-exceptions-honest — รายการยกเว้นที่ไม่มีใครถอดจะ กลายเป็นตัวปิดของจริงในวันหนึ่ง
    และขอบเขตการสแกน (severity/unfixed) ที่หายไปเงียบ ๆ คือด่านที่เปลี่ยนความหมายโดยไม่มี commit ไหนบอก
  reference:
