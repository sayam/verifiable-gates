  title_th: บรรทัดที่ PR แก้ต้องถูกเทสต์ครอบ 100% — coverage floor ทั้งไฟล์ตอบคำถามนี้ไม่ได้
  born_from: Governance audit round 6 (2026-08-17) — the gate that went red most often in this repo
    (5 of the 13 failing runs in the last 200) had no row in the index at all, because the rule "every
