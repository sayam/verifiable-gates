- id: perf-regression-tripwire
  layer: baseline
  pillar: performance
  title: A real journey against a real image on every push — a loose threshold (2× the target) catches
    step-change regressions
  title_th: journey จริงบน image จริงทุก push — เกณฑ์หลวม (2×เป้า) จับ regression ก้าวกระโดด
  born_from: Governance audit 2026-08-16 (ADR 0056) — the charter's second pillar had no per-push
    latency gate at all; a step-change regression (a new N+1, a lost index) could reach main silently
    until the next time somebody ran a load test by hand.
  born_from_th: audit governance 2026-08-16 (ADR 0056) — pillar อันดับสองของธรรมนูญ ไม่มีด่าน latency
    ต่อ push เลย regression ก้าวกระโดด (N+1 ใหม่ · index หาย) เข้า main ได้เงียบ ๆ จนกว่าจะมีคนรัน
    load test มือครั้งถัดไป
  reference:
    kind: job
    job: perf-smoke
- id: tls-modern-protocols-only
  layer: baseline
  pillar: security
  title: Only TLS 1.2 and 1.3 are accepted — proving the server refuses, not that the client refused
    on its own
  title_th: รับเฉพาะ TLS 1.2/1.3 — พิสูจน์ว่า server ปฏิเสธ ไม่ใช่ client ปฏิเสธเอง
  born_from: openssl 3 already disables TLS 1.0/1.1 on the client side — a gate that does not set
    SECLEVEL=0 proves only that openssl refuses itself, and passes every time even with ssl_protocols
    deleted.
  born_from_th: openssl 3 ปิด TLS 1.0/1.1 ฝั่ง client อยู่แล้ว — ด่านที่ไม่เปิด SECLEVEL=0 พิสูจน์แค่ว่า
    openssl ปฏิเสธตัวเอง ผ่านทุกครั้งแม้ลบ ssl_protocols ทิ้ง
  reference:
    kind: step
    job: stack
    step: รับเฉพาะ TLS 1.2 กับ 1.3
- id: tls-forward-secrecy
  layer: baseline
  pillar: security
  title: TLS offers forward secrecy on every reachable path — forcing a weak suite must be refused
  title_th: TLS ให้ PFS ทุกทางที่เข้าถึงได้ — บังคับชุดอ่อนแล้วต้องถูกปฏิเสธ
  born_from: Ordinary negotiation yields ECDHE and looks perfectly safe, but a client asking for RSA
    key exchange directly was served too — a gate that looks only at "what gets negotiated" reports
    a pass while the path without forward secrecy is still open (measured 2026-08-13).
  born_from_th: การต่อรองปกติได้ ECDHE ดูปลอดภัยดี แต่ไคลเอนต์ที่ขอชุด RSA-kx ตรง ๆ ก็ได้รับ — ด่านที่ดูแค่
    "ต่อรองได้อะไร" รายงานว่าผ่านทั้งที่ทางไม่มี PFS ยังเปิดอยู่ (วัดจริง 2026-08-13)
  reference:
    kind: step
    job: stack
    step: TLS ต้องให้ perfect forward secrecy ทุกทางที่เข้าถึงได้
- id: alerts-fire-for-real
  layer: baseline
  pillar: security
  title: Alert rules must actually fire when the events they watch for are fired at the stack, not
    merely exist while the stack comes up
  title_th: กฎแจ้งเตือนต้องดังจริงเมื่อยิงเหตุการณ์ที่มันเฝ้าใส่ stack ไม่ใช่แค่มีกฎอยู่ตอน stack ขึ้น
  born_from: ADR 0037 — a rule counting only 401s falls silent exactly when the attack is heaviest,
    because the quota cuts in at 5 and the rest become 429 · what must be proved is that the alert
    fires, not that a rule exists.
  born_from_th: ADR 0037 — กฎที่นับแต่ 401 เงียบพอดีตอนที่การโจมตีหนักที่สุด เพราะโควตา ตัดที่ 5 ที่เหลือกลายเป็น
    429 · ต้องพิสูจน์ว่า alert ดัง ไม่ใช่ว่ามีกฎ
  reference:
    kind: job
    job: siem
- id: zap-authenticated-scan
  layer: baseline
  pillar: security
  title: ZAP baseline fires at the real stack while logged in — and the app's own logs measure that
    it really scanned
  title_th: ZAP baseline ยิง stack จริงแบบ login แล้ว — วัดว่าสแกนจริงจาก log ของแอป
  born_from: Scanning without logging in sees only the login page — such a gate is green forever without
    checking anything · and on the day the alerts are all fixed, checking the report would turn "found
    nothing" into "did not scan".
  born_from_th: สแกนโดยไม่ login เห็นแค่หน้า login — ด่านแบบนั้นเขียวตลอดโดยไม่ได้ตรวจ อะไร · และวันที่แก้จนไม่เหลือ
    alert การเช็คจากรายงานจะกลายเป็น "ไม่เจอ = ไม่ได้สแกน"
  reference:
    kind: job
    job: dast
- id: purge-timer-real-systemd
  layer: baseline
  pillar: security
  title: The expiry-purge job is installed on a real scheduler and its failures are visible to a
    person, not only to the exit code
  title_th: งานลบข้อมูลพ้นระยะติดตั้งบน scheduler จริง และความล้มเหลวมีคนมองเห็น ไม่ใช่แค่ exit code
  born_from: 'Retention periods become real only when something runs purge on a schedule — and periodic
    work that goes quiet when it fails is worse than none · `$?` inside an if! branch is always 0
    · audit round 10 item 4 added a layer: this gate''s idea of "visible" covered only **the exit
    code the script hands systemd**, while what happens after that is a state somebody has to walk
    over and ask about — so the unit needs an OnFailure that leaves a machine-searchable line, and
    the job has to check that it still points somewhere and that the target unit was installed too.'
  born_from_th: 'ระยะเก็บรักษาจะเป็นจริงก็ต่อเมื่อมีอะไรรัน purge ตามรอบ — และงานตามรอบ ที่เงียบตอนล้มเหลวแย่กว่าไม่มีเลย
    · `$?` ในกิ่ง if! เป็น 0 เสมอ · audit รอบ 10 ข้อ 4 ต่ออีกชั้น: คำว่า "มองเห็นได้" ของ gate นี้เคยครอบแค่
    **exit code ที่สคริปต์คืนให้ systemd** ส่วนสิ่งที่เกิดหลังจากนั้นคือสถานะที่ ต้องมีคนเดินไปถาม
    — หน่วยจึงต้องมี OnFailure ที่ทิ้งบรรทัดซึ่งค้นเจอด้วย เครื่อง และ job ต้องตรวจว่ามันยังชี้อยู่และหน่วยปลายทางถูกติดตั้งมาด้วย'
  reference:
    kind: job
    job: purge-timer
- id: push-secret-scan
  layer: baseline
  pillar: security
  title: gitleaks checks the commits in that push (a separate periodic script covers the whole history)
  title_th: gitleaks ตรวจ commit ที่อยู่ใน push นั้น (ทั้งประวัติมีสคริปต์แยกตามรอบ)
  born_from: A secret that reaches history cannot truly be deleted on GitHub — old objects are still
    served by SHA · stopping it on the way in is always cheaper.
  born_from_th: ความลับที่หลุดเข้า history ลบไม่ได้จริงบน GitHub — object เก่ายังถูก เสิร์ฟตาม SHA
    · กันตั้งแต่ขาเข้าถูกกว่าเสมอ
  reference:
    kind: job
    job: secret-scan
- id: release-signed-and-attested
  layer: baseline
  pillar: security
  title: A release's SBOM is generated in CI, signed keyless with provenance, and verified in both
    directions before it is attached
  title_th: SBOM ของ release ถูก generate ใน CI เซ็น keyless + provenance และ verify สองทิศก่อนแนบ
  born_from: 'Governance audit 2026-08-16 (ADR 0058) — releases had attached an SBOM since v1.0.0
    with no file signed: a downloader could not verify it came from CI at all, and something built
    outside CI cannot say what it was built from even if signed.'
  born_from_th: 'audit governance 2026-08-16 (ADR 0058) — release แนบ SBOM มาตั้งแต่ v1.0.0 โดยไม่มีไฟล์ไหนถูกเซ็น:
    คนโหลดไป verify ไม่ได้ว่ามาจาก CI จริง และของที่ build นอก CI ต่อให้เซ็นก็ตอบไม่ได้ว่าสร้างจากอะไร'
  reference:
    kind: job
    job: release-sign
- id: sbom-per-category
  layer: business
  pillar: security
  title: SBOMs are split per category — able to answer which components disappear when a plugin is
    removed
  title_th: SBOM แยกต่อ category — ตอบได้ว่าถอด plugin แล้ว component ไหนหาย
  born_from: A single SBOM cannot answer the first question of the day a CVE lands — "if I remove
    this, what goes with it?"
  born_from_th: SBOM ก้อนเดียวตอบคำถามแรกของวันที่ CVE ออกไม่ได้ — "ถอดตัวนี้แล้วอะไรหายไปบ้าง"
  reference:
    kind: job
    job: sbom
- id: codeql-sast
  layer: baseline
  pillar: security
  title: CodeQL security-extended for both Python and JavaScript — as a job, not the default setup
  title_th: CodeQL security-extended ทั้ง python และ javascript — เป็น job ไม่ใช่ default setup
  born_from: Something clicked into place in a UI cannot be reviewed and can disappear silently (the
    ADR 0037 principle) · the first round found two real things, including a debugger that was shipping
    inside the image.
  born_from_th: ของที่คลิกไว้ใน UI ไม่มีใคร review ได้และหายเงียบ ๆ ได้ (หลัก ADR 0037) · รอบแรกเจอของจริงสองอย่างรวม
    debugger ที่ติดไปกับ image
  reference:
    kind: job
    job: codeql
- id: platform-posture-verified
  layer: baseline
  pillar: security
  title: The platform-side posture (branch protection · required checks · auto-merge · alerts left
    standing on the Security tab) is machine-checked, not merely written down
  title_th: ท่าทีฝั่งแพลตฟอร์ม (branch protection · required check · auto-merge · alert ที่ค้างบนหน้า
    Security) ถูกเครื่องตรวจ ไม่ใช่แค่เขียนไว้
  born_from: Governance audit round 7 (2026-08-17) — the rules everything else leans on ("main takes
    changes only through pull requests · enforce_admins on · required checks for every job that runs
    on a pull request" — ADR 0053) are provider-side settings that **nothing in the repository reads**
    · switch them off in the settings page and the documentation still claims otherwise · checking
    the API that day also found `sha_pinning_required` switched off, although we enforce SHA pinning
    with our own test.
  born_from_th: audit governance รอบ 7 (2026-08-17) — กติกาที่ทุกอย่างพิงอยู่ ("main รับของ ทาง PR
    เท่านั้น · enforce_admins เปิด · required check ครบทุก job ที่รันบน PR" — ADR 0053) เป็น setting
    ฝั่งผู้ให้บริการที่**ไม่มีอะไรในเรโปอ่านเลย** · กดปิดในหน้า settings แล้วเอกสารยังอ้างเหมือนเดิม
    · ตรวจ API วันนั้นยังพบว่า `sha_pinning_required` ปิดอยู่ ทั้งที่เราบังคับ SHA pinning ด้วยเทสต์ของตัวเอง
  reference:
    kind: job
    job: posture
- id: watched-promises-are-measured
  layer: baseline
  pillar: manageability
  title: A declared `within_days` must be measured against reality, not merely checked for shape
  title_th: '`within_days` ที่ประกาศไว้ต้องถูกวัดกับความจริง ไม่ใช่ตรวจแค่รูปแบบ'
  born_from: 'Audit round 11 item 2 — ADR 0066 made every non-blocking gate declare within how many
    days somebody sees it, but the only thing checked was the *shape* (a number, at most 90) · measured
    over the same 4-day window: redness that blocked somebody stood for 0.4 hours, redness that blocked
    nobody stood for 14.6 — 36 times longer, with nothing comparing that figure against what was promised.'
  born_from_th: 'audit รอบ 11 ข้อ 2 — ADR 0066 ให้ทุก gate ที่บล็อกไม่ได้ประกาศว่าใครเห็นภายใน กี่วัน
    แต่สิ่งเดียวที่ตรวจคือ *รูปแบบ* (เป็นเลข · ไม่เกิน 90) · วัดจริงบน หน้าต่างเดียวกัน 4 วัน: ความแดงที่บล็อกใครยืนอยู่
    0.4 ชม. ส่วนที่ไม่บล็อกใคร ยืนอยู่ 14.6 ชม. — ต่างกัน 36 เท่า และไม่มีอะไรเทียบตัวเลขนั้นกับที่สัญญาไว้'
  reference:
    kind: step
    job: posture
    step: คำสัญญาของผู้เฝ้าต้องทำได้จริง
- id: schedules-still-fire
  layer: baseline
  pillar: manageability
  title: A declared schedule must be provably still firing — "no runs at all" must not look as quiet
    as "no run went red"
  title_th: ตารางเวลาที่ประกาศไว้ต้องพิสูจน์ได้ว่ายังยิงอยู่ — "ไม่มี run เลย" ต้องไม่เงียบเท่า "ไม่มี
    run ไหนแดง"
  born_from: 'Audit round 10 item 2 — ADR 0064 closed the layer "a workflow that never started = 0
    jobs", but the layer above it was still open: **a workflow never triggered = 0 runs**, which looks
    exactly like "no run went red" in every tool there is · the cron in `scorecard.yml` had fired
    exactly once in the repository''s lifetime, and if it stopped today no test, job or cadence row
    would know · GitHub also disables schedules for repositories quiet for 60 days, which is silence
    arriving from outside.'
  born_from_th: 'audit รอบ 10 ข้อ 2 — ADR 0064 ปิดชั้น "workflow ที่ไม่ได้ start = 0 job" ไปแล้ว แต่ชั้นถัดขึ้นไปยังเปิด:
    **workflow ที่ไม่เคยถูกทริกเกอร์ = 0 run** ซึ่งหน้าตาเหมือน "ไม่มี run ไหนแดง" เป๊ะในทุกเครื่องมือที่มี
    · cron ของ `scorecard.yml` ยิงจริงมาแล้วครั้งเดียวตลอดอายุ repo และถ้ามันหยุดวันนี้ ไม่มีเทสต์
    job หรือแถว cadence ไหนรู้เลย · GitHub ยังปิด schedule อัตโนมัติให้ repo ที่เงียบเกิน 60 วันด้วย
    ซึ่งเป็นความเงียบที่มาจากข้างนอก'
  reference:
    kind: step
    job: posture
    step: ตารางเวลาที่ประกาศไว้ต้องยังยิงอยู่จริง
- id: watcher-windows-fit-platform-silence
  layer: baseline
  pillar: manageability
  title: A watcher's promise must be shorter than the platform's silence window — a watcher that arrives
    after the machine is switched off is not a watcher
  title_th: คำสัญญาของผู้เฝ้าต้องสั้นกว่าหน้าต่างเงียบของแพลตฟอร์ม — ผู้เฝ้าที่มาถึงหลังเครื่องถูกปิด
    ไม่ใช่ผู้เฝ้า
  born_from: 'Audit round 26 item 1 — `schedules-still-fire` was built specifically to catch the rule
    "GitHub disables schedules for public repositories after 60 days of silence", but it was enforced
    by a job running inside that very cron — **the watcher sat underneath the thing it watched** and
    died in the same second it had something to report · worse, its promise at the time was 90 days,
    **longer than the window that creates the failure**: the watcher could arrive at least a month
    after the thing it watches without breaking a single promise · this rule enforces one thing —
    among the workflows that only a cron can save, at least one promise must be shorter than that
    window, because acting once resets the platform''s clock for the whole repository at once.'
  born_from_th: 'audit รอบ 26 ข้อ 1 — `schedules-still-fire` ถูกสร้างมาเพื่อจับกฎ "GitHub ปิด schedule
    ให้ repo สาธารณะที่เงียบครบ 60 วัน" โดยเฉพาะ แต่มันถูกบังคับด้วย job ที่รันอยู่ใน cron ตัวนั้นเอง
    — **ตัวเฝ้าอยู่ใต้สิ่งที่มันเฝ้า** และตายในวินาที เดียวกับที่มีเรื่องให้รายงาน · ที่แย่กว่าคือคำสัญญาของมันตอนนั้นเป็น
    90 วัน ซึ่ง**ยาวกว่าหน้าต่างที่สร้างความล้มเหลว**: ผู้เฝ้ามาถึงช้ากว่าของที่เฝ้าอย่างน้อย หนึ่งเดือนโดยไม่ผิดสัญญาสักข้อ
    · กฎนี้บังคับข้อเดียว — ในบรรดา workflow ที่รอดได้ ด้วย cron อย่างเดียว ต้องมีคำสัญญาอย่างน้อยหนึ่งข้อที่สั้นกว่าหน้าต่างนั้น
    เพราะการลงมือครั้งเดียวรีเซ็ตนาฬิกาของแพลตฟอร์มให้ทั้ง repo พร้อมกัน'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_watcher_windows.py
- id: instruction-file-under-a-declared-ceiling
  layer: baseline
  pillar: devx
  title: A file people read constantly has a declared ceiling, and the ceiling may not float above
    reality
  title_th: ไฟล์ที่คนอ่านบ่อยมีเพดานที่ประกาศไว้ และเพดานลอยเหนือของจริงไม่ได้
  born_from: 'A file an agent reads in full every session is unlike every other document — its cost
    is paid over and over, not when somebody opens it · measured when the rule was set (audit r8):
    22 lines on the project''s first day, grown to **1,240 lines and 8,488 words in 16 days**, with
    66 commits in the last 7 touching it — it grew every time there was governance work, and nobody
    had ever decided how much it was allowed to grow · the right answer is a two-way ratchet rather
    than a ban on growth: when it is full, move content out and link back, and **on the day content
    moves out the ceiling must come down with it**, or the space just freed gets quietly filled again
    next round.'
  born_from_th: 'ไฟล์ที่ agent อ่านทั้งไฟล์ทุก session ต่างจากเอกสารอื่นทุกฉบับ — ต้นทุนของมัน จ่ายซ้ำตลอดไป
    ไม่ใช่จ่ายตอนมีคนเปิดอ่าน · วัดตอนตั้งกติกา (audit r8): 22 บรรทัดในวันแรกของโปรเจกต์ โตเป็น **1,240
    บรรทัด / 8,488 คำ ใน 16 วัน** และ 66 commit ใน 7 วันล่าสุดแตะมัน — โตทุกครั้งที่มีงาน governance
    โดยไม่มี ใครเคยตัดสินว่าโตได้แค่ไหน · ทางที่ถูกคือ ratchet สองทิศ ไม่ใช่ห้ามโต: เต็มแล้วย้ายเนื้อออกแล้วลิงก์กลับ
    และ **วันที่ย้ายออก เพดานต้องถูกลดตาม** ไม่งั้นที่ว่างที่เพิ่งได้จะถูกถมกลับเงียบ ๆ ในรอบถัดไป'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_instruction_budget.py
- id: exception-registers-are-reasoned
  layer: baseline
  pillar: security
  title: A file that silences a gate needs a reason on every line, must actually be used, and may
    not relax a whole class at once
  title_th: แฟ้มที่ปิดเสียงด่านต้องมีเหตุผลทุกบรรทัด ถูกใช้จริง และผ่อนเกณฑ์ทั้งชั้นไม่ได้
  born_from: Audit r9 — `pins/accepted-advisories.txt` had two-way tests from the beginning, but the
    other two files doing the same job (silencing what a security tool reports) **were read by no
    test at all**, although the documentation declared for both that every line needs a reason · the
    risk is not the lines that exist today, all of which have reasons, but the next line somebody
    adds in a hurry with nothing to complain — and relaxing a whole class by editing one word (FAIL
    → WARN), which appears in no report anywhere.
  born_from_th: audit r9 — `pins/accepted-advisories.txt` มีเทสต์สองทิศคุมมาตั้งแต่ต้น แต่แฟ้ม อีกสองใบที่ทำหน้าที่เดียวกัน
    (ปิดเสียงสิ่งที่เครื่องมือความปลอดภัยรายงาน) **ไม่มีเทสต์ไฟล์ไหนอ่านเลย** ทั้งที่เอกสารประกาศกฎไว้ทั้งคู่ว่าทุกบรรทัดต้อง
    มีเหตุผล · ความเสี่ยงไม่ใช่บรรทัดที่มีอยู่วันนี้ซึ่งครบเหตุผลทุกบรรทัด แต่คือบรรทัดถัดไปที่ใครสักคนเติมตอนรีบแล้วไม่มีอะไรฟ้อง
    — และการผ่อนเกณฑ์ ทั้งชั้นด้วยการแก้คำเดียว (FAIL → WARN) ซึ่งไม่มีใครเห็นในรายงานฉบับไหน
  reference:
    kind: test
    job: test
    tests:
    - tests/test_exception_registers.py
- id: ratchets-do-not-drift-below-reality
  layer: baseline
  pillar: devx
  title: A ratchet's floor stays against reality in both directions · and what is removed has to be
    signed for
  title_th: พื้นของ ratchet ติดกับของจริงสองทิศ · และของที่ถูกถอดออกต้องมีคนเซ็นชื่อ
  born_from: 'Audit round 12 — `pyproject.toml` was annotated "moves up only" in both places, but
    nothing was moving it · six days after the number was set, real coverage had climbed to 97.11%
    while the floor was still 96 (set when it measured 96.31%) — that 1.11 points of slack was roughly
    54 covered lines that could vanish with nothing going red · the right mechanism already existed
    in this project (`LINE_SLACK` from ADR 0065), it had simply never been applied to any other ratchet
    · audit round 14 added mypy''s strict list — a ratchet written as a sentence survived the first
    chaser, because that chaser read only numeric floors in tool config · reality covered 34 of 72
    modules while the annotated target had expired sixteen phases earlier · audit round 16 added the
    pile guarding against *removal* (ADR 0069): measured by really deleting things 11 times, and found
    that a gate could be removed with CI fully green if you tidied 6 places, and that 37 rows across
    three paper registers could be deleted in complete silence, because deleting both sides at once
    still counts as "matching".'
  born_from_th: 'audit รอบ 12 — `pyproject.toml` เขียนกำกับว่า "ขยับขึ้นได้อย่างเดียว" ทั้งสองที่
    แต่ไม่มีอะไรทำให้มันขยับ · หกวันหลังตั้งเลข coverage จริงไต่ไป 97.11% ขณะที่พื้น ยังเป็น 96 (ตั้งตอนวัดได้
    96.31%) — ที่ว่าง 1.11 จุดคือโค้ดที่มีเทสต์คุมราว 54 บรรทัดซึ่งหายไปได้โดยไม่มีอะไรแดง · กลไกที่ถูกมีอยู่แล้วในโปรเจกต์นี้
    (`LINE_SLACK` ของ ADR 0065) แค่ยังไม่เคยถูกเอาไปใช้กับ ratchet ตัวอื่น · audit รอบ 14 เพิ่ม strict
    list ของ mypy เข้ามา — ratchet ที่เขียนเป็น ประโยครอดจากตัวทวงรุ่นแรกได้ เพราะตัวทวงอ่านเฉพาะพื้นที่เป็นตัวเลขใน
    config ของเครื่องมือ · ของจริงครอบ 34/72 โมดูล ขณะที่เป้าที่เขียนกำกับ หมดอายุไปสิบหกเฟส · audit
    รอบ 16 เพิ่มกองที่กันการ *ถอด* (ADR 0069): วัดด้วยการลบของจริง 11 ครั้งแล้วพบว่าถอด gate ทิ้งได้โดย
    CI เขียวครบถ้าเก็บกวาด 6 ที่ และ 37 แถวในสามทะเบียนกระดาษลบได้เงียบสนิท เพราะการลบทั้งสองข้างพร้อมกันยังนับว่า
    "ตรงกัน" อยู่ดี'
  reference:
    kind: step
    job: test
    step: พื้นของ ratchet ต้องไม่ลอยต่ำกว่าของจริง
- id: jobs-declare-a-time-budget
  layer: baseline
  pillar: manageability
  title: Every job, and every command our own tools fire outward, declares a time budget — "hung"
    and "slow" must be distinguishable
  title_th: ทุก job และทุกคำสั่งที่เครื่องมือของเรายิงออกไป ประกาศเพดานเวลา — "ค้าง" กับ "ช้า" ต้องแยกออกจากกันได้
  born_from: 'Audit round 11 — not one job set `timeout-minutes` (0 of 28), so the ceiling was GitHub''s
    default of 6 hours, which is not a ceiling anybody chose · the price is paid in decisions, not
    machine time: a job that has genuinely hung and a job merely slower than usual give identical
    signals · it happened for real the same day — `dialect (mysql-8)` was cancelled while running
    at 92% because the reviewer could not tell the two apart · later in the same round it was extended
    to all 11 `subprocess.run` call sites in the checkers, none of which had `timeout=` — one unanswering
    command eats the job''s whole budget and then reports "job timed out", which points at the wrong
    place.'
  born_from_th: 'audit รอบ 11 — ไม่มี job ไหนตั้ง `timeout-minutes` เลย (0 จาก 28) เพดานจึงเป็น ค่าเริ่มต้น
    6 ชั่วโมงของ GitHub ซึ่งไม่ใช่เพดานที่ใครเลือก · ราคาที่จ่ายคือ ความสามารถในการตัดสินใจ ไม่ใช่เวลาเครื่อง:
    job ที่ค้างจริงกับ job ที่แค่ช้ากว่า ปกติให้สัญญาณเหมือนกันทุกอย่าง · เกิดขึ้นแล้วจริงวันเดียวกัน
    — `dialect (mysql-8)` ถูกยกเลิกทิ้งทั้งที่เดินอยู่ที่ 92% เพราะผู้ตรวจแยกสองอย่างนี้ไม่ออก · ต่อมาในรอบเดียวกันขยายไปถึง
    `subprocess.run` ของ checker ทั้ง 11 จุด ซึ่ง ไม่มี `timeout=` เลย — เพดานของ job จะถูกกินทั้งก้อนโดยคำสั่งเดียวที่ไม่ตอบ
    แล้วรายงานว่า "job หมดเวลา" ซึ่งชี้ผิดที่'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_job_timeouts.py
- id: workflows-are-startable
  layer: baseline
  pillar: security
  title: Every workflow must genuinely start — scope, triggers and jobs are what GitHub accepts
  title_th: ทุก workflow ต้อง start ได้จริง — scope/ทริกเกอร์/job ตรงกับที่ GitHub รับ
  born_from: 'Audit r9 — the pinning checkers were all present, but none checked whether the platform
    would agree to start the file · a YAML parser accepts any key that is syntactically well spelled,
    while GitHub rejects keys outside its schema and **fails the whole run before creating a single
    job** · it happened and lasted more than a day: a `permissions:` block asking for a scope that
    does not exist made the entire workflow fail on every run, and the jobs inside it **never ran
    once** · it stayed quiet because that job was not a required check, so no pull request ever showed
    red — **a gate that does not run behaves exactly like a gate that does not exist, except that
    documentation says it is there**.'
  born_from_th: 'audit r9 — ตัวตรวจการตรึงเวอร์ชันมีครบ แต่ไม่มีตัวไหนตรวจว่าแพลตฟอร์มจะยอม start
    ไฟล์นั้นไหม · ตัวแยกวิเคราะห์ YAML ยอมรับทุกคีย์ที่สะกดถูกตามไวยากรณ์ ส่วน GitHub ปฏิเสธคีย์ที่ไม่อยู่ใน
    schema แล้ว**ล้มทั้ง run ตั้งแต่ก่อนสร้าง job** · เกิดจริงและอยู่ข้ามวัน: `permissions:` ที่ขอ
    scope ซึ่งไม่มีอยู่จริง ทำให้ทั้ง workflow ล้มทุก run และ job ที่อยู่ในนั้น **ไม่เคยรันเลยสักครั้ง**
    · มันเงียบได้เพราะ job นั้นไม่ใช่ required check จึงไม่มีสีแดงบนหน้า PR ใบไหน — **ด่านที่ไม่ได้รัน
    ให้ผลเหมือนด่านที่ไม่มีอยู่ ต่างกันแค่มีเอกสารบอกว่ามันมี**'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_workflow_validity.py
