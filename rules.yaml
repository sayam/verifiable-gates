- id: deploy-deps-cve-audit
  layer: baseline
  pillar: security
  title: The deploy category is audited — nobody else watches the server that takes real requests
  title_th: audit หมวด deploy — server ที่รับคำขอจริงไม่มีใครเฝ้าให้ที่อื่น
