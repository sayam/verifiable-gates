- id: suite-on-three-brands
  layer: business
  pillar: manageability
  title: The whole test suite passes on MySQL 8 and MariaDB 11 for real, not only on SQLite
  title_th: ชุดเทสต์ทั้งชุดผ่านบน MySQL 8 และ MariaDB 11 จริง ไม่ใช่แค่ SQLite
