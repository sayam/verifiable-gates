    ตัวเดียวที่ต้องเก็บค่าจริง · การถอดต้องล้มดังเมื่อคีย์ หาย/ผิด ไม่ใช่คืนขยะ — และข้อความสองกรณีนั้นต้องบอกทางแก้คนละทาง
