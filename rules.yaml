- id: semgrep-sast
  layer: baseline
  pillar: security
  title: SAST with the framework and language rulesets — decided by the report, not by the exit code
  title_th: SAST ด้วย ruleset ของ framework และภาษา — ตัดสินด้วยรายงาน ไม่ใช่ exit code
  born_from: A scan that passes silently looks exactly like a scan that checked nothing — the decider
