    job: lint
    step: lint Dockerfile (hadolint — ADR 0055)
- id: image-os-cve-audit
  layer: baseline
  pillar: security
  title: The image's OS layer is scanned for CVEs and decided against an exception list, in both directions
  title_th: OS layer ของ image ถูกสแกน CVE และตัดสินเทียบรายการยกเว้นสองทิศ
  born_from: 'Governance audit 2026-08-16 (ADR 0054) — the image''s SBOM had eight files and nobody
    scanned the OS layer at all: having an SBOM is not the same as having a reader · a CVE in the
    glibc or openssl inside the image is something we would learn about only when somebody else told
