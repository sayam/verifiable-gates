  title_th: ruff + format + xenon + interrogate + mypy + asvs-worksheet — ratchet ขึ้นทางเดียว
  born_from: Every step carries if !cancelled() because xenon once went red first and hid a mypy failure
    behind it — the first gate to go red must not mask the ones after it.
  born_from_th: ทุก step มี if !cancelled() เพราะ xenon เคยแดงก่อนแล้วบัง mypy ที่แดงอยู่ — ด่านที่แดงตัวแรกห้ามบังตัวหลัง
