- id: plugin-deps-cve-decided
  layer: business
  pillar: security
  title: Every CVE in a plugin's libraries must have been decided (upgraded · removed · or accepted
    with a reason)
  title_th: CVE ในไลบรารีของ plugin ต้องถูกตัดสินแล้วทุกตัว (อัปเกรด · ถอด · หรือรับไว้พร้อมเหตุผล)
  born_from: 'ADR 0025 — a CVE in something removable always has a faster way out than waiting for
    a patch, so it should not stop the core''s pipeline · **but the second half of that sentence ("it
    must be loud enough to notice") was not true**: audit round 13 measured that the signal was an
    annotation on a job that was already green, which nobody reads — so the time to *know* was 90
    days while the remediation window for critical is 7 days from the day you know · two of our own
    policies could not both hold · the fix is not "no CVEs allowed" but "someone must decide", which
    takes minutes down all three paths.'
  born_from_th: 'ADR 0025 — CVE ของของที่ถอดได้ มีทางออกที่เร็วกว่ารอ patch เสมอ จึงไม่ควร หยุด pipeline
    ของ core · **แต่ครึ่งหลังของประโยคนั้น ("ต้องดังพอให้เห็น") ไม่เป็นจริง**: audit รอบ 13 วัดได้ว่าสัญญาณดังใส่
    annotation ของ job ที่เขียว อยู่ ซึ่งไม่มีใครอ่าน — เวลาที่จะ*รู้*จึงเป็น 90 วัน ขณะที่กรอบแก้ของ
    critical คือ 7 วันนับจากวันที่รู้ · สองนโยบายของเราเองพร้อมกันไม่ได้ · ทางแก้ไม่ใช่ "ห้ามมี CVE"
    แต่คือ "ต้องมีคนตัดสิน" ซึ่งใช้เวลาไม่กี่นาทีทั้งสามทาง'
  reference:
    kind: job
    job: plugin-audit
- id: good-first-issue-not-taken-silently
  layer: baseline
  pillar: devx
  title: A pull request closing an issue still labelled good first issue must state why
  title_th: PR ที่ปิด issue ซึ่งยังติดป้าย good first issue ต้องประกาศเหตุผล
  born_from: 2026-08-20 — the issue was labelled good first issue at 12:14Z · the maintainer opened
    their own pull request for the same issue at 16:40Z and merged it at 16:51Z · an outside contributor
    opened theirs at 17:39Z, having started hours earlier · the label stayed on throughout, with no
    assignee and no comment — they lost an afternoon to work that was already closed.
  born_from_th: 2026-08-20 — issue ถูกติดป้าย good first issue เวลา 12:14Z · ผู้ดูแลเปิด PR ของตัวเองทำ
    issue เดียวกัน 16:40Z แล้ว merge 16:51Z · ผู้ร่วมพัฒนาภายนอก เปิด PR ของเขา 17:39Z โดยลงมือมาก่อนหลายชั่วโมง
    · ป้ายยังติดอยู่ตลอด ไม่มี assign ไม่มีคอมเมนต์ — เขาเสียเวลาไปทั้งบ่ายกับงานที่ปิดไปแล้ว
  reference:
    kind: step
    job: lint
    step: issue ที่เปิดให้คนใหม่ ต้องไม่ถูกปิดเงียบ ๆ
- id: a11y-real-browser
  layer: baseline
  pillar: security
  title: Accessibility is checked in a real browser after the CSS has run, in every theme and every
