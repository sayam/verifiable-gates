  pillar: devx
  title: The numbers advertised in the docs are read from the real source (job count, ADR count, coverage
    floor, version on the badge answer)
  title_th: ตัวเลขที่โฆษณาใน docs อ่านจากแหล่งจริง (จำนวน job, ADR, coverage floor, เลขรุ่นในใบตอบ
    badge)
  born_from: 'Three documents said "CI: 21 jobs" while the workflow defined 20 — nobody was being
    untruthful, but nobody was checking · 2026-08-17 repeated it a layer up: the badge answer still
    said v1.5.0 three days after v1.6.0 shipped, although the runbook had a step for updating it —
    **a step with no test reading alongside it goes stale exactly like a number with no test reading
    alongside it**.'
  born_from_th: 'เอกสารสามที่บอก "CI 21 job" ขณะที่ workflow นิยาม 20 — ไม่มีใครให้ข้อมูลที่ไม่จริง
    แต่ไม่มีใครตรวจ · 2026-08-17 ซ้ำอีกชั้น: ใบตอบ badge ยังเขียน v1.5.0 สามจุดหลังออก v1.6.0 แล้ว
    ทั้งที่ runbook มีขั้นตอนให้อัปเดต — **ขั้นตอน ที่ไม่มีเทสต์อ่านคู่ ก็ล้าสมัยเหมือนตัวเลขที่ไม่มีเทสต์อ่านคู่**'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_contributor_docs.py
