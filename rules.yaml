  pillar: security
  title: Secrets that must be readable again are encrypted on disk, and a missing or wrong key fails
    loudly with the reason
  title_th: ความลับที่ต้องอ่านคืนได้ ถูก encrypt บนดิสก์ และคีย์หาย/ผิดต้องดังพร้อมเหตุผล
  born_from: ADR 0046 (phase 15) — a single database dump used to yield every TOTP secret, because
