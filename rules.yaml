  script: checks/scan_install_pinning.py
- id: checkers-proven-two-way
  layer: baseline
  pillar: security
  title: A script that decides pass or fail has tests with a planted violation and with clean input
    · and its report may not contradict itself
  title_th: สคริปต์ที่ตัดสินผ่าน/ไม่ผ่าน ต้องมีเทสต์ planted violation + clean input · และรายงานต้องไม่ขัดกันเอง
  born_from: 'Governance audit round 4 (2026-08-17) — the three deciders of the supply-chain axis
    (`audit_pins` · `audit_image` · `check_semgrep`) had matching test files, but those tests checked
    only the index and the wiring · invert a line of set arithmetic and everything stayed green while
    CI reported "nothing new" forever without deciding anything — the rules we export to others (the
    overlay''s eight checkers) had always been tested in both directions; the deciders we use ourselves
    must not be held to less · **audit round 27, item 3**: `bestpractices.dev` is the one row in the
    provider register that answers "no machine check", and the clock is entirely theirs — they can
    change the criteria while we do nothing and the badge quietly drops a level, with only a 12-month
    review row to chase it · `audit_posture.py` reads the live JSON answer and compares it with the
    percentage table in the documentation (setting the gate up immediately found a real staleness:
    the document said gold 26% while the site answered 57%).'
  born_from_th: 'audit governance รอบ 4 (2026-08-17) — ตัวตัดสินของแกน supply chain สามตัว (`audit_pins`
    · `audit_image` · `check_semgrep`) มีไฟล์เทสต์ชื่อคู่กันจริง แต่เทสต์เหล่านั้นตรวจแค่ดัชนีกับ
    wiring · กลับเงื่อนไข set arithmetic สักบรรทัดแล้วทุกอย่างยังเขียว และ CI รายงาน "ไม่มีอะไรใหม่"
    ตลอดไปโดยไม่ได้ ตัดสินอะไร — กฎที่ export ให้คนอื่น (checker 8 ตัวของ overlay) ถูกทดสอบ สองทิศมาตลอด
    ตัวตัดสินที่เราใช้เองต้องไม่ต่ำกว่านั้น · **audit รอบ 27 ข้อ 3**: `bestpractices.dev` เป็นแถวเดียวในทะเบียนผู้ให้บริการ
    ที่ตอบว่า "ไม่มีเครื่องตรวจ" และนาฬิกาเป็นของเขาล้วน ๆ — เขาแก้เกณฑ์ได้โดยที่เรา ไม่ได้ทำอะไร
    แล้ว badge ลดระดับเงียบ ๆ โดยมีแต่แถวรอบ 12 เดือนคอยทวง · `audit_posture.py` อ่านใบตอบ JSON สดแล้วเทียบกับตารางเปอร์เซ็นต์ในเอกสาร
    (ตอนตั้งด่านก็พบของค้างจริง: เอกสารเขียน gold 26% ขณะที่เว็บตอบ 57%)'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_checker_logic.py
