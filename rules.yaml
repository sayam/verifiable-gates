- id: declared-prohibitions-enforced
  layer: baseline
  pillar: devx
  title: A prohibition a machine can check has a machine checking it — and the gate must quote a rule
    that still exists
  title_th: ข้อห้ามที่เครื่องตรวจได้ ต้องมีเครื่องตรวจ — และด่านต้องอ้างกฎที่ยังมีอยู่จริง
  born_from: 'Audit round 14 counted 61 prohibitions in CLAUDE.md · 51 were machine-checkable · 19
    were sentences only — and none of those 19 had been violated, which means the rules were being
    followed by discipline rather than by mechanism: enough for the person who wrote them, not for
    the next one · the first batch caught something real on its first run: tests/test_metrics_multiproc.py
    created its own tables with no teardown, which on the dialects job means leaving rows behind for
    the next test · audit round 15 added three more and put a ratchet on the register (`enforced_prohibitions`
    in pyproject), because nothing was shrinking the remaining pile and nothing prevented backsliding.'
  born_from_th: 'audit รอบ 14 นับข้อห้ามใน CLAUDE.md ได้ 61 ข้อ · 51 ข้อเครื่องตรวจได้ · 19 ข้อมีแค่ประโยค
    — และทั้ง 19 ข้อยังไม่ถูกละเมิด แปลว่ากติกาถูกทำตามด้วย วินัยไม่ใช่กลไก ซึ่งพอสำหรับคนที่เขียนกฎเอง
    ไม่พอสำหรับคนถัดไป · ด่านชุดแรกจับของจริงตั้งแต่รันครั้งแรก: tests/test_metrics_multiproc.py สร้างตารางเองแล้วไม่มี
    teardown ซึ่งบน job dialects คือการทิ้งแถวค้างไว้ ให้เทสต์ตัวถัดไป · audit รอบ 15 เพิ่มอีก 3 ข้อและใส่
    ratchet ให้ทะเบียน (`enforced_prohibitions` ใน pyproject) เพราะไม่มีอะไรทำให้กองที่เหลือ หดลงเอง
    และไม่มีอะไรกันการถอยกลับ'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_declared_prohibitions.py
- id: stack-images-pinned-and-moved
  layer: baseline
  pillar: security
  title: Stack images are pinned by digest · something moves them · and the mover asks only for digests,
    not new versions
  title_th: image ของ stack ตรึงด้วย digest · มีตัวขยับ · และตัวขยับขอแค่ digest ไม่ใช่รุ่นใหม่
  born_from: 'Audit round 15 — the project had three gates enforcing pinning (action to SHA, base
    image to digest, CI tools by hash) and none of them opened a compose file · measured: 11 images
    pulled by tag, running in 11 of 25 jobs on every push · among them ghcr.io/zaproxy/zaproxy:stable,
    a floating tag that decides a security outcome — so last week''s green dast run cannot be reproduced
    · Dependabot separates docker-compose from docker (which reads only the Dockerfile) and we had
    declared only the latter, so pinning without a mover would have frozen the vulnerabilities in
    place; this gate enforces both halves together · audit round 16 added a third: the mover must
    ignore major and minor bumps — the first batch this ecosystem opened proposed mysql 8 → 26, redis
    7 → 8 and vault 1.18 → 2.0 among nine at once · the reasoning for the ignore rules had lived only
    in a comment, and it was measured that they could be removed with nothing complaining.'
  born_from_th: 'audit รอบ 15 — โปรเจกต์มีด่านบังคับการ pin สามตัว (action → SHA · base image → digest
    · เครื่องมือ CI → hash) และไม่มีตัวไหนเปิดไฟล์ compose · วัดได้ 11 image ถูกดึงด้วย tag และรันใน
    11 จาก 25 job ทุก push · ในนั้นมี ghcr.io/zaproxy/zaproxy:stable ซึ่งเป็น tag ลอยและเป็นตัวตัดสินผลด้าน
    ความปลอดภัย — ผลเขียวของ dast เมื่อสัปดาห์ก่อนจึงทำซ้ำไม่ได้ · Dependabot แยก docker-compose ออกจาก
    docker (ซึ่งอ่านแค่ Dockerfile) เราประกาศไว้แค่ตัวหลังมาตลอด การตรึงโดยไม่มีตัวขยับจึงจะเป็นการแช่
    ช่องโหว่ ด่านนี้บังคับสองข้อคู่กัน · audit รอบ 16 เพิ่มข้อที่สาม: ตัวขยับ ต้อง ignore major/minor
    — ใบแรกที่ ecosystem นี้เปิดให้เสนอ mysql 8 → 26, redis 7 → 8, vault 1.18 → 2.0 พร้อมกันเก้าตัว
    · เหตุผลของการตั้ง ignore เคยอยู่ในคอมเมนต์อย่างเดียว และวัดแล้วว่าถอดออกได้โดยไม่มีอะไรฟ้อง'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_stack_image_pinning.py
- id: test-databases-must-be-throwaway
  layer: baseline
  pillar: security
  title: A test suite's target must declare itself disposable — a suite that drops the schema in every
    fixture must have no way to point at a real database
  title_th: ปลายทางของชุดเทสต์ต้องประกาศตัวว่าเป็นของทิ้ง — ชุดที่ drop schema ทุก fixture ต้องไม่มีทางชี้ฐานจริง
  born_from: 'A review question after audit round 26 — ISO/IEC 27001 `A.8.31`/`A.8.33` had long been
    declared **passing** on the claim that "the fixture refuses real databases" · checking found that
    the thing actually refusing was `scripts/a11y_fixture.py`, which **(a)** is a different path from
    the test suite, **(b)** tests `"instance" in uri` and so catches only the dev SQLite shape, and
    **(c)** declares its own role as `helper`, defined as "decides nothing and is never cited as evidence"
    · meanwhile the most dangerous path — `TEST_DATABASE_URL`, which `CLAUDE.md` tells people to set
    themselves, with every fixture calling `create_all()`/`drop_all()` through it — **had nothing
    guarding it at all**: one typo in the database name permanently drops every table in it · the
    criterion is an allowlist ("the database name must say it is for testing") rather than a blocklist,
    because guessing what a real database looks like is never complete, whereas an allowlist errs
    toward safety.'
  born_from_th: คำถามทบทวนหลัง audit รอบ 26 — ISO/IEC 27001 `A.8.31`/`A.8.33` ถูกประกาศว่า **ผ่าน**
    มานาน โดยอ้างว่า "fixture ปฏิเสธฐานข้อมูลจริง" · ไปตรวจแล้วพบว่าตัวที่ ปฏิเสธจริงคือ `scripts/a11y_fixture.py`
    ซึ่ง **(ก)** เป็นคนละเส้นทางกับชุดเทสต์ **(ข)** เกณฑ์ของมันคือ `"instance" in uri` จึงจับได้เฉพาะรูป
    sqlite ของ dev และ **(ค)** ประกาศบทบาทตัวเองว่า `helper` ซึ่งนิยามคือ "ไม่ตัดสินและไม่ถูกอ้างเป็น
    หลักฐาน" · ขณะที่เส้นทางที่อันตรายที่สุด — `TEST_DATABASE_URL` ที่ `CLAUDE.md` บอกให้คนตั้งเอง
    แล้วทุก fixture เรียก `create_all()`/`drop_all()` ผ่านมัน — **ไม่เคยมีอะไรกันเลย** พิมพ์ชื่อฐานผิดครั้งเดียวคือ
    drop ตารางทั้งฐานอย่างถาวร · เกณฑ์เป็น allowlist ("ชื่อฐานต้องบอกเองว่าเป็นของทดสอบ") ไม่ใช่ blocklist
    เพราะการเดาว่าฐานจริงหน้าตาอย่างไรไม่มีวันครบ ส่วน allowlist ผิดไปทางปลอดภัย
  reference:
    kind: test
    job: test
    tests:
    - tests/test_throwaway_database.py
- id: data-health-is-checkable
  layer: baseline
  pillar: manageability
  title: One command answers which rules the data in the database is breaking *right now* — read-only
  title_th: มีคำสั่งเดียวที่ตอบว่าข้อมูลในฐาน *ตอนนี้* ผิดกติกาข้อไหนบ้าง — อ่านอย่างเดียว
  born_from: 'Audit round 19 — the eighteen preceding rounds examined code, config, documentation,
    CI, registers, and even the tools that check the tools; all of it lives in git · **the data is
    the one thing that is not in git and the one thing users see** · a defect was planted at the data
    layer in a freshly migrated database and measured: an orphaned row passed every command, every
    healthcheck and every job · the string `foreign_key_check` appeared nowhere in the repo, not once
    · of 26 CLI commands, exactly one asked the data whether it was still sound, and it checked only
    the audit chain.'
  born_from_th: 'audit รอบ 19 — สิบแปดรอบก่อนหน้าตรวจโค้ด · config · เอกสาร · CI · ทะเบียน และแม้แต่เครื่องมือที่ตรวจเครื่องมือ
    ทั้งหมดอยู่ใน git · **ข้อมูลเป็นสิ่งเดียว ที่ไม่อยู่ใน git และเป็นสิ่งเดียวที่ผู้ใช้เห็น** · ปลูกความผิดที่ชั้นข้อมูลลงใน
    ฐานที่ migrate สดแล้ววัด: แถวกำพร้าผ่านทุกคำสั่ง ทุก healthcheck และทุก job · คำว่า `foreign_key_check`
    ไม่ปรากฏที่ไหนใน repo แม้แต่ครั้งเดียว · CLI 26 คำสั่ง มีตัวที่ถามข้อมูลว่ายังดีอยู่ไหมอยู่ตัวเดียว
    และมันตรวจแค่สาย audit'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_data_doctor.py
- id: scripts-declare-their-role
  layer: baseline
  pillar: devx
  title: Every script declares its own kind · someone touches it · and what it generates still works
  title_th: สคริปต์ทุกตัวประกาศชนิดของตัวเอง · มีคนแตะ · และของที่ generate มายังใช้ได้จริง
  born_from: Audit round 17 — 83 of 105 gates were decided by code in scripts/, yet its coverage was
    43.8% and 14 files sat at 0% · among them run_gates.py, deliberately tested through a subprocess,
    and generators checked by their output — **so coverage was the wrong instrument for half the files**
    · classifying by kind made it possible to demand the right sort of evidence, and revealed three
    files touched by no test, no workflow and no hook at all (build_eol_table · build_password_blocklist
    · measure_generated).
  born_from_th: audit รอบ 17 — 83 จาก 105 gate ตัดสินด้วยโค้ดใน scripts/ แต่ coverage ของ มันคือ 43.8%
    และ 14 ไฟล์อยู่ที่ 0% · ในนั้นมี run_gates.py ที่ถูกทดสอบผ่าน subprocess โดยตั้งใจ และ generator
    ที่ถูกตรวจที่ผลลัพธ์ — **coverage จึงเป็น เครื่องมือวัดที่ผิดชนิดสำหรับครึ่งหนึ่งของไฟล์** · การจำแนกชนิดทำให้เรียกร้อง
    หลักฐานได้ถูกแบบ และเผยว่ามีสามไฟล์ที่ไม่มีเทสต์ ไม่มี workflow ไม่มี hook แตะเลย (build_eol_table
    · build_password_blocklist · measure_generated)
  reference:
    kind: test
    job: test
    tests:
    - tests/test_script_roles.py
    - tests/test_generated_tables.py
- id: adr-index-complete
  layer: baseline
  pillar: devx
  title: The ADR index covers every record, numbered without repeats or gaps · and supersessions are
    recorded in both directions
  title_th: ดัชนี ADR ครอบทุกใบ เลขไม่ซ้ำไม่มีรู · และการแทนที่ถูกบันทึกสองทิศ
  born_from: 'The index once stopped at 0026 while the files ran to 0033 — seven records from the
    phase that decided the biggest questions, invisible · audit round 14 added the second direction:
    ADR 0035 had superseded item 1 of 0032 since 2026-08-12, but 0032''s own page did not know for
    seven days, while the module docstring at the head of app/audit.py still pointed at 0032 as the
    current mechanism, which CLAUDE.md explicitly forbids returning to.'
  born_from_th: 'ดัชนีเคยหยุดที่ 0026 ขณะที่ไฟล์มีถึง 0033 — เจ็ดใบจากเฟสที่ตัดสินใจ เรื่องใหญ่ที่สุดหายจากสายตา
    · audit รอบ 14 เพิ่มทิศที่สอง: ADR 0035 แทน ข้อ 1 ของ 0032 ตั้งแต่ 2026-08-12 แต่หน้าของ 0032
    ไม่รู้ตัวเจ็ดวัน ขณะที่ docstring หัวไฟล์ของ app/audit.py ชี้มาที่ 0032 ในฐานะกลไกปัจจุบัน ทั้งที่
    CLAUDE.md ห้ามกลับไปใช้กลไกนั้นตรง ๆ'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_adr_index.py
  script: checks/scan_adr_index.py
- id: cadence-not-overdue
  layer: baseline
  pillar: security
  title: The periodic-review schedule is genuinely read; more than 7 days overdue is red · and the
    register of deliberate deferrals keeps up with the ADRs
  title_th: ตารางตรวจตามรอบถูกอ่านจริง เลยกำหนดเกิน 7 วัน = แดง · และทะเบียนของที่จงใจเลื่อนตามทัน
    ADR
  born_from: Periodic work with nothing to chase it is work that quietly stops happening — a due date
    must be a date or a decidable condition, never "when we're ready".
  born_from_th: งานตามรอบที่ไม่มีเครื่องทวงคืองานที่เงียบหายไปเฉย ๆ — กำหนดต้องเป็นวันที่ หรือเงื่อนไขที่ตัดสินได้
    ไม่ใช่ "เมื่อพร้อม"
  reference:
    kind: test
    job: test
    tests:
    - tests/test_cadence.py
- id: ropa-current
  layer: business
  pillar: security
  title: The ROPA, the log inventory and the runbook match the real system
  title_th: ROPA + บัญชี log + runbook ตรงกับระบบจริง
  born_from: An application processing personal data has to be able to say what it keeps, where, and
    for how long — a ROPA that does not match the system is a document that is quietly wrong · raised
    to the business layer per ADR 0057.
  born_from_th: แอปที่ประมวลผลข้อมูลส่วนบุคคลต้องตอบได้ว่าเก็บอะไร ที่ไหน นานเท่าไหร่ — ROPA ที่ไม่ตรงระบบจริงคือเอกสารที่ผิดเงียบ
