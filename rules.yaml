# The rule catalogue this bundle publishes.
#
# A rule is what was learned; a gate is one project's enforcement of it. They are
# separate files because they have separate lifetimes: the enforcement moves when a
# project reorganises its tests, while the rule only changes when reality teaches
# something new. `gates.yaml` in this repository holds the gates this repository is
# itself held to. This file holds what it offers to everybody else.
#
# Every rule carries two languages. English is the published text — it is what the
# rule sheets render and what a reader outside this project can act on. `*_th` is the
# original wording from the reference implementation, kept because a translation of
# an incident report is a retelling, and the retelling is not the record. Nothing here
# is free-floating duplication: the reference implementation checks its own Thai
# against `*_th` byte for byte, so the two cannot drift apart in silence.
#
# `born_from` is the part that matters most. A rule with no incident behind it is
# somebody's preference, and preferences do not deserve a gate.
#
# `reference` says how the reference implementation enforces the rule. It is evidence,
# not instruction: a project adopting a rule writes its own enforcement, and a rule
# with a `script` is one this bundle can decide on its own.
version: 1
rules:
- id: gates-registry-total
  layer: baseline
  pillar: devx
  title: The gate index matches reality in both directions, and every test file is accounted for
  title_th: ดัชนี gate ตรงกับความจริงสองทิศ และไฟล์เทสต์ทุกไฟล์ถูกตัดสิน
  born_from: 'semgrep was scanning only 71 of 136 files because its scope was declared in two places
    — an index nothing holds to reality is an index that quietly reports things that are not true
    · audit round 7 added another field (`guards:` — ADR 0062): a gate that is expensive and has never
    caught anything has to be able to say *which path* it earns its keep on, or the question "is it
    still worth it" is answered by feel every time.'
  born_from_th: 'semgrep เคยตรวจแค่ 71/136 ไฟล์เพราะขอบเขตประกาศสองที่ — ดัชนีที่ไม่ถูกบังคับให้ตรงกับความจริงคือดัชนีที่ให้ข้อมูลที่ไม่จริงเงียบ
    ๆ · audit รอบ 7 ต่ออีกฟิลด์ (`guards:` — ADR 0062): ด่านที่แพงและยังไม่เคยจับอะไรต้องบอกได้ ว่ามันคุ้ม*เส้นทางไหน*
    ไม่งั้นคำถาม "ยังคุ้มไหม" ตอบด้วยความรู้สึกเสมอ'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_gates.py
  script: checks/scan_gates_registry.py
- id: gates-carry-red-evidence
  layer: baseline
  pillar: devx
  title: A new gate arrives with evidence that it went red on a real defect — the list of ones that
    have not can only shrink
  title_th: gate ใหม่ต้องมาพร้อมหลักฐานว่าเคยแดงตอนของเสียจริง — รายการที่ยังไม่มีหดได้ทางเดียว
  born_from: Governance audit round 6 (2026-08-17) — measured across the last 200 runs and found **21
    jobs that had never once gone red**, which from the outside is indistinguishable between "the
    code really is fine" and "the gate checks nothing" · a gate nobody has seen fail is a gate nobody
    has proved checks anything — collect the evidence when it happens, not when you need it.
  born_from_th: audit governance รอบ 6 (2026-08-17) — วัดจาก 200 run ล่าสุดแล้วพบว่า **21 job ไม่เคยแดงเลย**
    ซึ่งแยกไม่ออกจากภายนอกว่า "ของดีจริงจึงไม่แดง" หรือ "ด่านไม่ได้ตรวจอะไร" · ด่านที่ไม่มีใครเคยเห็นแดงคือด่านที่ยังไม่มี
    ใครพิสูจน์ว่ามันตรวจอะไร — เก็บหลักฐานตอนที่มันเกิด ไม่ใช่ตอนที่ต้องใช้
  reference:
    kind: test
    job: test
    tests:
    - tests/test_gate_evidence.py
- id: logic-knows-no-http
  layer: baseline
  pillar: manageability
  title: All logic lives in the service layer and knows nothing about HTTP
  title_th: ตรรกะทั้งหมดอยู่ใน service layer และไม่รู้จัก HTTP
  born_from: Phase 3 — logic buried in routes makes the HTML and the API diverge the instant a second
    adapter exists · an AST scan forbids services importing anything from the request side.
  born_from_th: Phase 3 — ตรรกะที่ฝังใน route ทำให้ HTML กับ API เพี้ยนจากกันทันทีที่มี adapter ที่สอง
    · AST scan ห้าม service import ของฝั่ง request
  reference:
    kind: test
    job: test
    tests:
    - tests/test_service_layer.py
    - tests/test_services.py
  script: checks/scan_service_layer.py
- id: delete-means-soft-delete
  layer: business
  pillar: security
  title: Delete means hide (soft delete) — only purge removes rows for real
  title_th: ลบ = ซ่อน (soft delete) — ลบจริงได้ที่ purge เท่านั้น
  born_from: ADR 0014 — a `--dry-run` implemented as a rollback once deleted real data, because purge
    committed before the savepoint closed · so there must be exactly one place that can delete.
  born_from_th: ADR 0014 — `--dry-run` ที่ implement เป็น rollback เคยลบข้อมูลจริง เพราะตัว purge
    commit ก่อน savepoint ปิด · ที่ลบได้จึงต้องมีที่เดียว
  reference:
    kind: test
    job: test
    tests:
    - tests/test_write_discipline.py
    - tests/test_soft_delete.py
  script: checks/scan_write_discipline.py
- id: every-write-audited
  layer: business
  pillar: security
  title: Every write lands in an append-only audit trail with a hash chain
  title_th: ทุกการเขียนลง audit trail แบบเติมได้อย่างเดียว + hash chain
  born_from: ADR 0015/0035 — an after-flush event catches every insert, update and delete on its own,
    so feature code calls nothing, because "forgot to call it" is among the quietest bugs there is.
  born_from_th: ADR 0015/0035 — event หลัง flush ดักให้เองทุก insert/update/delete โค้ดฟีเจอร์ไม่ต้องเรียกอะไร
    เพราะ "ลืมเรียก" คือบั๊กที่เงียบที่สุด
  reference:
    kind: test
    job: test
    tests:
    - tests/test_audit.py
- id: core-never-names-plugins
  layer: business
  pillar: manageability
  title: The core knows only how to find plugins — no plugin name appears in core code
  title_th: core รู้แค่วิธีค้นหา plugin — ห้ามมีชื่อ plugin ในโค้ด core
  born_from: ADR 0023/0025 — the day the core names a plugin is the day removing that directory breaks
    the system, and the plugin's supply chain is no longer separable from the core's.
  born_from_th: ADR 0023/0025 — วันที่ core เอ่ยชื่อ plugin คือวันที่ถอดไดเรกทอรีแล้วล้มเหลว และ supply
    chain ของ plugin ไม่แยกจาก core อีกต่อไป
  reference:
    kind: test
    job: test
    tests:
    - tests/test_plugins.py
- id: every-column-classified
  layer: baseline
  pillar: security
  title: Every column is assigned a data class in DATA-CLASSIFICATION.md
  title_th: ทุกคอลัมน์ต้องถูกจัดชั้นข้อมูลใน DATA-CLASSIFICATION.md
  born_from: A data class not decided when the column is added gets decided when the data leaks —
    and what the audit trail is allowed to record follows from that class.
  born_from_th: ชั้นข้อมูลที่ไม่ถูกตัดสินตอนเพิ่มคอลัมน์ จะถูกตัดสินเอาตอนข้อมูลรั่ว — audit เก็บอะไรได้ก็ตัดสินจากชั้นนี้
  reference:
    kind: test
    job: test
    tests:
    - tests/test_data_classification.py
- id: every-column-export-decided
  layer: baseline
  pillar: security
  title: 'Every column of an owned table is decided: exported, or listed as not exported with a reason'
  title_th: ทุกคอลัมน์ของตารางที่มีเจ้าของ ต้องถูกตัดสินว่า export หรือไม่ พร้อมเหตุผล
  born_from: ADR 0034 — when each caller deleted on its own, the CLI forgot to clear the second-factor
    secrets entirely · one path plus every column decided means nothing is left behind.
  born_from_th: ADR 0034 — ตอนที่ต่างคนต่างไล่ลบ CLI ลืมล้างความลับของปัจจัยที่สองทั้งดุ้น · ทางเดียว
    + ทุกคอลัมน์ถูกตัดสิน = ไม่มีของหลงเหลือ
  reference:
    kind: test
    job: test
    tests:
    - tests/test_personal_data.py
    - tests/test_close_account.py
- id: models-match-migrations
  layer: baseline
  pillar: manageability
  title: Schema comes only from migrations, and it matches the models exactly
  title_th: schema มาจาก migration เท่านั้น และต้องตรงกับ model เป๊ะ
  born_from: An index that lived in a migration but not in the model was nearly dropped, silently,
    by the next generated migration — while every SELECT in the system depended on it.
  born_from_th: index ที่อยู่ใน migration แต่ไม่อยู่ใน model เคยเกือบถูก `db migrate` รุ่นถัดไป drop
    ทิ้งเงียบ ๆ ทั้งที่ทุก SELECT พึ่งมัน
  reference:
    kind: test
    job: test
    tests:
    - tests/test_migrations.py
- id: dialect-discipline
  layer: baseline
  pillar: manageability
  title: Time columns are stored in UTC at full precision (migrations included) · string columns
    declare a length · written once, runs on every database brand the project targets
  title_th: คอลัมน์เวลาเก็บเป็น UTC เต็มความละเอียด (รวมใน migration) · คอลัมน์ข้อความระบุความยาว · เขียนครั้งเดียวรันได้ทุกยี่ห้อที่โปรเจกต์รองรับ
  born_from: MySQL's DATETIME truncates sub-second precision silently — records created milliseconds
    apart get the same timestamp and then sort in the wrong order · findable only by firing the suite
    at a real brand.
  born_from_th: DATETIME ของ MySQL ตัดเศษวินาทีเงียบ ๆ — งานที่สร้างห่างกันไม่กี่ มิลลิวินาทีได้เวลาเท่ากันแล้วเรียงสลับ
    · เจอได้ก็ต่อเมื่อยิงยี่ห้อจริง
  reference:
    kind: test
    job: test
    tests:
    - tests/test_dialect_parity.py
    - tests/test_db_backend.py
    - tests/test_migration_lint.py
- id: migration-class-declared
  layer: business
  pillar: manageability
  title: Every plugin declares its migration class (live/warm/cold) as its port's rules require
  title_th: ทุก plugin ประกาศ migration class (live/warm/cold) ตรงตามกฎของ port
  born_from: '"Swappable" that never says *how* it swaps is a promise the person on shift has to guess
    at three in the morning — the declared class must be enforced at load time and backed by a measurement.'
  born_from_th: '"สลับได้" ที่ไม่เคยประกาศว่าสลับแบบไหน คือคำสัญญาที่คนหน้างานต้องเดา ตอนตีสาม — class
    ที่ประกาศต้องถูกบังคับตอนโหลด และต้องมีตัวเลขวัดรองรับ'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_migration_class.py
- id: fail-fix-harness-honest
  layer: baseline
  pillar: devx
  title: The developer harness reports the truth, never passes silently, and does not keep a second
    copy of CI's commands
  title_th: harness ของนักพัฒนารายงานตรงความจริง ไม่ผ่านเงียบ ๆ และไม่ลอกคำสั่งของ CI มาเก็บที่สอง
  born_from: 'A harness that reports success while tests are red feeds false confidence to the loop
    that trusts it completely — and the first attempt to prove 11-03 repeated the lesson: a planted
    defect that landed inside a docstring produced "passes when it should be red" without the gate
    being blind at all · audit round 6 added a layer (ADR 0060): a preflight that *copies* CI''s commands
    into itself will drift, and then say "pass" at the exact moment CI is about to say otherwise.'
  born_from_th: 'harness ที่รายงานผ่านตอนเทสต์แดง ป้อนความมั่นใจผิด ๆ ให้ loop ที่เชื่อมัน สนิท —
    และการพิสูจน์ 11-03 รอบแรกก็ย้ำบทเรียนเดิม: plant ที่ตกใน docstring ทำให้ "ผ่านทั้งที่ควรแดง"
    โดยที่ด่านไม่ได้บอด · audit รอบ 6 ต่ออีกชั้น (ADR 0060): preflight ที่ *ลอก* คำสั่งของ CI มาไว้เองจะ
    drift แล้วบอกว่า "ผ่าน" ในจังหวะที่ CI กำลังจะบอกว่าไม่'
  reference:
    kind: test
    job: test
    tests:
    - tests/test_vendored_tooling.py
- id: csrf-guards-every-form
  layer: baseline
  pillar: security
  title: CSRF protects the whole app and is decided before login, always
  title_th: CSRF คุมทั้งแอปและตัดก่อน login เสมอ
  born_from: Ordinary tests switch CSRF off for convenience — without a separate suite that turns
    it on for real, the day `csrf.init_app()` goes missing nothing would catch it.
  born_from_th: เทสต์ทั่วไปปิด CSRF เพื่อความสะดวก — ถ้าไม่มีเทสต์แยกที่เปิดจริง วันที่ `csrf.init_app()`
    หลุดจะไม่มีอะไรจับได้เลย
  reference:
    kind: test
    job: test
    tests:
    - tests/test_csrf.py
- id: session-hardening
  layer: baseline
  pillar: security
  title: Idle and absolute timeouts are checked server-side · the cookie is bound to the current credential
  title_th: idle/absolute timeout ตรวจฝั่ง server · คุกกี้ผูกกับ credential ปัจจุบัน
  born_from: ADR 0020 — an expiry stamped on a cookie is something the client can edit · change the
    password and every cookie issued earlier must die at once, not wait to expire.
  born_from_th: ADR 0020 — วันหมดอายุบนคุกกี้เป็นของที่ client แก้ได้ · เปลี่ยนรหัสผ่านแล้วคุกกี้ใบเก่าทุกใบต้องตายทันที
    ไม่ใช่รอหมดอายุ
  reference:
    kind: test
    job: test
    tests:
    - tests/test_session_security.py
- id: login-rate-limited-two-ways
  layer: baseline
  pillar: security
  title: Login quotas apply per IP and per username · once throttled the answer is 429 even for the
    right password
  title_th: โควตา login ต่อ IP และต่อชื่อผู้ใช้ · โดนกันแล้วต้อง 429 แม้รหัสถูก
  born_from: ADR 0021 — the per-IP dimension alone loses to anyone rotating addresses · and if a correct
    password sails through the gate, whoever is guessing learns immediately that they found it.
  born_from_th: ADR 0021 — มิติต่อ IP อย่างเดียวแพ้คนเปลี่ยน IP ไปเรื่อย ๆ · และถ้ารหัสถูกทะลุด่านได้
    คนไล่เดาจะรู้ทันทีว่าเจอรหัสที่ใช่
  reference:
    kind: test
    job: test
    tests:
    - tests/test_ratelimit.py
    - tests/test_api_ratelimit.py
- id: route-authz-enumerated
  layer: baseline
  pillar: security
  title: Every route is enumerated against the exception list in both directions — a forgotten decorator
    goes red
  title_th: ทุก route ถูก enumerate เทียบรายการยกเว้นสองทิศ — ลืม decorator แล้วแดง
  born_from: Governance audit round 5 (2026-08-17) — the project's first rule was "every route carries
    login_required" with an exception list annotated "these are all of them", but nothing checked
    that list and it was not in fact complete (the route serving enhancement files had been public
    since Phase 4 without being counted) · the old authz test covered the routes its author thought
    of, not every route that exists — OWASP A01 by omission.
  born_from_th: audit governance รอบ 5 (2026-08-17) — กฎข้อแรกของโปรเจกต์คือ "ทุก route ต้องมี login_required"
    พร้อมรายการยกเว้นที่เขียนว่า "มีเท่านี้" แต่ไม่มี ใครตรวจรายการนั้นเลย และมันไม่ครบจริง (route
    ที่เสิร์ฟไฟล์ของส่วนเสริม เปิดสาธารณะมาตั้งแต่ Phase 4 โดยไม่ถูกนับ) · เทสต์ authz เดิมครอบ route
    ที่คนเขียนนึกถึง ไม่ใช่ทุก route ที่มีอยู่ — OWASP A01 ที่เกิดจากการลืม
  reference:
    kind: test
    job: test
    tests:
    - tests/test_route_authz.py
- id: authz-in-service-layer
  layer: baseline
  pillar: security
  title: Authorisation is decided in the service layer, not at the route · someone else's row answers
    404, an insufficient role answers 403
  title_th: ตรวจสิทธิ์ใน service ไม่ใช่ที่ route · ของคนอื่นตอบ 404 บทบาทไม่ถึงตอบ 403
  born_from: ADR 0004/0022 — there are three adapters (HTML, API, CLI), and a gate that lives at the
    route is a gate the next adapter can forget · hiding a menu item is not access control.
  born_from_th: ADR 0004/0022 — มี adapter สามทาง (HTML/API/CLI) — ด่านที่ route คือด่านที่ adapter
    ใหม่ลืมได้ · การซ่อนเมนูไม่ใช่การกันสิทธิ์
  reference:
    kind: test
    job: test
    tests:
    - tests/test_rbac.py
- id: password-policy-nist
  layer: baseline
  pillar: security
  title: The NIST-aligned password policy lives in one place, called by both the CLI and the web
  title_th: นโยบายรหัสผ่านตาม NIST อยู่ที่เดียว ทั้ง CLI และเว็บเรียกตัวเดียวกัน
  born_from: ADR 0019 — NFKC normalisation has to sit in set and check together; the day it happens
    on only one side, anyone whose password is in Thai (the sara am vowel) can no longer log in although
    they typed exactly what they always typed.
  born_from_th: ADR 0019 — normalize NFKC ต้องอยู่ใน set/check คู่กัน เกิดข้างเดียว เมื่อไหร่ คนตั้งรหัสภาษาไทย
    (สระอำ) จะ login ไม่ได้ทั้งที่พิมพ์เหมือนเดิม
  reference:
    kind: test
    job: test
    tests:
    - tests/test_passwords.py
- id: logs-carry-no-pii
  layer: baseline
  pillar: security
  title: Logs are JSON, carry a request id, and record the actor as a username rather than a real
    name
  title_th: log เป็น JSON มี request id และ actor เป็น username ไม่ใช่ชื่อจริง
  born_from: ADR 0011 — the path appears on every log line, a class C6 record kept 90 days — so what
    must never appear in a log needs a test that catches it, not care.
  born_from_th: ADR 0011 — path อยู่ใน log ทุกบรรทัดชั้น C6 (90 วัน) — อะไรที่ห้ามอยู่ใน log จึงต้องมีเทสต์ดัก
    ไม่ใช่ความระวังตัว
  reference:
    kind: test
    job: test
    tests:
    - tests/test_logging.py
- id: csp-no-inline
  layer: baseline
  pillar: security
  title: CSP is pure self — no inline script, style, or handler anywhere
  title_th: CSP เป็น self ล้วน — ไม่มี inline script/style/handler ที่ไหนเลย
  born_from: ADR 0010 — the browser blocks inline content silently with no server-side error, so the
    gate has to read the template files directly rather than wait for symptoms.
  born_from_th: ADR 0010 — browser บล็อก inline เงียบ ๆ ไม่มี error ฝั่ง server — ด่านจึงต้องตรวจไฟล์
    template ตรง ๆ ไม่ใช่รอดูอาการ
  reference:
    kind: test
    job: test
    tests:
    - tests/test_security_headers.py
  script: checks/scan_templates_inline.py
- id: config-fails-loud
  layer: baseline
  pillar: security
  title: A missing SECRET_KEY or an unknown scheme means the app does not start — never a silent fallback
  title_th: ไม่มี SECRET_KEY หรือ scheme ที่ไม่รู้จัก = ไม่ start — ห้ามตกกลับเงียบ ๆ
  born_from: ADR 0026/0030 — production that is misconfigured yet "works" on SQLite fails on the day
    somebody asks for the data that was never there · failing loudly at start-up is always cheaper.
  born_from_th: ADR 0026/0030 — prod ที่ config ผิดแล้ว "ทำงานได้" บน SQLite จะล้มเหลวในวันที่ มีคนถามหาข้อมูลที่หายไป
    · ล้มเหลวดังตอน start ถูกกว่าเสมอ
  reference:
    kind: test
    job: test
    tests:
    - tests/test_config.py
    - tests/test_secrets.py
- id: no-debug-entrypoint
  layer: baseline
  pillar: security
