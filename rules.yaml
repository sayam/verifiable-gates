- id: n-minus-one-served
  layer: baseline
  pillar: manageability
  title: The code at the latest tag must genuinely serve traffic on HEAD's schema (expand–contract)
  title_th: โค้ดของ tag ล่าสุดต้องให้บริการบน schema ของ HEAD ได้จริง (expand–contract)
  born_from: A rolling deploy always has a window where two versions run against one schema — a migration
    that is correct for the new code but kills the old one is downtime nobody announced · a promise
    with no gate running behind it is a promise waiting to go stale (ADR 0048).
  born_from_th: rolling deploy มีจังหวะที่สองรุ่นรันพร้อมกันบน schema เดียวเสมอ — migration ที่ถูกต้องสำหรับโค้ดใหม่แต่ฆ่าโค้ดเก่าคือ
    downtime ที่ไม่มีใคร ประกาศ · สัญญาที่ไม่มีด่านรันหนุนคือสัญญาที่รอวันล้าสมัย (ADR 0048)
  reference:
