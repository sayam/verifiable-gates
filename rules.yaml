  title_th: เดิน migration บนฐานเปล่าแล้วเทียบกับ model — drift ต้องเป็นศูนย์
  born_from: Tests use create_all from the models and therefore cannot see a migration that has gone
    wrong — there has to be a gate that runs the real migrations on an empty database.
  born_from_th: เทสต์ใช้ create_all จาก model จึงมองไม่เห็น migration ที่เพี้ยน — ต้องมีด่านที่เดิน
    migration จริงบนฐานเปล่า
