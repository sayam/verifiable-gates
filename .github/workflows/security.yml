# SAST and secret scanning — as jobs in a file, not switches in a UI. Something
# clicked into place cannot be reviewed and can disappear silently; a job is a
# diff somebody signed. Both rules (`codeql-sast`, `push-secret-scan`) were
# published from this repository and, until 2026-08-29, kept only by others.
#
# Every job declares its own time budget: "hung" and "slow" are different
# symptoms and must not look alike.

name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # CodeQL with the security-extended suite, then a decider: every open alert on
  # this ref is either in the register or dismissed with a reason. CodeQL's own
  # step never fails on a finding — the decision has to be a step that reads.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
        with:
          languages: python, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
        with:
          wait-for-processing: true
      - name: install the hash-pinned tools
        run: pip install --require-hashes -r pins/dev/requirements.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - name: every open alert on this ref has been judged
        run: python -m verifiable_gates.posture --ref "$GITHUB_REF" --register pins/dev/code-scanning-accepted.txt
        env:
          GH_TOKEN: ${{ github.token }}

  # gitleaks over the whole fetched history, every run. The binary is a pinned
  # release verified by its published checksum (the marketplace action carries a
  # commercial EULA; the binary is MIT). The repository is small enough that the
  # whole history costs seconds, so the periodic full scan the rule allows for is
  # simply this scan.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: fetch gitleaks 8.30.1 and verify its checksum
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: no secret in any commit of the history
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
