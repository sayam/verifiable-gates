# The platform's side of the posture — branch protection and the repository
# switches — read with an administrator's token and held to
# pins/dev/posture-declared.json. The rule `platform-posture-verified` was
# published from here while this repository's own protection had been checked
# exactly once, by an outside audit.
#
# Weekly, and on every push to main: a switch changes by a click, not a commit,
# so a push is not the only moment it can drift. The schedule is watched by the
# schedule census — in ci.yml's test job on every push, and in this job's own
# cron since 2026-08-30 — so a cron that stops firing is itself red.
#
# The secret POSTURE_TOKEN is a fine-grained PAT with administration:read on
# this repository. Without it the job exits 2 — "could not look" — never green.

name: posture

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the schedule census below needs each workflow's birthday.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install the hash-pinned tools
        run: pip install --require-hashes -r pins/dev/requirements.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - name: the platform says what the register declares
        run: python -m verifiable_gates.posture --settings pins/dev/posture-declared.json --root .
        env:
          GH_TOKEN: ${{ secrets.POSTURE_TOKEN }}
      # The two clocks that used to tick only when somebody pushed. The census
      # lived in ci.yml's `test` job alone, so with the owner away it stopped
      # with them — and GitHub disables crons after 60 days of no activity, the
      # exact silence it exists to report (re-audit round 26, 2026-08-30). Here
      # it runs on the platform's own cron; the day that cron stops, the
      # platform's e-mail is the notice. The revisit dates in DECISIONS.md are
      # the other clock: red on the day, which needs a run that day.
      - name: every declared schedule is still firing
        if: ${{ !cancelled() }}
        run: python -m verifiable_gates.schedule_census --root .
        env:
          GH_TOKEN: ${{ github.token }}
      # The promise the two watched gates make — "seen within N days" — measured
      # against how long a red actually stood, not checked for shape (re-audit
      # round 7: no gate here declared a watcher, so this census had no subject).
      - name: every watched_by promise held up in practice
        if: ${{ !cancelled() }}
        run: python -m verifiable_gates.red_streak_census --root . --limit 200
        env:
          GH_TOKEN: ${{ github.token }}
      # The gitleaks binary is fetched by URL with our own checksum, so Dependabot
      # never sees it and nothing said when to bump it (re-audit round 15). The
      # upstream signs nothing (no .sig, no attestation — checked 2026-08-30), so
      # this is the mover: red on the cron the week a newer release exists.
      - name: the pinned gitleaks is the latest release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned=$(grep -oE 'gitleaks_[0-9]+\.[0-9]+\.[0-9]+_linux' .github/workflows/security.yml | head -1 | sed -E 's/gitleaks_(.*)_linux/\1/' || true)
          if [ -z "$pinned" ]; then
            echo "FAIL: could not read the pinned gitleaks version out of security.yml — the download line changed shape; fix the grep here (DECISIONS.md: gitleaks-pinned-by-our-checksum)"
            exit 1
          fi
          latest=$(gh release view --repo gitleaks/gitleaks --json tagName --jq .tagName | sed 's/^v//')
          if [ "$pinned" = "$latest" ]; then
            echo "gitleaks $pinned is the latest release"
          else
            echo "FAIL: gitleaks $pinned is pinned but $latest is out — bump the version and the checksum in security.yml (DECISIONS.md: gitleaks-pinned-by-our-checksum)"
            exit 1
          fi
      # The archive, read back: every release has its version on Zenodo under the
      # concept DOI the citation card advertises, and nothing sits there that was
      # not released. Nothing read the archive until 2026-08-30 (re-audit round
      # 24 compared 7 and 7 by hand); the archived copy is the one that cannot
      # be corrected, so a release with no DOI is found the week it happens.
      - name: the archive says what the releases say
        if: ${{ !cancelled() }}
        run: python -m verifiable_gates.zenodo --root .
        env:
          GH_TOKEN: ${{ github.token }}
      - name: no DECISIONS revisit date has passed
        if: ${{ !cancelled() }}
        run: pytest -q tests/test_decisions.py -p no:cacheprovider --no-cov
