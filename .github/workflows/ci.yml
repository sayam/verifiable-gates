# CI ของ repo นี้เอง — ทุก job ประกาศเพดานเวลาของตัวเอง (กติกาเดียวกับ ADR 0067
# ของ reference implementation: "ค้าง" กับ "ช้า" เป็นคนละอาการ)
#
# **ยังไม่มี job `dogfood`** — ตัวที่จะรัน doctor ใส่ repo นี้เองย้ายเข้ามาในขั้น 2
# พร้อม `checks/` · job ที่มีชื่อว่า dogfood แต่ยังไม่มีอะไรให้รัน คือ job เขียวเปล่า ๆ
# ซึ่งเป็นสิ่งที่งานทั้งใบนี้พยายามเลิกทำ

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: ติดตั้งเครื่องมือที่ตรึงด้วย hash
        run: pip install --require-hashes -r pins/dev/requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: ติดตั้งเครื่องมือที่ตรึงด้วย hash
        run: pip install --require-hashes -r pins/dev/requirements.txt
      - name: ติดตั้งแพ็กเกจเอง (ไม่มี dependency ให้ resolve นอกจาก pyyaml ที่ pin แล้ว)
        run: pip install --no-deps -e .
      - name: pytest — พื้น coverage อยู่ใน pyproject (fail_under)
        run: pytest -q --cov

  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # **ตัวตรวจชั่วคราว** — `lint_commits.py` ของ reference implementation ย้ายเข้ามา
      # ในขั้น 3 แล้วจะมาแทนบล็อกนี้ · เขียนไว้ตรงนี้แทนที่จะสร้างไฟล์ที่รู้อยู่แล้วว่า
      # จะถูกลบ · เทียบกับ head ของ PR ไม่ใช่ HEAD (HEAD คือ merge commit ที่ GitHub
      # สร้างให้ ซึ่งข้อความไม่ผ่าน Conventional Commits ทุกใบทั้งที่ไม่ใช่ของใคร)
      - name: Conventional Commits + DCO ของ commit ที่เพิ่มเข้ามาจริง
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
          fi
          status=0
          for sha in $(git rev-list "$RANGE"); do
            subject=$(git show -s --format=%s "$sha")
            body=$(git show -s --format=%B "$sha")
            case "$subject" in
              feat*|fix*|docs*|test*|chore*|refactor*|perf*|build*|ci*|style*|revert*) ;;
              *) echo "FAIL ${sha:0:9}: หัวไม่ใช่ Conventional Commits — $subject"; status=1 ;;
            esac
            if [ "${#subject}" -gt 72 ]; then
              echo "FAIL ${sha:0:9}: หัวยาว ${#subject} ตัว (เกิน 72)"; status=1
            fi
            if ! printf '%s' "$body" | grep -q '^Signed-off-by: .* <.*@.*>$'; then
              echo "FAIL ${sha:0:9}: ไม่มีบรรทัด Signed-off-by — เซ็นด้วย git commit -s"; status=1
            fi
          done
          exit $status
