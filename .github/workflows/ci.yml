# This repository's own CI. Every job declares its own time budget — the same
# rule as the reference implementation's ADR 0067: "hung" and "slow" are
# different symptoms and must not look alike.
#
# **There is deliberately no separate `dogfood` job.** The scanners are run
# against this repository by `tests/test_dogfood.py` inside the `test` job, so a
# second job would be green for the same reason twice — the exact habit this
# project exists to break.

name: CI

on:
  push:
    branches: [main]
  # `edited` is added to the defaults because the `cla` job reads the pull
  # request body: a contributor who fixes the description must get a new run
  # without closing and reopening (the 2026-08-30 re-audit had to). It re-runs
  # every job in this file on a body edit — accepted, the file is small.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install the hash-pinned tools
        run: pip install --require-hashes -r pins/dev/requirements.txt
      # Every step carries `!cancelled()`: the first red must not hide the ones
      # after it (the rule's own incident — xenon red once masked a mypy failure).
      - run: ruff check .
      - run: ruff format --check .
        if: ${{ !cancelled() }}
      - run: mypy src tests
        if: ${{ !cancelled() }}
      # Complexity and docstring coverage — ratchets set where reality was on
      # 2026-08-29 (worst block C, worst module C, average B; docstrings 84%),
      # because a floor above reality is a red nobody reads. Move up only.
      - run: xenon --max-absolute C --max-modules B --max-average B src
        if: ${{ !cancelled() }}
      - run: interrogate src
        if: ${{ !cancelled() }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the schedule census below needs each workflow's birthday,
      # and a shallow clone reports every file as newborn — the free pass the
      # census exists to refuse.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install the hash-pinned tools
        run: pip install --require-hashes -r pins/dev/requirements.txt
      - name: install this package (no dependency to resolve beyond the pinned pyyaml)
        run: pip install --no-deps --no-build-isolation -e .
      - name: pytest — the coverage floor lives in pyproject (fail_under)
        run: pytest -q --cov
      # The About field on the platform produces no diff, so no test ever reads
      # it — this step does, live, every run. The tree's own places are held by
      # tests/test_own_numbers.py inside pytest above.
      - name: the About field says what the repository measures
        run: python -m verifiable_gates.own_numbers --about
        env:
          GH_TOKEN: ${{ github.token }}
      # A declared cron that stopped firing is as quiet as one that never existed.
      - name: every declared schedule is still firing
        run: python -m verifiable_gates.schedule_census --root .
        env:
          GH_TOKEN: ${{ github.token }}

  # The deciders this bundle ships run on this repository too. Until 2026-08-29
  # they did not: `advisories`, `check_issue_handoff`, `preflight` and the harness
  # were tested on fakes and pointed at nobody — the exact gap dogfooding exists
  # to close (the reference implementation measured it at 2.7%).
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install the hash-pinned tools
        run: pip install --require-hashes -r pins/dev/requirements.txt
      - run: pip install --no-deps --no-build-isolation -e .
      # The scanner writes; the decider decides. Its exit code is deliberately
      # not the verdict — a finding already judged must not turn the job red.
      - name: audit the pins, then hold every finding to the register both ways
        run: |
          pip-audit --require-hashes -r pins/dev/requirements.txt --format json \
            --progress-spinner off --output pip-audit.json || true
          python -m verifiable_gates.advisories --kind pip-audit --report pip-audit.json \
            --register pins/dev/advisories-accepted.txt

  handoff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shipped file, under a bare python3, the way a consumer runs it. Not
      # `python -m`: that imports the package, whose `__init__` needs pyyaml, and
      # the first live run of this job went red on exactly that.
      - name: an issue held open for newcomers is not closed out from under them
        run: python3 src/verifiable_gates/check_issue_handoff.py
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # CONTRIBUTING has asked every pull request for a line accepting CLA.md since
  # the first one, and nothing read it — the five-model outside audit of v0.1.0
  # (2026-08-29) listed the promise with no enforcer. Dependabot holds no
  # copyright in a version bump, so its pull requests are skipped, and a skipped
  # required check is a pass on the platform.
  cla:
    # By the pull request's *author*, not the run's actor: a maintainer who re-runs
    # a Dependabot pull request's checks becomes the actor, and the bot's body has
    # no line — a red on a bump for the wrong reason (re-audit round 22, 2026-08-30).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the pull request accepts CLA.md v1, with a name and an address
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          CLA='^I have read and agree to CLA\.md v1\. — [^<>[:space:]][^<>]* <[^<>@[:space:]]+@[^<>[:space:]]+>[[:space:]]*$'
          # The owner signs with the address the commits carry. A private address
          # pasted from somewhere else attributes the acceptance to an identity that
          # has nothing to do with this work — and correcting the body does not take
          # it back, because GitHub keeps the body's edit history (on 2026-09-01 four
          # merged pull requests carried one, and a fifth kept it in its history).
          # Outside contributors are untouched: the CLA wants a real identity from
          # them, and only the owner's own address is fixed by this repository.
          OWN="^I have read and agree to CLA\\.md v1\\. — [^<>]+ <[0-9]+\\+${OWNER}@users\\.noreply\\.github\\.com>[[:space:]]*$"
          if [ "$PR_AUTHOR" = "$OWNER" ] && ! printf '%s\n' "$PR_BODY" | grep -qE "$OWN"; then
            echo "FAIL: the owner's CLA line must carry the noreply address the commits are signed with, <id>+${OWNER}@users.noreply.github.com — a private address here is not the signer of this work, and editing the body afterwards leaves it in the edit history"
            exit 1
          fi
          if printf '%s\n' "$PR_BODY" | grep -qE "$CLA"; then
            echo "CLA.md v1 accepted"
          else
            echo "FAIL: no line 'I have read and agree to CLA.md v1. — <name> <email>' in the pull request description, e.g. I have read and agree to CLA.md v1. — Ada Lovelace <ada@example.org> — the angle brackets are part of the line (CONTRIBUTING.md)"
            exit 1
          fi

  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Inline on purpose. `verifiable_gates.lint_commits` ships for consumers,
      # but this repository's own commit gate stays a shell block so the gate that
      # guards the package does not depend on importing the package. **It must
      # still be the same gate**: the type list and the subject shape below are
      # the module's, and `tests/test_lint_commits.py` runs this block's regex
      # against the subjects the module judges, so the two cannot drift into
      # accepting different histories (an outside audit on 2026-08-29 found
      # `feature:` and `fixup!` passing here while the hook refused them, and a
      # second round found `Signed-off-by:  <@>` passing here for the same reason).
      # Compare against the PR head, not HEAD: on `pull_request` events HEAD is
      # the merge commit GitHub synthesises, whose subject fails Conventional
      # Commits every time and belongs to nobody. Merge commits on the branch are
      # skipped for the same reason the module skips them — their message is the
      # platform's, not a person's.
      - name: Conventional Commits + DCO on the commits this PR actually adds
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
          fi
          TYPES='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          SUBJECT="^($TYPES)(\([[:alnum:]_./-]+\))?!?: [^[:space:]].{0,70}$"
          # The module's SIGN_OFF: a name and an address are both required — a
          # signature with no way to reach the signer certifies nothing. The
          # earlier `.* <.*@.*>` accepted `Signed-off-by:  <@>` (audit, 2026-08-29).
          SIGNOFF='^Signed-off-by: [^<>[:space:]][^<>]* <[^<>@[:space:]]+@[^<>[:space:]]+>[[:space:]]*$'
          status=0
          for sha in $(git rev-list --no-merges "$RANGE"); do
            subject=$(git show -s --format=%s "$sha")
            body=$(git show -s --format=%B "$sha")
            if [ "${#subject}" -gt 72 ]; then
              echo "FAIL ${sha:0:9}: subject is ${#subject} characters (over 72)"; status=1
            fi
            if ! printf '%s' "$subject" | grep -qE "$SUBJECT"; then
              echo "FAIL ${sha:0:9}: subject is not a Conventional Commit — $subject"; status=1
            fi
            if ! printf '%s' "$body" | grep -qE "$SIGNOFF"; then
              echo "FAIL ${sha:0:9}: no Signed-off-by line — sign with git commit -s"; status=1
            fi
            if printf '%s' "$body" | grep -qiE '^(Co-authored-by|Claude-Session):'; then
              echo "FAIL ${sha:0:9}: carries a co-author/session trailer — credit goes to the signer alone"; status=1
            fi
          done
          exit $status
