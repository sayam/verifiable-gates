# This repository's own CI. Every job declares its own time budget — the same
# rule as the reference implementation's ADR 0067: "hung" and "slow" are
# different symptoms and must not look alike.
#
# **There is deliberately no `dogfood` job.** The thing that would run the doctor
# against this repository moves in at stage 2 along with `checks/`. A job named
# after a check it cannot run yet is a job that is green for no reason, which is
# the exact habit this project exists to break.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: install the hash-pinned tools
        run: pip install --require-hashes -r pins/dev/requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: install the hash-pinned tools
        run: pip install --require-hashes -r pins/dev/requirements.txt
      - name: install this package (no dependency to resolve beyond the pinned pyyaml)
        run: pip install --no-deps -e .
      - name: pytest — the coverage floor lives in pyproject (fail_under)
        run: pytest -q --cov

  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # **A stand-in.** The reference implementation's `lint_commits.py` moves here
      # in stage 3 and will replace this block, so writing it inline beats creating
      # a file already known to be deleted. Compare against the PR head, not HEAD:
      # on `pull_request` events HEAD is the merge commit GitHub synthesises, whose
      # subject fails Conventional Commits every time and belongs to nobody.
      - name: Conventional Commits + DCO on the commits this PR actually adds
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
          fi
          status=0
          for sha in $(git rev-list "$RANGE"); do
            subject=$(git show -s --format=%s "$sha")
            body=$(git show -s --format=%B "$sha")
            case "$subject" in
              feat*|fix*|docs*|test*|chore*|refactor*|perf*|build*|ci*|style*|revert*) ;;
              *) echo "FAIL ${sha:0:9}: subject is not a Conventional Commit — $subject"; status=1 ;;
            esac
            if [ "${#subject}" -gt 72 ]; then
              echo "FAIL ${sha:0:9}: subject is ${#subject} characters (over 72)"; status=1
            fi
            if ! printf '%s' "$body" | grep -q '^Signed-off-by: .* <.*@.*>$'; then
              echo "FAIL ${sha:0:9}: no Signed-off-by line — sign with git commit -s"; status=1
            fi
          done
          exit $status
