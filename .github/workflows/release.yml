# A release carries what it was built from, and proof that CI built it.
#
# The rule `release-signed-and-attested` was published from this repository
# with `v0.1.0` and `v0.1.1` carrying neither an SBOM nor a signature: a
# downloader could not tell the wheel came from CI at all, and a wheel built on
# somebody's laptop cannot say what it was built from even if signed. So: the
# wheel and the sdist are built here, the SBOM is generated from a clean
# environment holding that wheel, both are attested keyless (Sigstore, through
# GitHub's attestation service), and **verified in both directions before
# anything is attached** — the real wheel must verify, and a copy with one byte
# appended must be refused. A verifier that has never been seen refusing is a
# verifier nobody has proved reads anything.
#
#     gh attestation verify verifiable_gates-<v>-py3-none-any.whl --repo sayam/verifiable-gates
#
# is how a downloader checks the same thing later.
#
# The same wheel and sdist — the bytes that verified, nothing rebuilt — then go
# to PyPI by trusted publishing (OIDC, no long-lived token anywhere), so that
# `pip install verifiable-gates` names something that exists: until 2026-09-04
# the README said it and the index answered 404. `skip-existing` keeps a
# re-dispatch against a tag already on the index from failing after the assets
# were re-attached; the SBOM stays on the release page, where it is an asset,
# not a distribution.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: an existing release tag to build, attest and attach assets to
        required: true

permissions:
  contents: read

jobs:
  release-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      # Two trees: the tools come from the commit this workflow runs on (its
      # pins), the artifact from the tag. Checking out only the tag and taking
      # its pins failed on the first run — a tag cut before a tool was pinned
      # cannot carry the tool that attests it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          path: tagged
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install the hash-pinned tools
        run: pip install --require-hashes -r pins/dev/requirements.txt
      # `--no-isolation`: `build` would otherwise create a fresh environment and
      # `pip install` the backend from the index, unpinned, inside the job that
      # holds `id-token: write` — the rule `ci-tools-hash-pinned`, unkept here
      # until 2026-08-30. The backend now comes from the hash-pinned tools.
      - name: build the wheel and the sdist from the tagged tree, with the pinned backend
        run: python -m build --no-isolation tagged --outdir dist
      - name: the SBOM, from a clean environment holding exactly that wheel
        run: |
          set -euo pipefail
          python -m venv --without-pip sbom-env
          pip --python sbom-env/bin/python install --require-hashes -r pins/runtime/requirements.txt
          pip --python sbom-env/bin/python install --no-deps --no-build-isolation ./dist/*.whl
          cyclonedx-py environment sbom-env/bin/python --of JSON -o dist/sbom.cdx.json
          python -c "import json; c=json.load(open('dist/sbom.cdx.json'))['components']; n=[x['name'] for x in c]; assert 'verifiable-gates' in n and 'PyYAML' in n, n; print(n)"
      # The v0.3.0 wheel was attested, verified, published — and could not install its
      # own bundle (`local/*.default` absent; found 2026-09-05 from a fresh venv). The
      # SBOM environment holds exactly that wheel, so it is the one to ask.
      - name: the same wheel installs the bundle into an empty project, and the doctor answers
        run: |
          set -euo pipefail
          mkdir fresh-project && git -C fresh-project init -q
          cd fresh-project
          ../sbom-env/bin/python -m verifiable_gates.install .
          python3 tools/gates_doctor.py --installed
          python3 tools/gates_doctor.py
      - name: attest build provenance for the wheel and the sdist
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: attest the SBOM against the wheel
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: dist/sbom.cdx.json
      - name: verify in both directions before anything is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          gh attestation verify "$WHEEL" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$WHEEL" --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom
          gh attestation verify dist/*.tar.gz --repo "$GITHUB_REPOSITORY"
          cp "$WHEEL" tampered.whl && printf 'x' >> tampered.whl
          if gh attestation verify tampered.whl --repo "$GITHUB_REPOSITORY"; then
            echo "a tampered wheel verified — the verifier reads nothing"; exit 1
          fi
          echo "the real wheel verifies, the tampered copy is refused"
      - name: attach the wheel, the sdist and the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/sbom.cdx.json --clobber
      - name: the distributions that verified, and only those, for the index
        run: |
          set -euo pipefail
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
          ls -l pypi-dist
      - name: publish the same wheel and sdist to PyPI by trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist
          skip-existing: true
          print-hash: true
