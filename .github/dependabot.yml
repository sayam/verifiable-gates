# **A pin nobody moves is a vulnerability kept on ice.** Everything pinned needs
# someone moving it — the same rule as the reference implementation's pins/README.md
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/pins/dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
