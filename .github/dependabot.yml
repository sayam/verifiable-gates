# **A pin nobody moves is a vulnerability kept on ice.** Everything pinned needs
# someone moving it — the same rule as the reference implementation's pins/README.md
#
# **The prefix is a type the commit gate accepts.** Dependabot's default subject
# ("Bump x from a to b") is not a Conventional Commit, so every bump would have
# been red at `commit-lint` — the rule `dependabot-fits-the-gates` this repository
# publishes, found unkept here on 2026-08-29 before the first bump ever opened.
# Dependabot signs its commits (`Signed-off-by: dependabot[bot]`), so the DCO half
# of the gate needs no exception. `tests/test_lint_commits.py` holds each prefix
# to the module's type list.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/pins/dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
