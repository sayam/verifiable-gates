[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-gates"
version = "0.3.1"
description = "CI gates that carry evidence of having gone red on a real defect, and the same rules as an agent skill: nine checkers decide part of the catalogue, the rest is written for an agent to read."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Both licences travel with the wheel: the code is Apache-2.0, the rules and
# documentation CC BY 4.0 (see README). A wheel carrying only the first says the
# catalogue inside it is something it is not.
license-files = ["LICENSE", "LICENSE-docs"]
authors = [{name = "Sayam Sriphua"}]
keywords = ["governance", "secure-by-default", "compliance", "ai-agents", "software-supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/sayam/verifiable-gates"
Source = "https://github.com/sayam/verifiable-gates"
"Reference implementation" = "https://github.com/sayam/flask-todolist"

[tool.setuptools.packages.find]
where = ["src"]

# The bundle travels with the package: a manifest, the defaults it installs, and
# the starting workflow. Without this they are absent from a built wheel and
# `install.py` fails only for people who installed rather than cloned. A glob here
# does not descend: `*.default` misses `local/*.default`, and the v0.3.0 wheel on
# PyPI refused to install for exactly that (found 2026-09-05, from a fresh venv).
# `tests/test_install_and_doctor.py` expands these the way setuptools does and
# holds them to the manifest's ship list.
[tool.setuptools.package-data]
verifiable_gates = ["overlay.json", "*.default", "ci-template.yml", "local/*.default"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # pydocstyle: docstrings here explain *why*, in prose, and its punctuation and
    # imperative-mood rules fight that. Docstring coverage is a separate concern.
    "D",
    # prose uses em-dashes and curly quotes on purpose
    "RUF001", "RUF002", "RUF003",
    # a message written inline at the raise reads better than one hoisted to a name
    "EM101", "EM102", "TRY003",
    # conflicts with ruff format, per its own guidance
    "COM812", "ISC001",
    # the licence is declared once for the repository, not in a per-file header
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# The scanners' entire interface is "print findings to stdout, exit non-zero if
# there were any", and they are run as `python3 scan_x.py <root>` by a target
# project that has installed nothing. Both rules below describe that contract
# rather than a defect, so they are turned off for the directory with a reason
# here — not sprinkled as 32 per-line suppressions, which would make the
# suppression count say something untrue about how much is switched off.
"src/verifiable_gates/checks/*.py" = [
    "T201",     # print IS the output channel; there is no logger in a copied file
    "PLR2004",  # `len(sys.argv) != 2` — the argument count is the CLI contract
]
# The doctor and the installer are command-line tools whose whole job is to
# report to a person reading CI output. Same reason as above, same honesty about
# it being a directory-level decision rather than 30 per-line suppressions.
"src/verifiable_gates/gates_doctor.py" = ["T201"]
"src/verifiable_gates/preflight.py" = ["T201"]
"src/verifiable_gates/skill.py" = ["T201"]
"src/verifiable_gates/harness.py" = ["T201"]
"src/verifiable_gates/install.py" = ["T201"]
"src/verifiable_gates/lint_commits.py" = ["T201"]
"src/verifiable_gates/proved_by_refs.py" = ["T201"]
"src/verifiable_gates/check_issue_handoff.py" = ["T201"]
"src/verifiable_gates/skeleton.py" = ["T201"]
"src/verifiable_gates/schedule_census.py" = ["T201"]
"src/verifiable_gates/red_streak_census.py" = ["T201"]
"src/verifiable_gates/removals.py" = ["T201"]
"src/verifiable_gates/rerun_census.py" = ["T201"]
"src/verifiable_gates/measure_apps.py" = ["T201"]
"src/verifiable_gates/own_numbers.py" = ["T201"]
"src/verifiable_gates/advisories.py" = ["T201"]
"src/verifiable_gates/posture.py" = ["T201"]
"src/verifiable_gates/zenodo.py" = ["T201"]
"tests/**" = [
    "INP001",   # tests are not a package; pytest finds them via pythonpath
    "S101",     # assert is the whole point of pytest
    "PLR2004",  # a bare number in a test is the expected value, clearer than a name
]

# ---------------------------------------------------------------- interrogate
[tool.interrogate]
# Docstring coverage over the package. **The floor is where reality was when the
# tool arrived (84.0% on 2026-08-29), not an aspiration** — like every ratchet
# here it moves up only, and a floor set above reality is a red nobody reads.
fail-under = 84
exclude = ["tests"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
# **strict from this repository's first line** — unlike the reference
# implementation, which has to raise it module by module because strict arrived
# after the code. A ratchet that starts at the top needs nobody to turn it.

# ---------------------------------------------------------------- pytest / coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src/verifiable_gates"]
branch = true

[tool.coverage.report]
# The floor starts at 100 because this repository started empty: nothing without
# a test has ever been committed. **One way only**, like every ratchet — lowering
# it is a decision someone signs, not a convenience.
fail_under = 100
show_missing = true
exclude_also = [
    # The `__main__` guard of every scanner IS tested — `test_a_copied_scanner_runs_and_reports`
    # copies the file somewhere the package cannot be imported from and runs it with the
    # interpreter, which is the only way to prove the claim that a copied file works. That
    # happens in a subprocess, which this measurement does not see. Excluding it here, once
    # and with the reason, beats eight scattered pragmas that each say nothing.
    'if __name__ == "__main__":',
]
