# Hooks for a project that installed the bundle, for `repo: https://github.com/sayam/verifiable-gates`
# in its .pre-commit-config.yaml. Every entry runs what **that project installed** under
# tools/ — never a copy from this repository's checkout, which is why each is
# `language: system` — so bumping `rev:` here changes nothing about what the project is
# held to (DECISIONS.md ci-runs-the-bundle-the-project-installed). `gates-doctor` runs
# every installed scan; the others run one scanner each, by the id of the rule it decides,
# for a project that wants them one at a time. A scanner exits 2 when it could not look;
# pre-commit fails the commit on that too, which is right — "could not check" is not a pass.
# Every `entry` is guarded: a project with no bundle under tools/ gets the sentence the action
# prints — "no bundle installed under . — … (python -m verifiable_gates.install)" — and exit 2,
# not `python3: can't open file` (round 24, 2026-09-05). The `description:` says the same before
# the click, where `pre-commit` shows it.


- id: gates-doctor
  name: verifiable-gates — every installed scan
  description: >-
    Every scan the project installed under tools/, run by its own gates_doctor.py; exits 2 with a sentence when nothing is installed. Install first: python -m verifiable_gates.install <project>. Cost: every hook here is always_run, so each commit re-reads the whole tree however small the change — about 0.4 s of interpreter starts plus roughly 1.6 ms per Python file under src_path, which was 2.5 s at 907 modules and 14.5 s at 7256 (measured 2026-09-05). Most of it is delete-means-soft-delete, which reads every module.
  entry: >-
    bash -c 'test -f tools/gates_doctor.py || { echo "verifiable-gates: no bundle installed under . — this hook runs the doctor a project installed (python -m verifiable_gates.install); it carries no copy of its own" >&2; exit 2; }; python3 tools/gates_doctor.py --root .'
  language: system
  pass_filenames: false
  always_run: true

- id: actions-sha-pinned
  name: verifiable-gates — actions-sha-pinned
  description: >-
    The scanner for rule actions-sha-pinned the project installed under tools/checks/; exits 2 with a sentence when nothing is installed. Install first: python -m verifiable_gates.install <project>
  entry: >-
    bash -c 'test -f tools/checks/scan_workflow_pinning.py || { echo "verifiable-gates: no bundle installed under . — this hook runs the scanner a project installed (python -m verifiable_gates.install); it carries no copy of its own" >&2; exit 2; }; python3 tools/checks/scan_workflow_pinning.py .'
  language: system
  pass_filenames: false
  always_run: true

