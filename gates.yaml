  - id: the-pins-are-audited-here
    title: The tools this repository installs for itself are audited for advisories, and every finding is judged
    kind: job
    severity: blocking
    enforced_by: {job: advisories}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      This repository ships `advisories.py` — the decider that holds a scanner's
      findings to a register of accepted ones in both directions — and until
      2026-08-29 ran no scanner over its own pins. Forty hash-pinned packages,
      including the interpreter's own tooling, sat unaudited while the rule
      `ci-tools-cve-audit` was published from the same tree. The job lets
      `pip-audit` write and the decider decide: the scanner's exit code is not the
      verdict, because a finding already judged that still turns a job red is the
      check that gets switched off within a fortnight.
    proved_by:
      - kind: mutation
        ref: pr/42
        date: 2026-08-29
        caught: >-
          The command line red on a report carrying an unjudged advisory, red on a
          register entry that no finding matches any more, and green only when the
          two agree — with the scanner's own verdict overridden by `|| true` so the
          decider is the one that decides.
      - kind: ci-red
        ref: run/33266155590
        date: 2026-08-30
        caught: >-
          The job's first live red, on the throwaway pull request #71: an exemption
          planted in `advisories-accepted.txt` that no finding matched was refused
          with "the register accepts this and no scan reports it any more". Until
          then the job had been green on all 67 of its runs with an empty register,
          the one job here never seen red on the platform (re-audit census, 2026-08-30).

