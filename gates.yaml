  - id: every-commit-is-shaped-and-signed
    title: Every commit added by a branch is a Conventional Commit and carries a sign-off
    kind: job
    severity: blocking
    enforced_by: {job: commit-lint}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation learned both halves the hard way. A required check that
      gets skipped leaves a pull request BLOCKED forever with nothing red to see, so the job
      runs on what the branch actually adds rather than on the whole history. And the sign-
      off is the one thing a project cannot add retroactively: it is a statement by the
      person who wrote the commit, at the time they wrote it, and it was the single unmet
      item of OSPS Baseline level 2 there. On 2026-09-01 the pull request that had carried
      this row's first proof was deleted, with eight others, so that GitHub could garbage-
      collect commits whose metadata held a private address by mistake (support ticket
      4717542): the address had to become unreachable, and a pull request referencing those
      commits is a reference. What that first proof caught is kept here, where it needs no
      link. On 2026-08-25 it was a live red: it refused commit 3a08fd10c — a subject of 73
      characters, one over the limit — and held the pull request until it was rewritten.
    proved_by:
      - kind: ci-red
        ref: run/33367065649
        date: 2026-08-31
        caught: >-
          The same catch, later and still readable: on the branch `fix/yaml-shapes-read` the
          job printed `FAIL 0c57d127c: subject is 73 characters (over 72)` and held the pull
          request until the subject was rewritten. A one-character overrun is the whole
          class — the limit either binds at 73 or it is decoration.
  - id: the-static-battery-runs-on-every-push
    title: Lint, formatting and types are decided by CI, not by whoever remembered to run them
    kind: job
    severity: blocking
    enforced_by: {job: lint}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A check that only runs where somebody remembers to run it is a check that
      stops running on the busiest day. The battery is one job so that a single red
      answer names every static problem at once, rather than one per push over three
      pushes.

      **This gate has never gone red, and carries no `proved_by` because of it.**
      It has run on every push since the repository's first, and every finding it
      would have caught was caught locally first — the rule catalogue's branch had
      six, and `ruff` reported all six before the branch was pushed. That is a good
      outcome and a weak proof: a job that has never failed is indistinguishable
      from a job that checks nothing, which is the very thing
      `gates-carry-red-evidence` says out loud. The honest record is this
      paragraph, not a citation of a run that did not happen. The two real red runs
      in this repository's history are on `test` and `commit-lint`, and they are
      cited by the gates that own them.
    proved_by:
      - kind: ci-red
        ref: pr/43
        date: 2026-08-29
        caught: >-
          xenon at the aspirational thresholds (A/A/A) was red on 23 blocks and 17
          modules before the step was added — so the floor was set where reality
          stood (C/C/B, docstrings 84%) and recorded as a ratchet, and every step
          carries `!cancelled()` so the first red cannot hide the next.

  - id: the-worksheet-keeps-its-verdicts
    title: The ASVS worksheet is refreshed from a pinned standard, and the crosswalk is derived — neither ever writes a verdict
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_asvs_worksheet.py, tests/test_gates_crosswalk.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation's first worksheet generator did not cut the head of the
      document before reading rows — and the preamble held a backlog table whose rows begin
      with the very same requirement ids. It rewrote those rows in the assessment table's
      shape, silently, because the result was still a valid markdown table. The generator's
      whole contract is that a refresh is not a reset: every status and evidence a person
      wrote survives, a requirement the standard dropped leaves, a new one arrives
      *unassessed* rather than passed. The crosswalk is the same contract from the other
      side — it is derived one way from the rows' evidence through the registry's partition,
      so a mapping written by hand (a third place to drift) never exists, and a row nothing
      runs for is listed as such rather than folded in. On 2026-09-01 the pull request that
      had carried this row's first proof was deleted, with eight others, so that GitHub
      could garbage-collect commits whose metadata held a private address by mistake
      (support ticket 4717542): the address had to become unreachable, and a pull request
      referencing those commits is a reference. What that first proof caught is kept here,
      where it needs no link. On 2026-08-28 it was five mutations red — a rebuild that drops
      existing verdicts, a reader that does not cut the preamble above the marker (the
      original bug), a crosswalk that stops mapping `ci:job` evidence, a render that ignores
      the levels in scope, and a passed-rows reader that answers empty instead of loud when
      nothing passes.
    proved_by:
      - kind: mutation
        ref: pr/208
        date: 2026-09-01
        caught: >-
          Re-proved on the tree as it stands: `existing_verdicts` made to return nothing — a
          rebuild that forgets what a person wrote — turned three tests red, among them
          `test_a_rebuild_keeps_every_verdict_a_person_wrote_and_the_preamble` and
          `test_a_requirement_the_standard_dropped_leaves_the_table`.
