          ANSI escapes let through; bidi overrides let through; the whole-line wrap reduced
          to names again; round 15's own `backslashreplace` dropped; the doctor printing a
          scanner's stdout raw; and its stderr passed through raw. The one that matters here is the second: a
          single copy weaker than the other nine is red, because the ten copies of the
          guard are held to the same code — read as AST, since the docstrings differ on
          purpose — and each is run for real against a newline, a carriage return, an ANSI
          escape, a NUL, a C1 byte, a bidi override and a zero-width space. A copy is only
          as good as the test that holds it (L-0119).
      - kind: mutation
