  - id: the-working-is-held-by-what-it-names
    title: A practice in the working catalogue names the lesson behind it, what holds it, and where it held
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_working_catalogue.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Twenty-one rounds of the project auditing itself were cheap for one reason that
      lived nowhere a consumer could take it: the way the work was done — a ledger written
      in the turn a lesson appeared, a fix landed in three phases with the proof row on the
      critical path, a mutation watched rather than assumed, a race measured after the fix
      and not only before. All of it sat in a private ledger of 148 entries and a local
      instruction file, both excluded from git on purpose. A second catalogue,
      `working.yaml`, carries the practices that held, and the danger of such a file is
      exactly the one this repository is organised against: it grows by a good idea. So a
      practice is held to the same two kinds of evidence a rule and a gate are —
      `born_from` must be a ledger entry with its id, its date and what it cost, and
      `held_on` must name at least three pull requests where it was applied and nothing had
      to be re-learned (the owner's number, 2026-09-04). `held_by` says honestly what stands
      behind it, and a name it gives must be a file the bundle ships: on the day the file was
      written, nine of ten practices were held by nothing but the agent reading them, and the
      file says so rather than promising a template that had not shipped yet.
    proved_by:
      - kind: mutation
        ref: pr/242
        date: 2026-09-04
        caught: >-
          The working became a thing a project can turn on, and the danger is the whole
          shape of it: a bundle that landed somebody else's ledger unasked, or a doctor
          that graded one. Ten planted defects red on their own across the three files
          that hold this: the two templates landing **without** `--working`; a second
          install overwriting a ledger somebody had written in; a project that did not ask
          never being told the practices exist; the installer **writing** the `.gitignore`
          line instead of printing it; the doctor's state line always saying *on*;
          `--working` made to fail when there is no ledger, turning a decision into a
          finding; `--working` accepted beside another question; the holder dropped from
          every printed practice; the manifest's copy of the practices drifting from
          `working.yaml`, so the doctor would print a practice nobody wrote; and a practice
          claiming a template the bundle does not ship. One is this gate's, and it is the
          guard written in the change before this one doing its job on the templates this
          one ships: two practices moved from `held_by: reading` to `held_by: file` **in
          the same change** that landed the files they name, and a name pointed at a file
          the manifest does not ship is refused. A holder is only checkable on the day it
          is claimed.
      - kind: mutation
        ref: pr/240
        date: 2026-09-04
        caught: >-
          The validator with each of its refusals removed in turn, against the planted
          defects in the test file: the ledger-shape check on `born_from` dropped (a
          sentence of prose accepted as a lesson), the floor on `held_on` lowered to one,
          a `held_on` ref of any shape accepted, `held_by` outside the three accepted, a
          `tool` holder accepted without saying which, a named tool the bundle does not
          ship accepted, a practice given a `pillar` or a Thai column accepted, and the
          working branch of `problems()` removed altogether so a practice fell through to
          the rule checks and was refused for missing a pillar it must not have. Each red
          on its own, and the published catalogue's ninety-two rules untouched by every one.
          Run against the whole suite as well, from a green baseline, this file is the only
          one that catches any of them — the first sweep said otherwise and was wrong, for
          a reason worth the sentence: the suite was already red on a register this change
          had moved and not written down, and a sweep that records which files failed
          attributes that red to every mutation (L-0148).
  - id: a-published-rule-carries-its-origin
    title: A published rule names the incident behind it, belongs to a published layer, and names no framework
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_rules_catalogue.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The registry handover split what was one file in the reference
      implementation into two, because a rule and its enforcement have different
      lifetimes. Enforcement moves whenever a project reorganises its tests and is
      written in that project's framework; the rule changes only when reality
      teaches something new. Keeping both in one file worked while there was one
      project, and stops working the moment a second adopts a rule: its
      `enforced_by` would point at files that project does not have, and a
      registry whose rows point at nothing is the thing this bundle exists to
      prevent. Three invariants are enforced rather than left to a reader, and
      each is a mistake that is easy to make and silent once made. A rule with no
      `born_from` is somebody's preference, and years later nobody can tell
      whether the conditions that created it still hold, so it can never be
      retired. A rule at layer `internal` is tied to one architecture, and
      publishing it as universal is an overclaim — a governance audit of the
      reference implementation measured five rules carrying the wrong label, so
      the catalogue cannot express the value at all. And a rule naming one stack's
      library means nothing to a reader on another stack while still claiming to
      be universal; the `reference` block is exempt on purpose, because naming
      that project's own files is what makes it evidence.
    proved_by:
      - kind: mutation
        ref: pr/9
        date: 2026-08-25
        caught: >-
          Eight mutations red — admitting `internal` into the published layers,
          dropping `born_from` from the required fields, disabling the framework
          scan outright, extending it into the `reference` block so a cited
          filename became a violation, skipping the duplicate-id check, accepting
          a `script` the bundle does not ship, allowing `..` in a script path, and
          reading a catalogue whose version this reader does not speak.
      - kind: mutation
        ref: pr/77
        date: 2026-08-30
        caught: >-
          A rule's `script:` line deleted, the manifest's entry turned from `scan`
          to `suite`, and the path changed on one side — three mutations, each red.
          Before the test, the first of these left all 1121 tests green in a
          worktree (re-audit round 16).
      - kind: mutation
        ref: pr/119
        date: 2026-08-30
        caught: >-
          The unknown-key check switched off — `portable: true` and a stray
          key on a rule accepted again, red twice; `portable` no longer told
          apart, red; `portable: true` planted in `rules.yaml` itself, red in the
          schema test and the README example. An outside audit wrote both keys
          on 2026-08-30 and the schema said nothing.
      - kind: mutation
        ref: pr/245
        date: 2026-09-04
        caught: >-
          Three planted defects red against `reads`, the sentence a scripted rule
          carries to say what its scanner reads: the catalogue's copy drifted from
          the scanner's `READS`, the scanner's `READS` drifted from the catalogue,
          and the validator made to accept a scripted rule that says nothing
          (self-audit round 22, F2 — a Go project could not tell before running
          which of the nine rules could ever apply to it).
      - kind: mutation
        ref: pr/278
        date: 2026-09-05
        caught: >-
          The withdrawal schema, planted six ways: a `retracted` with no reason, one with no
