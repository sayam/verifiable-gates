          one census counted zero failures over thirteen, the other raised.
      - kind: mutation
        ref: pr/155
        date: 2026-08-31
        caught: >-
          A record with every key and the wrong kinds behind them — `failures`
          a string, a number or null, `attempt` a string, `created_at` a
          number or a word — read as a history and raised from inside the
