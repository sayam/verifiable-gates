  - id: commit-messages-are-shaped-and-signed
    title: Every commit a branch adds is a Conventional Commit and carries a DCO sign-off
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_lint_commits.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      This decider blocks every commit on a developer's machine and every pull request in
      CI, so both directions are expensive: a false red teaches people to reach for `--no-
      verify`, and a false green lets malformed history in permanently. The reference
      implementation learned three separate lessons into it — a required check that gets
      skipped leaves a pull request BLOCKED with nothing red to see, so it runs on what the
      branch actually adds; a merge commit's message is the platform's rather than a
      person's, so those are excluded or the "Update branch" button turns the gate red with
      nobody having typed anything wrong; and the sign-off is the one thing a project cannot
      add retroactively on somebody's behalf. On 2026-09-01 the pull request that had
      carried this row's first proof was deleted, with eight others, so that GitHub could
      garbage-collect commits whose metadata held a private address by mistake (support
      ticket 4717542): the address had to become unreachable, and a pull request referencing
      those commits is a reference. What that first proof caught is kept here, where it
      needs no link. On 2026-08-25, running in this repository's own CI, it refused commit
      3a08fd10c — a subject of 73 characters, one over the limit — and held the pull request
      until it was rewritten.
    proved_by:
      - kind: mutation
        ref: pr/15
        date: 2026-08-26
        caught: >-
          Six mutations red — counting the subject in bytes rather than characters
          (which shortens the limit to a third for anybody writing in a non-Latin
          script), holding merge commits to the format, accepting a sign-off with
          no address to reply to, separating log records by newline so a multiline
          body became several commits, skipping the sign-off check in hook mode,
          and returning zero whatever was found.
      - kind: mutation
        ref: pr/59
        date: 2026-08-29
        caught: >-
          The CI block restored to its `.* <.*@.*>` sign-off grep: all ten
          sign-off cases red (no `SIGNOFF=` line to bind). Then only the new
          `SIGNOFF` loosened to that old shape: red on `Signed-off-by:  <@>`,
          which the module refuses and the old grep accepted, and on trailing
          spaces after the address. Restored byte for byte, 62 green.
      - kind: mutation
        ref: pr/159
        date: 2026-08-31
        caught: >-
          `Signed-off-by:    <a@b.co>` — three spaces where the name goes —
          accepted by the module's `.+` and by the CI grep alike; red on both as
          they were, refused now (self-audit, 2026-08-31).
      - kind: mutation
        ref: pr/173
        date: 2026-08-31
        caught: >-
          The guard removed from --msg-file — a path git hands the hook that
          does not exist was a traceback and exit 1, which reads as a bad
          message (self-audit round 2, 2026-08-31).

  - id: newcomer-issues-are-not-taken-silently
    title: A pull request closing an issue still labelled for newcomers has to say why
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_issue_handoff.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      From a real incident in the reference implementation on 2026-08-20: an issue
      was labelled `good first issue` at 12:14Z, the maintainer opened and merged
      their own pull request for it by 16:51Z, and an outside contributor opened
      theirs at 17:39Z having started hours earlier. The label stayed on
      throughout, with no assignee and no comment — so they lost an afternoon to
      work already closed. A promise made in a comment on a closed pull request is
      a promise nobody can find again, which is why this is a machine rather than
      a line in a contributing guide. It reads what the platform will actually do
      on merge rather than grepping the body for "Closes #N", because a gate that
      reads something other than what the platform acts on is right only while the
      two happen to agree.
    proved_by:
      - kind: mutation
        ref: pr/15
        date: 2026-08-26
        caught: >-
          Red on every direction — a bare override marker with no reason, one
          indented so it is not a declaration line, one buried mid-sentence, an
          absent body read as an excuse rather than as no declaration, and a
          report naming only the first offending issue instead of all of them.

  - id: one-reader-for-workflow-triggers
    title: There is one reader for `on:`, and it covers all three shapes GitHub accepts
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_workflow_reader.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A parser is a command like any other, and a second copy of it drifts just as
      fast. The reference implementation had this idiom copied in **five places**,
      three of them broken the same way — `on: [push, pull_request]` used the
      value as a dict key, which a list cannot be — and the copies had already
      drifted: one guarded itself with `isinstance`, two did not. The shape nobody
      expects is that the key is usually the boolean `True`: YAML 1.1 reads an
      unquoted `on:` as a boolean, so a reader looking only for the string finds
      nothing in almost every real workflow, and answers as though no triggers
      were declared.
    proved_by:
      - kind: mutation
        ref: pr/16
        date: 2026-08-26
        caught: >-
          Five mutations red — reading only the string key so every unquoted `on:`
          vanished, restoring the idiom that breaks on a list, letting an empty
          file read as None instead of an empty mapping, reading `on: [schedule]`
          as though it carried a cron, and accepting only `.yml` so every
          `.yaml` workflow disappeared from the census.
      - kind: mutation
        ref: pr/229
        date: 2026-09-03
        caught: >-
          The one reader read bare: a workflow nobody may open, a symlink whose target
          was gone, a file that is not UTF-8 and YAML the parser rejects were each
          whatever the read raised, and they reached four callers as tracebacks with
          exit 1 — the code that means findings (self-audit round 20, 2026-09-03).
          Every one is now the reader's own `RuntimeError`, one sentence naming the
          file, which is what its callers already answer with "cannot read" and exit 2.
          Two planted defects red on their own: the reader put back to a bare read, and
          YAML the parser rejects left out of what it answers for. The first of those
          was red in all five test files that reach this reader, which is the map of
          who depends on it.

  - id: one-wrapper-for-the-github-cli
    title: There is one `gh` wrapper, and it fails loudly rather than answering empty
    kind: test
    severity: blocking
