# This repository's own gate registry.
#
# This is the home of *registries that are checked against reality both ways*, so
# it has to keep one of its own from day one. But **no row goes in before the
# thing that enforces it exists** — a registry listing gates nobody enforces is
# precisely what this whole project exists to stop doing. The registry began
# empty at stage 1 and grew one row per enforcer as each moved in.
#
# The shape of this file is enforced by `verifiable_gates.registry` and
# `tests/test_registry.py`.

version: 1
gates:
  - id: the-cards-still-say-what-the-repo-says
    title: The two identity cards agree with each other and with the licence on disk
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_identity_cards.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      `CITATION.cff` and `.zenodo.json` describe this repository to readers who
      are not us, and Zenodo's copy is published under a permanent DOI, which by
      the definition of archiving cannot be corrected afterwards. The reference
      implementation measured what happens without a check: on 2026-08-22 its two
      cards and its own register gave three different numbers for one fact, and
      the value published under the DOI was the oldest of the three. The shape of
      the failure is that the further a statement travels from the repository, the
      fewer machines watch it — while the furthest destination is the one place it
      cannot be fixed. The licence is held against `LICENSE` rather than only
      across the two cards, because two cards agreeing with each other and both
      being wrong is exactly what a cross-check between them cannot see. A third
      card arrived on 2026-09-02: `.claude-plugin/plugin.json`, read by Claude
      Code's marketplace and the Skills CLI when somebody installs the skill without
      cloning — the same reader, a third shape, held to the other two here for the
      same reason, and to the skill it points at, because a `skills` path is a
      promise that a directory holds a `SKILL.md`. A fourth the same day:
      `AGENTS.md`, read by the sixty-odd agents that follow the agents.md
      convention and imported by `CLAUDE.md` for the one that does not — a card a
      machine will act on, so it is held to point at things that exist and to copy
      no rule, since a copied rule is the one that goes stale.
    proved_by:
      - kind: mutation
        ref: pr/224
        date: 2026-09-03
        caught: >-
          `AGENTS.md` became the fourth card. Six planted defects against the two
          instruction files, each red on its own: a path that is not there, a
          module that does not import, a cited section title that is not a
          heading, the import dropped from `CLAUDE.md`, a rule entry pasted in,
          and the two files pushed past 200 lines together.
      - kind: mutation
        ref: pr/223
        date: 2026-09-02
        caught: >-
          The plugin manifest became the third card. Four planted defects against
          it, each red on its own: the keywords out of step with the other two
          cards, the `skills` path pointing at a directory that is not there, the
          licence switched to the code's instead of the sheets', and a second
          entry added to the one-plugin marketplace.
      - kind: mutation
        ref: pr/13
        date: 2026-08-26
        caught: >-
          Six planted defects red — the title edited on one card only, the licence
          changed on one card only, a keyword dropped from one, the description
          reworded away from the abstract, the author renamed on the other, and
          both cards moved together to a licence this repository does not carry.

  - id: the-archive-is-read-back
    title: The archive reader holds Zenodo's versions to the releases both ways, and posture's cron runs it live
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_zenodo.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The cards in the tree are held to each other and the About field is read
      live, but the archive — the one copy that cannot be corrected — was read
      by nobody: the 2026-08-30 re-audit (round 24) compared Zenodo's versions
      with the releases by hand, 7 and 7, and asked who would see the eighth.
      `verifiable_gates.zenodo` reads every version under the concept DOI the
      citation card advertises and holds the list to the release tags both ways.
      This gate is the reader's behaviour, proved offline in the `test` job; the
      live read is a step of `posture.yml` — weekly and on every push to main —
      whose gate is `watched`, seen within seven days, so a release with no DOI is
      seen the week it happens rather than at the next audit, not the minute it
      happens. The archive refuses a page above 25, found on the first live call
      — so the reader pages; and a record with no version, or two under one
      version, is red rather than dropped by the map (pre-cut review, 2026-08-30).
    proved_by:
      - kind: mutation
        ref: pr/100
        date: 2026-08-30
        caught: >-
          Three mutations red — the release→archive direction dropped (a release
          with no DOI passed), the concept check dropped (a record under another
          concept passed), and the paging stopped after page one (the 26th version
          was never read). Found live before the tests: the archive refuses
          `size=100` with a 400, which the first call met.
      - kind: mutation
        ref: pr/104
        date: 2026-08-30
        caught: >-
          `_uncountable` dropped from `problems()` and the duplicate-version branch
          disabled — each red in the test that feeds two `0.1.6` records and one
          without a version, the input the pre-cut review used to get a green.
      - kind: mutation
        ref: pr/140
        date: 2026-08-31
        caught: >-
          Four planted files red on the module as it was — records as a dict,
          a list of strings and bare text (AttributeError tracebacks before),
          and releases as a dict (coerced through str() silently before); each
          now answers exit 2 with the file named (outside audit, 2026-08-31).
      - kind: mutation
        ref: pr/160
        date: 2026-08-31
        caught: >-
          `urlopen` asked without `timeout=` — the one network call here no
          test held; the argument dropped left the suite green (self-audit,
