  - id: what-left-is-told-from-what-was-reworded
    title: A census of removals separates what went from what was only renamed
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_removals.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      The record of every removal is already in the version history, so nothing is
      lost in the strict sense — what is missing is anybody reading it, and that
      shape recurs: a project does not need another place to write things down, it
      needs a place to read them from. The difficulty is that a removal and a
      rewrite are the same diff. Asking the reference implementation's history for
      deleted lines under one document returned 31 over the repository's lifetime,
      and no eye could tell rows taken away from rows reworded without opening each
      change one at a time, which is why nobody did. Both entries that ever vanished
      from its gate register turned out to be renames. The similarity threshold that
      tells them apart is an interpretation rather than a fact, so what it dismisses
      is printed instead of dropped — a census that quietly discards what it could
      not classify reports good news it did not earn.
    proved_by:
      - kind: mutation
        ref: pr/19
        date: 2026-08-26
        caught: >-
          Eight mutations red — counting every rewrite as a removal, loosening the
          threshold until every removal read as a rewrite, dropping the filter that
          keeps a renamed file from counting as a deleted one, ignoring the window
          the caller asked about, letting an empty pile leave the report so that
          "nothing removed" and "nobody watching" looked alike, printing a clean
          page when the manifest was empty, not naming the missing tool, and letting
          the history command wait without a deadline.

