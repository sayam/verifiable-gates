  - id: rules-we-ship-we-keep
    title: Scanners that apply to this repository are run against this repository
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_dogfood.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Governance audit round 23 of the reference implementation measured the gap between the
      rules a project exports and the rules it keeps, and the answer was 2.7%. The cheapest
      defence is to point every scanner that can apply here at here, from the day it lands.
      The test also refuses a not-applicable result: a scanner that finds nothing to check
      here is not dogfooding anything, and would otherwise sit in the list looking like a
      pass. On 2026-09-01 the pull request that had carried this row's first proof was
      deleted, with eight others, so that GitHub could garbage-collect commits whose
      metadata held a private address by mistake (support ticket 4717542): the address had
      to become unreachable, and a pull request referencing those commits is a reference.
      What that first proof caught is kept here, where it needs no link. On 2026-08-25 it
      was a red on its first run for a real reason: `pip install --no-deps -e .` installs
      the checkout itself and resolves nothing from an index, so there is no hash to pin —
      and the scanner flagged it anyway. The scanner was fixed rather than the repository,
      and the exemption now needs both halves, with a test for each: `--no-deps` on its own
      still reaches the index, and `-e .` on its own drags the whole dependency tree in
      unpinned.
    proved_by:
      - kind: mutation
        ref: pr/208
        date: 2026-09-01
        caught: >-
          Re-proved on the tree as it stands: three shipped scanners made to answer `NA` on
          every tree — the shape a hand-kept list of "what applies here" decays into — took
          the count of scanners that found real work below `APPLICABLE_FLOOR` and turned
          `test_enough_scanners_actually_find_something_here` red.
      - kind: mutation
        ref: pr/243
        date: 2026-09-04
        caught: >-
          The new `pypa/gh-action-pypi-publish` pin, planted twice — as a tag
          and as a bare SHA with its `# v1.14.2` comment removed — red here
          both times: this repository's own `actions-sha-pinned` reading its
          own workflow, and the pin count held two ways (21 uses, 7 distinct)
          rather than trusted (2026-09-04).
      - kind: mutation
        ref: pr/244
        date: 2026-09-04
        caught: >-
          The judged-line count frozen at zero: this repository's own workflows
          then read as NA rather than a verdict, and the applicable floor in
          `tests/test_dogfood.py` went red — the floor `doctor-all-na-exits-zero`
