      - kind: mutation
        ref: pr/124
        date: 2026-08-30
        caught: >-
          The hold on record fields switched off — a list of the wrong records
          read as a history again, red five ways across the reader and both
          censuses; the `gh run list` hint dropped, red twice. An outside audit
