# This repository's own gate registry.
#
# This is the home of *registries that are checked against reality both ways*, so
# it has to keep one of its own from day one. But **no row goes in before the
# thing that enforces it exists** — a registry listing gates nobody enforces is
# precisely what this whole project exists to stop doing. The registry began
# empty at stage 1 and grew one row per enforcer as each moved in.
#
# The shape of this file is enforced by `verifiable_gates.registry` and
# `tests/test_registry.py`.

version: 1
gates:
  - id: the-cards-still-say-what-the-repo-says
    title: The two identity cards agree with each other and with the licence on disk
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_identity_cards.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      `CITATION.cff` and `.zenodo.json` describe this repository to readers who
      are not us, and Zenodo's copy is published under a permanent DOI, which by
      the definition of archiving cannot be corrected afterwards. The reference
      implementation measured what happens without a check: on 2026-08-22 its two
      cards and its own register gave three different numbers for one fact, and
      the value published under the DOI was the oldest of the three. The shape of
      the failure is that the further a statement travels from the repository, the
      fewer machines watch it — while the furthest destination is the one place it
      cannot be fixed. The licence is held against `LICENSE` rather than only
      across the two cards, because two cards agreeing with each other and both
      being wrong is exactly what a cross-check between them cannot see.
    proved_by:
      - kind: mutation
        ref: pr/13
        date: 2026-08-26
        caught: >-
          Six planted defects red — the title edited on one card only, the licence
          changed on one card only, a keyword dropped from one, the description
          reworded away from the abstract, the author renamed on the other, and
          both cards moved together to a licence this repository does not carry.

  - id: commit-messages-are-shaped-and-signed
    title: Every commit a branch adds is a Conventional Commit and carries a DCO sign-off
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_lint_commits.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      This decider blocks every commit on a developer's machine and every pull
      request in CI, so both directions are expensive: a false red teaches people
      to reach for `--no-verify`, and a false green lets malformed history in
      permanently. The reference implementation learned three separate lessons
      into it — a required check that gets skipped leaves a pull request BLOCKED
      with nothing red to see, so it runs on what the branch actually adds; a
      merge commit's message is the platform's rather than a person's, so those
      are excluded or the "Update branch" button turns the gate red with nobody
      having typed anything wrong; and the sign-off is the one thing a project
      cannot add retroactively on somebody's behalf.
    proved_by:
      - kind: ci-red
        ref: pr/7
        date: 2026-08-25
        caught: >-
          Running in this repository's own CI it refused commit 3a08fd10c — a
          subject of 73 characters, one over the limit — and held the pull request
          until it was rewritten.
      - kind: mutation
        ref: pr/15
        date: 2026-08-26
        caught: >-
          Six mutations red — counting the subject in bytes rather than characters
          (which shortens the limit to a third for anybody writing in a non-Latin
          script), holding merge commits to the format, accepting a sign-off with
          no address to reply to, separating log records by newline so a multiline
          body became several commits, skipping the sign-off check in hook mode,
          and returning zero whatever was found.

  - id: newcomer-issues-are-not-taken-silently
    title: A pull request closing an issue still labelled for newcomers has to say why
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_issue_handoff.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      From a real incident in the reference implementation on 2026-08-20: an issue
      was labelled `good first issue` at 12:14Z, the maintainer opened and merged
      their own pull request for it by 16:51Z, and an outside contributor opened
      theirs at 17:39Z having started hours earlier. The label stayed on
      throughout, with no assignee and no comment — so they lost an afternoon to
      work already closed. A promise made in a comment on a closed pull request is
      a promise nobody can find again, which is why this is a machine rather than
      a line in a contributing guide. It reads what the platform will actually do
      on merge rather than grepping the body for "Closes #N", because a gate that
      reads something other than what the platform acts on is right only while the
      two happen to agree.
    proved_by:
      - kind: mutation
        ref: pr/15
        date: 2026-08-26
        caught: >-
          Red on every direction — a bare override marker with no reason, one
          indented so it is not a declaration line, one buried mid-sentence, an
          absent body read as an excuse rather than as no declaration, and a
          report naming only the first offending issue instead of all of them.

  - id: one-reader-for-workflow-triggers
    title: There is one reader for `on:`, and it covers all three shapes GitHub accepts
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_workflow_reader.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A parser is a command like any other, and a second copy of it drifts just as
      fast. The reference implementation had this idiom copied in **five places**,
      three of them broken the same way — `on: [push, pull_request]` used the
      value as a dict key, which a list cannot be — and the copies had already
      drifted: one guarded itself with `isinstance`, two did not. The shape nobody
      expects is that the key is usually the boolean `True`: YAML 1.1 reads an
      unquoted `on:` as a boolean, so a reader looking only for the string finds
      nothing in almost every real workflow, and answers as though no triggers
      were declared.
    proved_by:
      - kind: mutation
        ref: pr/16
        date: 2026-08-26
        caught: >-
          Five mutations red — reading only the string key so every unquoted `on:`
          vanished, restoring the idiom that breaks on a list, letting an empty
          file read as None instead of an empty mapping, reading `on: [schedule]`
          as though it carried a cron, and accepting only `.yml` so every
          `.yaml` workflow disappeared from the census.

  - id: one-wrapper-for-the-github-cli
    title: There is one `gh` wrapper, and it fails loudly rather than answering empty
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_gh_wrapper.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation counted this call copied in five places, two of
      them identical character for character, each carrying its own `S603`
      suppression — five exemptions for one command. What the copies risk getting
      wrong is not the call but the failure: with `check=False` and no return-code
      test, a `gh` that failed hands back an empty string, and an empty answer
      reads as data all the way down. The cause is nearly always scope or an
      expired token, and `gh` usually says which, so its message is attached whole
      rather than summarised.
    proved_by:
      - kind: mutation
        ref: pr/16
        date: 2026-08-26
        caught: >-
          Four mutations red — not testing the return code so a failure came back
          as an empty string, discarding gh's own message so the reader lost the
          only line saying what to fix, dropping the timeout, and not stripping
          the output so every comparison downstream saw a trailing newline.

  - id: the-surface-reader-reports-its-own-saving
    title: The API-surface reader is honest about how much it saved, including when it saved nothing
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_skeleton.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The ratio at the end is the reason the tool exists: it is the only thing
      that says which files are worth asking about this way and which are faster
      to read whole. Three separate reviews of the reference implementation caught
      it being subtly wrong in ways nothing else would have shown — a doubled
      parse invisible on one file and a doubling of the work on a directory, a
      denominator one line too large for every file ending in a newline, and a
      `UnicodeDecodeError` escaping an `except OSError` because it inherits from
      `ValueError`, printing a traceback that never said which file. A figure over
      100% is the answer rather than a bug, and clamping it would hide the one
      case the tool exists to identify.
    proved_by:
      - kind: mutation
        ref: pr/16
        date: 2026-08-26
        caught: >-
          Five mutations red — the off-by-one denominator, clamping the ratio to
          100% so "read it whole" stopped being sayable, letting
          UnicodeDecodeError escape the handler, dropping decorators from the
          surface though they bind the caller, and walking the whole tree so
          functions nested inside functions were reported as callable surface.

  - id: declared-schedules-are-still-firing
    title: Every declared schedule is measured against when it last actually fired
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_schedule_census.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      A workflow that never started counts zero jobs, and that layer is closable.
      The layer above it is not: a workflow never triggered counts **zero runs**,
      and "no runs at all" looks exactly like "no run went red" in every tool
      there is — including any census counting what happened rather than what
      should have. In the reference implementation a scheduled workflow had fired
      exactly once in the repository's lifetime, and if it had stopped that day no
      test, job or cadence row would have known. GitHub also disables schedules
      for repositories quiet for 60 days, which is silence arriving from outside.
      Things that cannot be checked by machine — Dependabot has no public endpoint
      saying when it last ran — are labelled as such rather than guessed either way.
    proved_by:
      - kind: mutation
        ref: pr/17
        date: 2026-08-26
        caught: >-
          Five mutations red — turning an unreadable history into a silent pass
          (the failure this census exists to prevent, at the moment it is most
          misleading), treating "never fired" as acceptable, ignoring the
          tolerance, watching by the longest declared period instead of the
          shortest so the fast schedule could go quiet unseen, and asking the
          platform for runs of every event rather than scheduled ones.

  - id: a-census-over-nothing-counts-nothing
    title: A run history the censuses cannot see is the third answer, never a pass
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_history.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Three censuses read the same run history through three private copies of
      the same code, and each copy caught a different set of failures. An outside
      zero-trust audit of `v0.1.0` (2026-08-29) fed them what the copies did not
      catch: a file that was not there was a traceback, malformed JSON was a
      traceback, and a valid file holding nothing was a **pass** — "every promise
      holds (0 watched)", "examined 0 runs" — from two instruments whose own
      docstrings say that a measurement which goes quiet when it cannot see
      reports every promise as kept on the day it can see nothing. The exit-2
      path existed; it was reachable only through the exceptions somebody had
      thought of. So there is one reader now, and everything that stops a census
      from seeing — unreadable, malformed, the wrong shape, or empty while there
      is something to measure — comes out of it as the same answer.
    proved_by:
      - kind: mutation
        ref: pr/37
        date: 2026-08-29
        caught: >-
          Four mutations red — letting an empty history through again (three
          tests, across the reader and both censuses that must close on it),
          skipping the shape check so an object passed for a list, narrowing the
          caught file error back to a traceback, and making the red-streak census
          demand runs even when no gate declares a watcher, where the honest
          answer is "nothing to measure" and not "cannot see".

  - id: watcher-promises-are-measured-against-reality
    title: A declared `within_days` is measured, not merely checked for shape
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_red_streak_census.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      A gate that cannot block declares who sees it within how many days, and the
      only thing checking that was its *shape* — an integer, under a cap. A
      promise with no instrument behind it expires in silence. Measured on one
      4-day window in the reference implementation: redness that blocked somebody
      stood 0.4 hours, redness that blocked nobody stood 14.6 — 36 times longer,
      with nothing comparing that against what was promised. Two subtleties made
      the first attempt wrong by a factor of seven, and neither shows up as an
      error: runs the platform rejected are named by **path** rather than by
      declared name, so grouping by name splits one history in two; and a run's
      conclusion belongs to the whole **file**, so a file containing blocking jobs
      cannot answer for a watched one.
    proved_by:
      - kind: mutation
        ref: pr/17
        date: 2026-08-26
        caught: >-
          Five mutations red — grouping by name so one history split in two,
          dropping redness that is still standing now (which makes a workflow red
          at this moment report zero), judging files that run on pull_request
          where the figure is dominated by blocking redness, taking the longest
          promise in a file rather than the narrowest, and never stopping at an
          empty page. That last one first made the tests **hang rather than
          fail**, so both fakes now refuse after a few calls: a hang and a slow
          test give the same signal, which is the reason this project makes every
          command declare a time budget.

  - id: a-rerun-cannot-erase-a-failure-from-the-count
    title: Failures a rerun turned green are still counted, and classified by who broke
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_rerun_census.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      The platform reports the latest attempt only, so pressing rerun until a run
      goes green removes the original failure from every listing — and "never
      red" is what decides whether a gate carries evidence and whether a flaky
      review has anything to look at. Measured on a real repository: eleven
      visible failures, three more hidden underneath. Two further mistakes were
      made in earnest. Classifying by **step name** read a scanning action's
      setup failure as ours four times on a day the platform was answering 503 —
      a step name says where it broke, not who. And walking failures job by job
      lost every run the platform rejected before creating any job: zero jobs,
      zero failures, invisible — which is how one workflow failed on every run
      for days while a check that verifies the platform's own settings had never
      run once.
    proved_by:
      - kind: mutation
        ref: pr/26
        date: 2026-08-26
        caught: >-
          Five mutations red — reading the step name before the message so
          somebody else's action is blamed on us, letting a bare status number
          count as the platform's (a project's own tests assert on 503, so its
          failures would leave the count), calling every failure visible so a
          rerun really does erase one, dropping the run that never started, and
          keeping the matrix suffix on a check name so one report can say
          `dialect` failed and `dialects` never went red.

  - id: a-threshold-sits-against-reality-both-ways
    title: A ratchet's threshold is held to what is true today, in both directions
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_ratchets.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The direction everyone watches needs no help: a coverage tool refuses to
      pass beneath its own floor. The direction that matters is the other one —
      **nobody raises the floor after the code gets better** — and a floor left
      behind quietly permits every line of that improvement to be given back. The
      reference implementation measured it: six days after setting a floor of 96
      at a measured 96.31%, reality had reached 97.11% and the floor had not
      moved, a full point of slack worth roughly fifty covered lines. Three
      further shapes had to be kept apart because the advice that fixes one is
      wrong for the others: a ceiling travels the same way in reverse, a removal
      guard exists to catch deletion and must grow freely or the cost of bumping a
      number teaches people to stop reading the check, and a floor some other tool
      already enforces downward must not be reported here as well or a reader gets
      two instructions for one problem.
    proved_by:
      - kind: mutation
        ref: pr/18
        date: 2026-08-26
        caught: >-
          Seven mutations red — reporting a fall a tool already owns so the reader
          got contradictory advice, taking a removal guard's free growth away,
          watching a ceiling only upward so space won was never banked, reporting
          a removal as a threshold regressing, freezing the wording so it could no
          longer be an input, letting one overridden message blank the four a
          project did not mention, and accepting a misspelled kind that then
          behaved like a floor.

  - id: a-number-comes-from-the-thing-itself
    title: Every figure a threshold is held against is read from the source, never from a summary
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_measure.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A reader that guesses, or that quietly answers zero when it cannot see, turns
      a red check green at exactly the moment the check was needed. Two failures in
      the reference implementation set the shape. Its first ratchet checker read
      only numbers that lived in a tool's own config, so a ratchet written as an
      English sentence — mypy's strict list, which had said "may grow, never
      shrink" for sixteen phases — survived it untouched. And a second parser,
      written beside the one that already existed because that was easier, gave 24
      where the real reader gave 23 on the same day. The suppression counter is
      tested hardest because **its total cannot prove its own logic**: a test
      watching only the count stays green through a change that stops telling
      "which rule is off" from "why", which are the two questions the count exists
      to keep apart.
    proved_by:
      - kind: mutation
        ref: pr/18
        date: 2026-08-26
        caught: >-
          Twelve mutations red — calling every switched-off line justified,
          ignoring a skipped directory, counting a file twice when two globs
          overlapped, passing in silence when the measurement file was absent,
          reading a package's `__init__` as a module of its own, ignoring the
          excluded tree in the strict count, answering zero instead of raising when
          mypy's strict list was gone, accepting prose as a coverage figure,
          letting a register that had stopped being a literal through, answering
          zero for a register that was not there at all, not naming the binary that
          was missing, and reading interrogate's figure from anywhere in its output
          rather than from its own label.

  - id: what-left-is-told-from-what-was-reworded
    title: A census of removals separates what went from what was only renamed
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_removals.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      The record of every removal is already in the version history, so nothing is
      lost in the strict sense — what is missing is anybody reading it, and that
      shape recurs: a project does not need another place to write things down, it
      needs a place to read them from. The difficulty is that a removal and a
      rewrite are the same diff. Asking the reference implementation's history for
      deleted lines under one document returned 31 over the repository's lifetime,
      and no eye could tell rows taken away from rows reworded without opening each
      change one at a time, which is why nobody did. Both entries that ever vanished
      from its gate register turned out to be renames. The similarity threshold that
      tells them apart is an interpretation rather than a fact, so what it dismisses
      is printed instead of dropped — a census that quietly discards what it could
      not classify reports good news it did not earn.
    proved_by:
      - kind: mutation
        ref: pr/19
        date: 2026-08-26
        caught: >-
          Eight mutations red — counting every rewrite as a removal, loosening the
          threshold until every removal read as a rewrite, dropping the filter that
          keeps a renamed file from counting as a deleted one, ignoring the window
          the caller asked about, letting an empty pile leave the report so that
          "nothing removed" and "nobody watching" looked alike, printing a clean
          page when the manifest was empty, not naming the missing tool, and letting
          the history command wait without a deadline.

  - id: an-advertised-number-is-made-true-by-one-command
    title: A number several documents quote is synchronised in one place, prose untouched
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_advertised.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Every advertised number already has a test holding it against reality; what
      stays manual is making it true again. The reference implementation measured
      the bill: one new decision record turned three files red, one new gate turned
      two more, and **25 of its last 200 commits were nothing but numbers copied
      from one file to another**. The version outside the repository is worse — a
      description field on the hosting platform produces no diff, so no test ever
      runs and nobody sees it age; that number was wrong twice in one session, each
      time by exactly one, because the step was one somebody had to remember. Two
      rules keep this honest: a pattern matching nothing is reported rather than
      passed over, since going quiet means claiming agreement having read nothing;
      and a field is patched in place rather than rebuilt, since rebuilding deletes
      whatever prose a person wrote there and nobody would see it go.
    proved_by:
      - kind: mutation
        ref: pr/19
        date: 2026-08-26
        caught: >-
          Nine mutations red — replacing the whole match instead of the group so the
          sentence around the value was destroyed, going quiet when a pattern found
          nothing, not reporting a place that had fallen behind, accepting a fact
          nobody measured, rebuilding the outside field from its values instead of
          patching it, inventing a claim the field never made, replacing every
          occurrence rather than the first, and reporting a claim missing from the
          field as agreement. **A tenth stayed green and changed the code**: a guard
          skipping places that could not be found turned out to be a branch nothing
          could observe, because substituting into text that does not match is
          already no change — it was removed rather than left to look load-bearing.

  - id: a-check-name-is-not-a-job-id
    title: The names a repository's checks will appear under are computed, not assumed
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_check_names.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Branch protection is a list of check *names*, and a name is not a job id: a
      job declaring `name:` uses that instead, and a job with a matrix produces one
      check per row. Two failures follow, and they look opposite. **A required name
      no job can produce leaves every pull request waiting for a check that never
      arrives** — nothing is red, the pull request simply never becomes mergeable.
      **A check nobody requires** runs, goes red, and merges anyway. Both are
      invisible from inside a repository unless something works out the names the
      platform is going to use. The reference implementation shipped a report saying
      `dialect` had failed ten times and, in the same breath, that `dialects` had
      never gone red: the same jobs, one named by its check and one by its id, with
      no reader able to see they were one thing. The wider "everything this
      repository can produce" set exists for the same reason a register does: held
      against the pull-request set instead, a "not required, and here is why" entry
      can never appear in it, so nothing consults it and it becomes a text file.
    proved_by:
      - kind: mutation
        ref: pr/20
        date: 2026-08-26
        caught: >-
          Six mutations red — reading the job id where a name was declared,
          collapsing matrix rows whose values do not appear in the name, requiring
          scheduled workflows on pull requests, narrowing the everything-set to the
          pull-request one so a register could never be consulted, counting a matrix
          as one run, and counting distinct names where the advertised number counts
          runs.

  - id: platform-settings-are-held-to-what-was-declared
    title: The settings every other gate leans on are checked, not merely written down
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_posture.py]}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      Every gate in a repository rests on settings that live somewhere else — that
      the default branch takes changes only through a pull request, that
      administrators are not exempt, that the required checks are the ones that
      actually run — and **nothing inside a repository can see any of it**. Switch
      one off in a web form and the documents keep saying what they always said. It
      is the control every other control leans on and the one nobody watches. Three
      rules make the check worth running. **Cannot read is not the same as switched
      off**: reporting the first as the second sends somebody to fix what was never
      broken, and reporting it as fine is worse, so it gets a third answer. **A
      value nobody can read still has a declared value** — the reference
      implementation lost one setting entirely because it lived in the unreadable
      class, so its register recorded that no machine could see it and nothing
      anywhere recorded what it should be; the rule it carried was then kept by one
      person's memory and forgotten about thirty times running. **Both directions**,
      because an exemption goes quiet exactly when the thing it excuses disappears —
      and an exemption register held against the wrong set can never match anything,
      which is how that project's own sat unread from the day it was written.
    proved_by:
      - kind: mutation
        ref: pr/20
        date: 2026-08-26
        caught: >-
          Ten mutations red — holding the exemption register against the
          pull-request set so it could never be consulted, never reporting a stale
          exemption, missing a required check no job can produce (the failure where
          nothing is red and the pull request simply never merges), reporting an
          unreadable field as switched off, absorbing any empty field as expected,
          demanding a register line for an alert the platform had fixed, counting a
          dismissal with no reason as a judgement, reading "no permission to look"
          as "no alerts", losing the link between a matrix row and the job it
          belongs to, and freezing the wording so it could no longer be an input.

  - id: every-advisory-has-been-judged
    title: Every finding has been decided about, and every decision still describes something
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_advisories.py]}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      A scanner that fails on anything it finds gets switched off. Some findings
      genuinely cannot be acted on — a pinned transitive dependency upstream has
      not moved, a distribution patch that does not exist — and a check red from
      its first day and red forever is one somebody silences inside a fortnight,
      taking the real findings with it. So the rule is not "no findings" but
      **every finding has been decided about**, which makes the register of
      accepted ones the thing that has to be right. It is held **both ways**, and
      the second way is the one that rots: the tools never mention an id they did
      not need to ignore, so an entry outlives its subject in silence and sits
      there excusing nothing, until the day it silently excuses something real.
      Two readers carry their own lesson — a package audit groups by affected
      package rather than by advisory, so counting headlines gives six where the
      cause is one; and the id has to be the public one, never a registry's
      internal number, or nobody reviewing the register can look an entry up.
    proved_by:
      - kind: mutation
        ref: pr/22
        date: 2026-08-26
        caught: >-
          Five mutations red — never reporting a stale entry (the direction the
          tools are silent about), counting a package audit by headline so one
          cause became six, using the registry's internal number as the id,
          collapsing "no fix exists" into "a fix exists we cannot take", and
          reading the register's own comments as entries.

  - id: a-scan-proves-it-scanned
    title: A run that found nothing is told apart from a run that read nothing
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_scan_coverage.py]}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      Exit zero from a static analyser means "no findings", which is
      indistinguishable from "no files". A whole directory can drop out — a
      default exclude nobody read, a working directory that was not what somebody
      assumed — and the result is green, quiet and permanent, with **nothing in
      the output differing from the day it worked**. It happened: a scanner's own
      built-in defaults excluded the reference implementation's test tree, so 61
      of 136 files were never scanned while the workflow named two directories it
      excluded itself. Nobody lied and nobody measured. A minimum count is not the
      answer — a floor catches "everything vanished" and misses "one directory
      vanished", which is the shape the bug took. What is checked is the set of
      files the run reports reading against the set that should have been read,
      plus three things that each fail green on their own: no rules loaded, a rule
      skipped, an error the tool reported about itself. Reading *more* than
      expected is safety, not a fault, so only the missing direction is red.
    proved_by:
      - kind: mutation
        ref: pr/22
        date: 2026-08-26
        caught: >-
          Six mutations red — flipping the direction of the set difference so
          reading extra became the fault and reading nothing became fine, passing
          an empty rule set, passing a skipped rule, swallowing the scanner's own
          errors, matching a declared skip as a name prefix rather than a
          directory so `apple/` vanished with `app/`, and dropping the pattern
          that decides what counts as code.

  - id: the-instrument-is-measured-first
    title: The probe that judges generated apps is itself judged, both ways, per item
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_asvs_probe.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A claim that a bundle of rules changes what agents write is worth exactly
      what its instrument can distinguish. **A probe answering "passed" for
      everything reports that the rules made no difference** — a wrong conclusion
      with nothing to contradict it. So a pair of apps is planted, one violating
      every item and one satisfying every item, and each item has to tell them
      apart. The harder direction is subtler: an instrument tied to one idiom
      measures "written like our example?" and leans by construction toward
      whichever arm read our own rules. The first version reported the rules arm as
      *worse* on three items, and all three were its own fault — it read a web
      session accessor as a database lookup, punished a shared lookup whose callers
      all checked ownership, and matched a fixture's fake key as a hardcoded
      secret. **When the person measuring owns what is measured, the dangerous
      error is not the flattering number — it is the one that contradicts them and
      gets believed at once because it looks honest.**
    proved_by:
      - kind: mutation
        ref: pr/151
        date: 2026-08-19
        caught: >-
          Pointed at a real repository for the first time, 4,171 of the 4,299 files
          it read were library sources. Six directions red — no longer excluding
          environments, no longer stripping comments, counting a role check as a
          missing owner check, ignoring the scope enclosing a nested function,
          treating a module constant as request input, and letting the line counter
          use a different filter from the probe.

  - id: one-battery-across-every-arm
    title: Every arm of a comparison is measured with the same instrument, unchanged
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_measure_apps.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A comparison stops being one the moment the instrument differs between arms,
      and the ways that happens are quiet. A different configuration is a different
      gate. A skipped scanner reported as zero is indistinguishable in a table from
      a scanner that found nothing. And **the arm that installed the bundle
      receives tooling, a config and a starting workflow** — counting those as its
      own output adds the measurer's work to one side of the measurer's own
      experiment. Removing them is the direction that costs the bundle, which is
      the correct direction when the person measuring has a stake in the answer, and
      it is the rule most tempting to skip. The line counter has to read the same
      tree the probe reads, or "lines the agent wrote" silently swallows an
      environment somebody left in the directory.
    proved_by:
      - kind: mutation
        ref: pr/23
        date: 2026-08-26
        caught: >-
          The tests hold each of those open directly: the installer's artefacts are
          removed while the app's own work survives, an arm that installed nothing
          loses nothing, the original is never edited, `na` never collapses into
          `ok`, one configuration reaches every app, a scanner that was not asked
          for reports skipped rather than zero, a scanner that broke is loud rather
          than zero, and an environment in the tree does not enter the line count.

  - id: english-except-where-it-binds
    title: Everything here is in English, except documents that bind someone legally
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_language_policy.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      This repository is written in English because it is meant to be picked up by
      people who do not read Thai, while the reference implementation it was
      extracted from is in Thai throughout. Stages 2 to 5 move code across that
      boundary repeatedly, so Thai arrives here quietly and by accident rather
      than by decision. The exception — README and CLA, English first and Thai
      below — exists because a document that binds someone has to be understood by
      the person bound, and the maintainer's first language is Thai. The registry
      handover added a second kind of exception with a different shape: the rule
      catalogue keeps each rule's original wording beside the published English,
      because a translation of an incident report is a retelling and the retelling
      is not the record. That Thai is data, so it is not excused by file — it is
      excused only by position, in a `*_th` value, in a cited step name, or inside
      a string literal in the code that renders those fields. A Thai comment, key
      or identifier stays forbidden in every file, which is the leak this check
      was built for. The check
      runs both ways: Thai outside the allowlist fails, and so does an allowlisted
      file with no Thai left in it, because an exception that no longer excuses
      anything is a hole with a label on it.

      The comparison reports added a third kind, the same principle one level up —
      at whole files rather than fields. A research report is *thought* in one
      language and *published* in another, so the original is kept beside the
      published English, and that allowance is held three ways because each rots
      differently: an original translated in place stops being an original · an
      original with no active counterpart is a document with no owner · and an
      allowance widened from one directory to a whole tree changes nothing the day
      it is written while silently admitting everything written under that tree
      afterwards.
    proved_by:
      - kind: mutation
        ref: pr/3
        date: 2026-08-25
        caught: >-
          Red in all three directions — a Thai comment added to a source file, the
          Thai half stripped from CLA.md, and the allowlist pointed at a file that
          does not exist. It also caught two defects in itself. Walking the
          filesystem picked up verifiable_gates.egg-info/PKG-INFO, a build artefact
          embedding the bilingual README that exists only where the package was
          installed in editable mode. Then reading only *tracked* files let a new
          file pass locally and fail in CI, which happened for real in stage 2e —
          it now reads tracked plus untracked-not-ignored, the set a developer is
          one `git add` away from committing.

  - id: checks-stay-standalone
    title: Every scanner survives being copied out of this package on its own
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_checks_are_standalone.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A scanner is shipped as a single file into a project that has installed
      nothing, and run there with a bare python3. That works only while each file
      imports stdlib only and nothing from this package — a property invisible in
      normal use, because the tests here import the modules. It is also exactly
      the shape a well-meaning refactor breaks: three scanners repeat six lines of
      argv handling, someone lifts them into a shared helper, the suite stays
      green, and every copied file breaks in a repository nobody here can see.
    proved_by:
      - kind: mutation
        ref: pr/4
        date: 2026-08-25
        caught: >-
          The AST checks and the subprocess runs disagree usefully: the AST pass
          catches a shared import before it ships, and copying each scanner to a
          directory where the package cannot be imported catches anything the AST
          pass would have missed. A misuse must exit 2, never 0, so a wrong call
          is never filed as a clean run.

  - id: scanners-tell-their-two-answers-apart
    title: Every scanner is shown a tree that violates it and one that does not
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_checks_behaviour.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A scanner that returns 0 for everything is indistinguishable from a clean
      project: CI stays green and the report says there is nothing to report. The
      pair — one tree that breaks the rule, one that keeps it — is the only thing
      that tells those two apart. The third case is the not-applicable one, which
      has to announce itself, because silence would file "we never looked" under
      "we looked and it was fine".
    proved_by:
      - kind: mutation
        ref: pr/4
        date: 2026-08-25
        caught: >-
          Nine mutations, one per scanner, each making it too generous — red every
          time. Coverage then found three behaviours the pairs never reached: the
          purge-path exemption, the npm branch, and module-level session imports.
          Each is the part a reader assumes works.

  - id: rules-we-ship-we-keep
    title: Scanners that apply to this repository are run against this repository
    kind: test
    severity: blocking
