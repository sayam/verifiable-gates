  - id: the-surface-reader-reports-its-own-saving
    title: The API-surface reader is honest about how much it saved, including when it saved nothing
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_skeleton.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The ratio at the end is the reason the tool exists: it is the only thing
      that says which files are worth asking about this way and which are faster
      to read whole. Three separate reviews of the reference implementation caught
      it being subtly wrong in ways nothing else would have shown — a doubled
      parse invisible on one file and a doubling of the work on a directory, a
      denominator one line too large for every file ending in a newline, and a
      `UnicodeDecodeError` escaping an `except OSError` because it inherits from
      `ValueError`, printing a traceback that never said which file. A figure over
      100% is the answer rather than a bug, and clamping it would hide the one
      case the tool exists to identify.
    proved_by:
      - kind: mutation
        ref: pr/16
        date: 2026-08-26
        caught: >-
          Five mutations red — the off-by-one denominator, clamping the ratio to
          100% so "read it whole" stopped being sayable, letting
          UnicodeDecodeError escape the handler, dropping decorators from the
          surface though they bind the caller, and walking the whole tree so
          functions nested inside functions were reported as callable surface.

  - id: declared-schedules-are-still-firing
    title: Every declared schedule is measured against when it last actually fired
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_schedule_census.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      A workflow that never started counts zero jobs, and that layer is closable.
      The layer above it is not: a workflow never triggered counts **zero runs**,
      and "no runs at all" looks exactly like "no run went red" in every tool
      there is — including any census counting what happened rather than what
      should have. In the reference implementation a scheduled workflow had fired
      exactly once in the repository's lifetime, and if it had stopped that day no
      test, job or cadence row would have known. GitHub also disables schedules
      for repositories quiet for 60 days, which is silence arriving from outside.
      Dependabot is read as one clock from the platform's `dynamic` runs, held to
      the shortest interval its config declares — the census once called it
      unverifiable and printed a label where a verdict belonged (2026-08-31).
    proved_by:
      - kind: mutation
        ref: pr/17
        date: 2026-08-26
        caught: >-
          Five mutations red — turning an unreadable history into a silent pass
          (the failure this census exists to prevent, at the moment it is most
          misleading), treating "never fired" as acceptable, ignoring the
          tolerance, watching by the longest declared period instead of the
          shortest so the fast schedule could go quiet unseen, and asking the
          platform for runs of every event rather than scheduled ones.
      - kind: mutation
        ref: pr/122
        date: 2026-08-30
        caught: >-
          The summary made to say "every declared schedule is still firing"
          whatever had fired — red in the young-cron case and in the two-shape
          table. An outside audit read that line above a cron that had never
          fired on 2026-08-30.
      - kind: mutation
        ref: pr/155
        date: 2026-08-31
        caught: >-
          `{}` and `{"foo": 1}` read as "never fired", exit 0; a last run that
          was a number or a word raised from inside the measure, exit 1 — five
          cases red on the census as it was, each now "cannot read the run
          history", exit 2 (self-audit, 2026-08-31).
      - kind: mutation
        ref: pr/171
        date: 2026-08-31
        caught: >-
          Dependabot three weeks silent under a weekly schedule — a label, not
          a verdict, on the census as it was; five cases red on the old
          module: the one clock from its config, the `event=dynamic` ask, no
          dynamic run as never, the entries printed beside the verdict, and
          the silence itself (self-audit, 2026-08-31; the endpoint read live).
      - kind: mutation
        ref: pr/229
        date: 2026-09-03
        caught: >-
          Round 3 gave this the third answer for the one shape it had met, a workflow
          that is not UTF-8; the reader now answers every unreadable workflow with
          `RuntimeError`, and a guard written for that one shape let the rest through
