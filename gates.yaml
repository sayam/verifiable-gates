    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The shipped registry scanner cannot use PyYAML — it runs in projects that have
      installed nothing — so it carries a hand-written subset reader. That makes it the
      riskiest code in the bundle: a reader more forgiving than the real one reports green
      on files it did not understand, and nothing about that looks wrong. Two defences:
      anything outside the subset raises, and on this repository's own files the two readers
      must agree value for value. The one accepted divergence, block scalar bodies, is
      measured rather than waved through — the count of blanked values must equal the count
      of block scalars. On 2026-09-01 the pull request that had carried this row's first
      proof was deleted, with eight others, so that GitHub could garbage-collect commits
      whose metadata held a private address by mistake (support ticket 4717542): the address
      had to become unreachable, and a pull request referencing those commits is a
      reference. What that first proof caught is kept here, where it needs no link. Writing
      the test on 2026-08-25 found two real defects on its first run: an anchor or an
      unclosed quote in *value* position was read as ordinary text, because the guard only
      looked at the start of a line — the reader was quietly more permissive than YAML — and
      `portable: false` came back as the string "false", which is truthy, so any rule that
      read a boolean would have read it backwards. Both were fixed in the reader, and nine
      further mutations went red.
