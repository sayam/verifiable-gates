    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Governance audit round 23 of the reference implementation measured the gap
      between the rules a project exports and the rules it keeps, and the answer
      was 2.7%. The cheapest defence is to point every scanner that can apply here
