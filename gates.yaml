  - id: the-security-policy-quotes-one-set-of-numbers
    title: SECURITY.md exists, quotes one set of timeframes, names no address, and points at a live channel
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_security_policy.py]}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      This repository publishes `security-policy-consistent` and, until
      2026-08-29, had no security policy of its own — a tool for other people's
      security posture with no way to report a hole in it. The rule's incident is
      three copies of a number disagreeing; the cheapest way to keep three copies
      agreeing is one copy, so the timeframes live in this file only and a test
      refuses a "days" figure anywhere else. Private vulnerability reporting was
      switched on the same day, so the channel the file names is one that answers.
    proved_by:
      - kind: mutation
        ref: pr/43
        date: 2026-08-29
        caught: >-
          A timeframe changed in one sentence only went red; an address planted in
          the file went red; a "within 7 days" added to CONTRIBUTING went red.

  - id: every-module-declares-its-role
    title: Every module in the package declares which of the four kinds it is
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_roles.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      `scripts-declare-their-role` is published from here, and every module wrote
      a `Role:` line by habit — until ten did not, among them the registry schema
      and the catalogue reader that everything else depends on, and nothing
      noticed, because a habit has no test. The kind is what lets a reviewer ask
      for the right evidence: a generator is proved by its output equalling the
      committed file, a reader by its numbers matching the source, and coverage
      answers for neither.
    proved_by:
      - kind: mutation
        ref: pr/43
        date: 2026-08-29
        caught: >-
          A module with its `Role:` line removed went red by name; a line naming a
          fifth kind went red; a module carrying two went red.

  - id: sast-is-a-job-and-its-alerts-are-judged
    title: CodeQL security-extended runs as a job, and every open alert on the ref is judged
    kind: job
    severity: blocking
    enforced_by: {job: codeql}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      `codeql-sast` is published from here — "as a job, not the default setup",
      because something clicked into place in a UI cannot be reviewed and can
      disappear silently — and this repository had neither the job nor the
      click. CodeQL's own step never fails on a finding: it uploads alerts to a
      page outsiders read first. So the job ends with a decider that reads the
      alerts back for this ref and refuses any that is neither in
      `pins/dev/code-scanning-accepted.txt` nor dismissed with a reason, in both
      directions — the same shape as the advisory register.
    proved_by:
      - kind: ci-red
        ref: run/33244862480
        date: 2026-08-29
        caught: >-
          A throwaway pull request (#46, closed unmerged) planted `eval()` over
          request input; the analysis
          raised the alert and the decider step went red with the rule named —
          `alert CodeQL/py/code-injection (open) has not been judged`. The same
          pull request's CodeQL step itself stayed green, which is the reason the
          decider exists. The branch was deleted, never merged.

  - id: a-secret-is-stopped-on-the-way-in
    title: gitleaks scans every commit of the history on every push and pull request
    kind: job
    severity: blocking
    enforced_by: {job: secret-scan}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      A secret that reaches history cannot truly be deleted on GitHub — old
      objects are still served by SHA — so stopping it on the way in is always
      cheaper. `push-secret-scan` was published from here with nothing scanning
      this history. The binary is a pinned release verified against its published
      checksum rather than the marketplace action, which carries a commercial
      end-user licence this repository's own licensing rule would have to
      explain.
    proved_by:
      - kind: ci-red
        ref: run/33244862480
        date: 2026-08-29
        caught: >-
          A throwaway pull request (#46, closed unmerged) first committed the
          documented AWS example key, and
          the job stayed **green** — gitleaks allowlists that exact value, so the
          probe proved nothing and is recorded here so nobody repeats it. A second
          commit planted a token in the `ghp_` shape: red, `leaks found: 1`, with
          neither the value nor the file printed (verbose off, redact on), 57
          commits scanned. The branch was deleted, never merged.
      - kind: mutation
        ref: pr/97
