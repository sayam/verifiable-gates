# This repository's own gate registry — **still empty, and that is the correct
# state at stage 1.**
#
# This is the home of *registries that are checked against reality both ways*, so
# it has to keep one of its own from day one. But **no row goes in before the
# thing that enforces it exists** — a registry listing gates nobody enforces is
# precisely what this whole project exists to stop doing. The first row arrives
# with the first enforcer, in stage 2, when the checks and the doctor move in.
#
# The shape of this file is enforced by `verifiable_gates.registry` and
# `tests/test_registry.py`.

version: 1
gates:
  - id: english-except-where-it-binds
    title: Everything here is in English, except documents that bind someone legally
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_language_policy.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      This repository is written in English because it is meant to be picked up by
      people who do not read Thai, while the reference implementation it was
      extracted from is in Thai throughout. Stages 2 to 5 move code across that
      boundary repeatedly, so Thai arrives here quietly and by accident rather
      than by decision. The exception — README and CLA, English first and Thai
      below — exists because a document that binds someone has to be understood by
      the person bound, and the maintainer's first language is Thai. The check
      runs both ways: Thai outside the allowlist fails, and so does an allowlisted
      file with no Thai left in it, because an exception that no longer excuses
      anything is a hole with a label on it.
    proved_by:
      - kind: mutation
        ref: pr/3
        date: 2026-08-25
        caught: >-
          Red in all three directions — a Thai comment added to a source file, the
          Thai half stripped from CLA.md, and the allowlist pointed at a file that
          does not exist. It also caught a defect in itself while being written:
          walking the filesystem picked up verifiable_gates.egg-info/PKG-INFO, a
          build artefact embedding the bilingual README that exists only where the
          package was installed in editable mode. It now reads what git tracks.

  - id: checks-stay-standalone
    title: Every scanner survives being copied out of this package on its own
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_checks_are_standalone.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A scanner is shipped as a single file into a project that has installed
      nothing, and run there with a bare python3. That works only while each file
      imports stdlib only and nothing from this package — a property invisible in
      normal use, because the tests here import the modules. It is also exactly
      the shape a well-meaning refactor breaks: three scanners repeat six lines of
      argv handling, someone lifts them into a shared helper, the suite stays
      green, and every copied file breaks in a repository nobody here can see.
    proved_by:
      - kind: mutation
        ref: pr/4
        date: 2026-08-25
        caught: >-
          The AST checks and the subprocess runs disagree usefully: the AST pass
          catches a shared import before it ships, and copying each scanner to a
          directory where the package cannot be imported catches anything the AST
          pass would have missed. A misuse must exit 2, never 0, so a wrong call
          is never filed as a clean run.

  - id: scanners-tell-their-two-answers-apart
    title: Every scanner is shown a tree that violates it and one that does not
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_checks_behaviour.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A scanner that returns 0 for everything is indistinguishable from a clean
      project: CI stays green and the report says there is nothing to report. The
      pair — one tree that breaks the rule, one that keeps it — is the only thing
      that tells those two apart. The third case is the not-applicable one, which
      has to announce itself, because silence would file "we never looked" under
      "we looked and it was fine".
    proved_by:
      - kind: mutation
        ref: pr/4
        date: 2026-08-25
        caught: >-
          Nine mutations, one per scanner, each making it too generous — red every
          time. Coverage then found three behaviours the pairs never reached: the
          purge-path exemption, the npm branch, and module-level session imports.
          Each is the part a reader assumes works.

  - id: rules-we-ship-we-keep
    title: Scanners that apply to this repository are run against this repository
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_dogfood.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Governance audit round 23 of the reference implementation measured the gap
      between the rules a project exports and the rules it keeps, and the answer
      was 2.7%. The cheapest defence is to point every scanner that can apply here
      at here, from the day it lands. The test also refuses a not-applicable
      result: a scanner that finds nothing to check here is not dogfooding
      anything, and would otherwise sit in the list looking like a pass.
    proved_by:
      - kind: ci-red
        ref: pr/4
        date: 2026-08-25
        caught: >-
          It failed on its first run, on this repository, for a real reason:
          `pip install --no-deps -e .` installs the checkout itself and resolves
          nothing from an index, so there is no hash to pin — and the scanner
          flagged it anyway. The scanner was fixed rather than the repository, and
          the exemption now needs both halves, with a test for each: `--no-deps`
          on its own still reaches the index, and `-e .` on its own drags the
          whole dependency tree in unpinned.
