# This repository's own gate registry — **still empty, and that is the correct
# state at stage 1.**
#
# This is the home of *registries that are checked against reality both ways*, so
# it has to keep one of its own from day one. But **no row goes in before the
# thing that enforces it exists** — a registry listing gates nobody enforces is
# precisely what this whole project exists to stop doing. The first row arrives
# with the first enforcer, in stage 2, when the checks and the doctor move in.
#
# The shape of this file is enforced by `verifiable_gates.registry` and
# `tests/test_registry.py`.

version: 1
gates:
  - id: the-cards-still-say-what-the-repo-says
    title: The two identity cards agree with each other and with the licence on disk
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_identity_cards.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      `CITATION.cff` and `.zenodo.json` describe this repository to readers who
      are not us, and Zenodo's copy is published under a permanent DOI, which by
      the definition of archiving cannot be corrected afterwards. The reference
      implementation measured what happens without a check: on 2026-08-22 its two
      cards and its own register gave three different numbers for one fact, and
      the value published under the DOI was the oldest of the three. The shape of
      the failure is that the further a statement travels from the repository, the
      fewer machines watch it — while the furthest destination is the one place it
      cannot be fixed. The licence is held against `LICENSE` rather than only
      across the two cards, because two cards agreeing with each other and both
      being wrong is exactly what a cross-check between them cannot see.
    proved_by:
      - kind: mutation
        ref: pr/13
        date: 2026-08-26
        caught: >-
          Six planted defects red — the title edited on one card only, the licence
          changed on one card only, a keyword dropped from one, the description
          reworded away from the abstract, the author renamed on the other, and
          both cards moved together to a licence this repository does not carry.

  - id: commit-messages-are-shaped-and-signed
    title: Every commit a branch adds is a Conventional Commit and carries a DCO sign-off
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_lint_commits.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      This decider blocks every commit on a developer's machine and every pull
      request in CI, so both directions are expensive: a false red teaches people
      to reach for `--no-verify`, and a false green lets malformed history in
      permanently. The reference implementation learned three separate lessons
      into it — a required check that gets skipped leaves a pull request BLOCKED
      with nothing red to see, so it runs on what the branch actually adds; a
      merge commit's message is the platform's rather than a person's, so those
      are excluded or the "Update branch" button turns the gate red with nobody
      having typed anything wrong; and the sign-off is the one thing a project
      cannot add retroactively on somebody's behalf.
    proved_by:
      - kind: ci-red
        ref: pr/7
        date: 2026-08-25
        caught: >-
          Running in this repository's own CI it refused commit 3a08fd10c — a
          subject of 73 characters, one over the limit — and held the pull request
          until it was rewritten.
      - kind: mutation
        ref: pr/15
        date: 2026-08-26
        caught: >-
          Six mutations red — counting the subject in bytes rather than characters
          (which shortens the limit to a third for anybody writing in a non-Latin
          script), holding merge commits to the format, accepting a sign-off with
          no address to reply to, separating log records by newline so a multiline
          body became several commits, skipping the sign-off check in hook mode,
          and returning zero whatever was found.

  - id: newcomer-issues-are-not-taken-silently
    title: A pull request closing an issue still labelled for newcomers has to say why
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_issue_handoff.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      From a real incident in the reference implementation on 2026-08-20: an issue
      was labelled `good first issue` at 12:14Z, the maintainer opened and merged
      their own pull request for it by 16:51Z, and an outside contributor opened
      theirs at 17:39Z having started hours earlier. The label stayed on
      throughout, with no assignee and no comment — so they lost an afternoon to
      work already closed. A promise made in a comment on a closed pull request is
      a promise nobody can find again, which is why this is a machine rather than
      a line in a contributing guide. It reads what the platform will actually do
      on merge rather than grepping the body for "Closes #N", because a gate that
      reads something other than what the platform acts on is right only while the
      two happen to agree.
    proved_by:
      - kind: mutation
        ref: pr/15
        date: 2026-08-26
        caught: >-
          Red on every direction — a bare override marker with no reason, one
          indented so it is not a declaration line, one buried mid-sentence, an
          absent body read as an excuse rather than as no declaration, and a
          report naming only the first offending issue instead of all of them.

  - id: one-reader-for-workflow-triggers
    title: There is one reader for `on:`, and it covers all three shapes GitHub accepts
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_workflow_reader.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A parser is a command like any other, and a second copy of it drifts just as
      fast. The reference implementation had this idiom copied in **five places**,
      three of them broken the same way — `on: [push, pull_request]` used the
      value as a dict key, which a list cannot be — and the copies had already
      drifted: one guarded itself with `isinstance`, two did not. The shape nobody
      expects is that the key is usually the boolean `True`: YAML 1.1 reads an
      unquoted `on:` as a boolean, so a reader looking only for the string finds
      nothing in almost every real workflow, and answers as though no triggers
      were declared.
    proved_by:
      - kind: mutation
        ref: pr/16
        date: 2026-08-26
        caught: >-
          Five mutations red — reading only the string key so every unquoted `on:`
          vanished, restoring the idiom that breaks on a list, letting an empty
          file read as None instead of an empty mapping, reading `on: [schedule]`
          as though it carried a cron, and accepting only `.yml` so every
          `.yaml` workflow disappeared from the census.

  - id: one-wrapper-for-the-github-cli
    title: There is one `gh` wrapper, and it fails loudly rather than answering empty
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_gh_wrapper.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation counted this call copied in five places, two of
      them identical character for character, each carrying its own `S603`
      suppression — five exemptions for one command. What the copies risk getting
      wrong is not the call but the failure: with `check=False` and no return-code
      test, a `gh` that failed hands back an empty string, and an empty answer
      reads as data all the way down. The cause is nearly always scope or an
      expired token, and `gh` usually says which, so its message is attached whole
      rather than summarised.
    proved_by:
      - kind: mutation
        ref: pr/16
        date: 2026-08-26
        caught: >-
          Four mutations red — not testing the return code so a failure came back
          as an empty string, discarding gh's own message so the reader lost the
          only line saying what to fix, dropping the timeout, and not stripping
          the output so every comparison downstream saw a trailing newline.

  - id: the-surface-reader-reports-its-own-saving
    title: The API-surface reader is honest about how much it saved, including when it saved nothing
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_skeleton.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The ratio at the end is the reason the tool exists: it is the only thing
      that says which files are worth asking about this way and which are faster
      to read whole. Three separate reviews of the reference implementation caught
      it being subtly wrong in ways nothing else would have shown — a doubled
      parse invisible on one file and a doubling of the work on a directory, a
      denominator one line too large for every file ending in a newline, and a
      `UnicodeDecodeError` escaping an `except OSError` because it inherits from
      `ValueError`, printing a traceback that never said which file. A figure over
      100% is the answer rather than a bug, and clamping it would hide the one
      case the tool exists to identify.
    proved_by:
      - kind: mutation
        ref: pr/16
        date: 2026-08-26
        caught: >-
          Five mutations red — the off-by-one denominator, clamping the ratio to
          100% so "read it whole" stopped being sayable, letting
          UnicodeDecodeError escape the handler, dropping decorators from the
          surface though they bind the caller, and walking the whole tree so
          functions nested inside functions were reported as callable surface.

  - id: english-except-where-it-binds
    title: Everything here is in English, except documents that bind someone legally
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_language_policy.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      This repository is written in English because it is meant to be picked up by
      people who do not read Thai, while the reference implementation it was
      extracted from is in Thai throughout. Stages 2 to 5 move code across that
      boundary repeatedly, so Thai arrives here quietly and by accident rather
      than by decision. The exception — README and CLA, English first and Thai
      below — exists because a document that binds someone has to be understood by
      the person bound, and the maintainer's first language is Thai. The registry
      handover added a second kind of exception with a different shape: the rule
      catalogue keeps each rule's original wording beside the published English,
      because a translation of an incident report is a retelling and the retelling
      is not the record. That Thai is data, so it is not excused by file — it is
      excused only by position, in a `*_th` value, in a cited step name, or inside
      a string literal in the code that renders those fields. A Thai comment, key
      or identifier stays forbidden in every file, which is the leak this check
      was built for. The check
      runs both ways: Thai outside the allowlist fails, and so does an allowlisted
      file with no Thai left in it, because an exception that no longer excuses
      anything is a hole with a label on it.
    proved_by:
      - kind: mutation
        ref: pr/3
        date: 2026-08-25
        caught: >-
          Red in all three directions — a Thai comment added to a source file, the
          Thai half stripped from CLA.md, and the allowlist pointed at a file that
          does not exist. It also caught two defects in itself. Walking the
          filesystem picked up verifiable_gates.egg-info/PKG-INFO, a build artefact
          embedding the bilingual README that exists only where the package was
          installed in editable mode. Then reading only *tracked* files let a new
          file pass locally and fail in CI, which happened for real in stage 2e —
          it now reads tracked plus untracked-not-ignored, the set a developer is
          one `git add` away from committing.

  - id: checks-stay-standalone
    title: Every scanner survives being copied out of this package on its own
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_checks_are_standalone.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A scanner is shipped as a single file into a project that has installed
      nothing, and run there with a bare python3. That works only while each file
      imports stdlib only and nothing from this package — a property invisible in
      normal use, because the tests here import the modules. It is also exactly
      the shape a well-meaning refactor breaks: three scanners repeat six lines of
      argv handling, someone lifts them into a shared helper, the suite stays
      green, and every copied file breaks in a repository nobody here can see.
    proved_by:
      - kind: mutation
        ref: pr/4
        date: 2026-08-25
        caught: >-
          The AST checks and the subprocess runs disagree usefully: the AST pass
          catches a shared import before it ships, and copying each scanner to a
          directory where the package cannot be imported catches anything the AST
          pass would have missed. A misuse must exit 2, never 0, so a wrong call
          is never filed as a clean run.

  - id: scanners-tell-their-two-answers-apart
    title: Every scanner is shown a tree that violates it and one that does not
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_checks_behaviour.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A scanner that returns 0 for everything is indistinguishable from a clean
      project: CI stays green and the report says there is nothing to report. The
      pair — one tree that breaks the rule, one that keeps it — is the only thing
      that tells those two apart. The third case is the not-applicable one, which
      has to announce itself, because silence would file "we never looked" under
      "we looked and it was fine".
    proved_by:
      - kind: mutation
        ref: pr/4
        date: 2026-08-25
        caught: >-
          Nine mutations, one per scanner, each making it too generous — red every
          time. Coverage then found three behaviours the pairs never reached: the
          purge-path exemption, the npm branch, and module-level session imports.
          Each is the part a reader assumes works.

  - id: rules-we-ship-we-keep
    title: Scanners that apply to this repository are run against this repository
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_dogfood.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Governance audit round 23 of the reference implementation measured the gap
      between the rules a project exports and the rules it keeps, and the answer
      was 2.7%. The cheapest defence is to point every scanner that can apply here
      at here, from the day it lands. The test also refuses a not-applicable
      result: a scanner that finds nothing to check here is not dogfooding
      anything, and would otherwise sit in the list looking like a pass.
    proved_by:
      - kind: ci-red
        ref: pr/4
        date: 2026-08-25
        caught: >-
          It failed on its first run, on this repository, for a real reason:
          `pip install --no-deps -e .` installs the checkout itself and resolves
          nothing from an index, so there is no hash to pin — and the scanner
          flagged it anyway. The scanner was fixed rather than the repository, and
          the exemption now needs both halves, with a test for each: `--no-deps`
          on its own still reaches the index, and `-e .` on its own drags the
          whole dependency tree in unpinned.

  - id: a-bundle-installs-and-answers
    title: A fresh install gives a project something that runs, and never overwrites its decisions
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_install_and_doctor.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Testing the installer and the doctor apart leaves the only claim that
      matters proven by nobody: that they fit together in a directory where no
      package is present. The second property is the one that decays quietly —
      scaffold.json, gates.yaml and the workflow hold decisions somebody made, and
      an install that clobbered them would destroy exactly the work the bundle
      exists to protect while its output still read as success.
    proved_by:
      - kind: mutation
        ref: pr/5
        date: 2026-08-25
        caught: >-
          Red on all of it — overwriting the files that carry decisions, letting an
          incomplete bundle install anyway, reporting NA as pass, and dropping the
          count of suite gates still waiting. Coverage then found two branches no
          test reached: a scan that exists but does not compile, and the clean run
          returning 0, which had only ever been exercised through a subprocess
          where a wrong exit code is easy to lose among captured output.

  - id: the-manifest-is-an-input
    title: The manifest is validated as data, and a rule the bundle cannot decide cannot carry a script
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_manifest.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation's doctor read overlay.json from the directory
      beside it, which is right while one tool serves one registry and wrong the
      moment the tool is a package several projects install. Passing the path in is
      the seam that lets one doctor answer for many catalogues. The subtle rule the
      schema enforces is that a gate of kind suite may not carry a script: a suite
      gate is by definition one this bundle cannot decide, and a script would let it
      run, pass, and be counted — turning "the project still has to write this test"
      into "checked".
    proved_by:
      - kind: mutation
        ref: pr/5
        date: 2026-08-25
        caught: >-
          Counting suite entries as scans, and allowing a suite entry to carry a
          script, both went red. Every schema rule has a case that breaks it alone,
          because a validator that only ever sees valid input is one nobody has
          watched work.

  - id: the-shipped-reader-agrees-with-the-real-one
    title: The hand-written YAML reader agrees with PyYAML on this repository's own files
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_registry_scan.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The shipped registry scanner cannot use PyYAML — it runs in projects that
      have installed nothing — so it carries a hand-written subset reader. That
      makes it the riskiest code in the bundle: a reader more forgiving than the
      real one reports green on files it did not understand, and nothing about
      that looks wrong. Two defences: anything outside the subset raises, and on
      this repository's own files the two readers must agree value for value. The
      one accepted divergence, block scalar bodies, is measured rather than waved
      through — the count of blanked values must equal the count of block scalars.
    proved_by:
      - kind: mutation
        ref: pr/6
        date: 2026-08-25
        caught: >-
          Writing the test found two real defects on the first run. An anchor or
          an unclosed quote in *value* position was read as ordinary text, because
          the guard only looked at the start of a line — the reader was quietly
          more permissive than YAML. And `portable: false` came back as the string
          "false", which is truthy: any rule that ever read a boolean would have
          read it backwards, silently. Both fixed in the reader. Nine further
          mutations across the four directions and the reader went red.

  - id: the-box-opens-already-true
    title: A fresh install's registry passes its own check, and is not skipped as not-applicable
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_box_opens_true.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Most rules in this bundle end with "register it in your gates.yaml". If the
      box does not contain that file, already true about itself, the instruction
      is prose — governance audit round 23 of the reference implementation is where
      that gap was first measured. The second half matters as much: the check must
      not report N/A, or an absent index would look like a satisfied one.
    proved_by:
      - kind: ci-red
        ref: pr/6
        date: 2026-08-25
        caught: >-
          Red on its first run. The shipped starting registry declared its rows as
          `kind: step` naming steps that the shipped starting workflow does not
          have, so a project that installed the bundle and changed nothing would
          have failed its own registry check immediately. The defaults were wrong
          together and only disagreed once something ran both.

  - id: a-shipped-file-declares-what-it-needs
    title: Shipped files are stdlib-only, or declare their dependency in the manifest — both ways
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_shipped_requirements.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      The scans and the doctor run on a bare CI runner, so they may import nothing
      but the standard library. preflight is the exception: it reads whole workflow
      files, which the narrow subset reader in the scans cannot do, and it runs on
      a developer's machine rather than a runner. The reference implementation
      shipped it with that dependency undeclared, which means a target project
      learns the requirement from a traceback in its own CI. The rule here is not
      "no dependencies" but "no silent ones", and it is checked in both
      directions: an undeclared import is a surprise for someone else, and a
      declaration nothing imports is a requirement every project carries forever
      for a reason that expired.
    proved_by:
      - kind: mutation
        ref: pr/7
        date: 2026-08-25
        caught: >-
          The list of Python files to check is derived from the manifest, so a new
          shipped file that joins neither tier fails rather than being skipped.

  - id: preflight-loses-no-step
    title: Every workflow step reaches the plan exactly once, run or skipped with a reason
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_preflight.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The value of reading commands out of the workflow is that no second copy
      exists to drift. That holds only while every step ends up in the plan: one
      dropped silently gives the same false confidence as a harness reporting green
      while the tests are red. A step's env travels with it for the same reason —
      running the same command in a different environment answers a different
      question from the one CI asked, which is how a coverage step once overwrote
      the wrong file on a developer's machine.
    proved_by:
      - kind: mutation
        ref: pr/7
        date: 2026-08-25
        caught: >-
          Six mutations red: dropping an unrunnable step instead of skipping it
          aloud, discarding a step's env, letting the config beat --only, reading
          jobs from one workflow file instead of all, hiding an uninstalled hook,
          and returning 0 after a step failed.

  - id: the-sheet-is-rendered-not-written
    title: A rule sheet is a pure function of a catalogue, a preamble and a language
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_skill_renderer.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A hand-written rule sheet is a third register, and it drifts from the
      catalogue the moment somebody edits one side. Generating it fixes that only
      while the render is byte-deterministic, so a project can hold its committed
      file against a fresh one and see a difference rather than trust there is
      none. Three things were constants in the reference implementation and are
      inputs here: the catalogue, so one renderer serves any set of rules; the
      preamble — the opening of a sheet is prose a project writes about itself,
      and baking one project's paragraphs into the tool would make every other
      project ship that project's story; and the language, because the catalogue
      carries the published English beside each rule's original wording, and a
      renderer that could reach only one of them would make the other dead weight
      in the file. Dead weight is what stops being maintained.
    proved_by:
      - kind: mutation
        ref: pr/8
        date: 2026-08-25
        caught: >-
          Five mutations red — rendering rules that were never marked exportable,
          leaving born_from unwrapped, making --check always agree, rendering from
          a registry that did not pass its own schema, and ignoring the caller's
          headings.
      - kind: mutation
        ref: pr/9
        date: 2026-08-25
        caught: >-
          Five more red once the renderer read a catalogue instead of a registry —
          ignoring the language suffix, dropping the fallback so a missing
          translation rendered blank instead of the published text, pinning the
          headings to English whatever the language, writing the file during
          --check, and ignoring the requested layer.

  - id: the-harness-never-passes-what-it-cannot-decide
    title: The fail-fix harness answers machine-readably, and reports skips rather than hiding them
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_harness.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The harness turns a checklist into a loop, and the shape of its answer is
      the value: gate id, cause, and the trap the rule came from. A loop that
      knows only what broke will satisfy the letter of a check; one that knows
      what the rule protected has a chance at the cause. It runs gates of kind
      test and cannot decide job or step, whose commands live in the workflow —
      reporting those as anything but "skipped, because" would turn "nobody
      checked this" into "this passed".
    proved_by:
      - kind: mutation
        ref: pr/8
        date: 2026-08-25
        caught: >-
          Six mutations red, including running job gates as if they were tests,
          dropping the hint, returning 0 after a gate failed, and treating an
          unknown gate id as a clean run. A seventh attempt produced a syntax
          error rather than a behaviour change, which is not a result — it was
          redone so the code still parsed before drawing any conclusion.

  - id: a-published-rule-carries-its-origin
    title: A published rule names the incident behind it, belongs to a published layer, and names no framework
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_rules_catalogue.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The registry handover split what was one file in the reference
      implementation into two, because a rule and its enforcement have different
      lifetimes. Enforcement moves whenever a project reorganises its tests and is
      written in that project's framework; the rule changes only when reality
      teaches something new. Keeping both in one file worked while there was one
      project, and stops working the moment a second adopts a rule: its
      `enforced_by` would point at files that project does not have, and a
      registry whose rows point at nothing is the thing this bundle exists to
      prevent. Three invariants are enforced rather than left to a reader, and
      each is a mistake that is easy to make and silent once made. A rule with no
      `born_from` is somebody's preference, and years later nobody can tell
      whether the conditions that created it still hold, so it can never be
      retired. A rule at layer `internal` is tied to one architecture, and
      publishing it as universal is an overclaim — a governance audit of the
      reference implementation measured five rules carrying the wrong label, so
      the catalogue cannot express the value at all. And a rule naming one stack's
      library means nothing to a reader on another stack while still claiming to
      be universal; the `reference` block is exempt on purpose, because naming
      that project's own files is what makes it evidence.
    proved_by:
      - kind: mutation
        ref: pr/9
        date: 2026-08-25
        caught: >-
          Eight mutations red — admitting `internal` into the published layers,
          dropping `born_from` from the required fields, disabling the framework
          scan outright, extending it into the `reference` block so a cited
          filename became a violation, skipping the duplicate-id check, accepting
          a `script` the bundle does not ship, allowing `..` in a script path, and
          reading a catalogue whose version this reader does not speak.

  - id: the-sheets-match-the-catalogue
    title: The committed sheets are a fresh render, and between them they publish every rule
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_sheets.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Generated files that live in git are worth keeping only while something
      compares them against a fresh render on every run. Without that, a sheet
      somebody improved by hand looks exactly like a sheet in step with the
      catalogue, and the reason for generating it is gone. The second half is the
      one that decays quietly: the sheets have to **partition** the catalogue. A
      rule belonging to no layer's sheet is published nowhere while still counting
      as published, and nothing about either file would look wrong — the sheet is
      shorter and the catalogue is unchanged.
    proved_by:
      - kind: mutation
        ref: pr/9
        date: 2026-08-25
        caught: >-
          Three planted defects red — a sentence added to a sheet by hand, a rule
          moved to a layer that no sheet renders so it vanished from both, and the
          "do not edit" banner removed from a generated file.

  - id: the-schema-is-read-the-way-it-is-written
    title: The registry schema is proved against both a well-formed registry and a broken one
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_registry.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Everything else in this bundle reads a registry through this module, so a
      permissive reader is a hole under every other check at once. It had no row of
      its own until the registry handover went looking, which is itself the lesson:
      the first file written in a repository is the one nobody thinks to register,
      because at the time there was no index to register it in.
    proved_by:
      - kind: mutation
        ref: pr/10
        date: 2026-08-25
        caught: >-
          Four mutations red — accepting a gate at layer internal that also claims
          to be portable, accepting one with no origin, opening the pillar
          vocabulary, and accepting proof of a kind nobody defined. Two earlier
          attempts reported "not red" and were the author's error rather than the
          suite's: one patched a line that does not exist, and one widened the
          vocabulary with a value no test uses.

  - id: every-commit-is-shaped-and-signed
    title: Every commit added by a branch is a Conventional Commit and carries a sign-off
    kind: job
    severity: blocking
    enforced_by: {job: commit-lint}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation learned both halves the hard way. A required
      check that gets skipped leaves a pull request BLOCKED forever with nothing red
      to see, so the job runs on what the branch actually adds rather than on the
      whole history. And the sign-off is the one thing a project cannot add
      retroactively: it is a statement by the person who wrote the commit, at the
      time they wrote it, and it was the single unmet item of OSPS Baseline level 2
      there.
    proved_by:
      - kind: ci-red
        ref: pr/7
        date: 2026-08-25
        caught: >-
          It refused commit 3a08fd10c — a subject of 73 characters, one over the
          limit — and held the pull request until it was rewritten.

  - id: the-static-battery-runs-on-every-push
    title: Lint, formatting and types are decided by CI, not by whoever remembered to run them
    kind: job
    severity: blocking
    enforced_by: {job: lint}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A check that only runs where somebody remembers to run it is a check that
      stops running on the busiest day. The battery is one job so that a single red
      answer names every static problem at once, rather than one per push over three
      pushes.

      **This gate has never gone red, and carries no `proved_by` because of it.**
      It has run on every push since the repository's first, and every finding it
      would have caught was caught locally first — the rule catalogue's branch had
      six, and `ruff` reported all six before the branch was pushed. That is a good
      outcome and a weak proof: a job that has never failed is indistinguishable
      from a job that checks nothing, which is the very thing
      `gates-carry-red-evidence` says out loud. The honest record is this
      paragraph, not a citation of a run that did not happen. The two real red runs
      in this repository's history are on `test` and `commit-lint`, and they are
      cited by the gates that own them.
