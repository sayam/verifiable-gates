# This repository's own gate registry.
#
# This is the home of *registries that are checked against reality both ways*, so
# it has to keep one of its own from day one. But **no row goes in before the
# thing that enforces it exists** — a registry listing gates nobody enforces is
# precisely what this whole project exists to stop doing. The registry began
# empty at stage 1 and grew one row per enforcer as each moved in.
#
# The shape of this file is enforced by `verifiable_gates.registry` and
# `tests/test_registry.py`.

version: 1
gates:
  - id: the-cards-still-say-what-the-repo-says
    title: The two identity cards agree with each other and with the licence on disk
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_identity_cards.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      `CITATION.cff` and `.zenodo.json` describe this repository to readers who
      are not us, and Zenodo's copy is published under a permanent DOI, which by
      the definition of archiving cannot be corrected afterwards. The reference
      implementation measured what happens without a check: on 2026-08-22 its two
      cards and its own register gave three different numbers for one fact, and
      the value published under the DOI was the oldest of the three. The shape of
      the failure is that the further a statement travels from the repository, the
      fewer machines watch it — while the furthest destination is the one place it
      cannot be fixed. The licence is held against `LICENSE` rather than only
      across the two cards, because two cards agreeing with each other and both
      being wrong is exactly what a cross-check between them cannot see.
    proved_by:
      - kind: mutation
        ref: pr/13
        date: 2026-08-26
        caught: >-
          Six planted defects red — the title edited on one card only, the licence
          changed on one card only, a keyword dropped from one, the description
          reworded away from the abstract, the author renamed on the other, and
          both cards moved together to a licence this repository does not carry.

  - id: the-archive-is-read-back
    title: The archive reader holds Zenodo's versions to the releases both ways, and posture's cron runs it live
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_zenodo.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The cards in the tree are held to each other and the About field is read
      live, but the archive — the one copy that cannot be corrected — was read
      by nobody: the 2026-08-30 re-audit (round 24) compared Zenodo's versions
      with the releases by hand, 7 and 7, and asked who would see the eighth.
      `verifiable_gates.zenodo` reads every version under the concept DOI the
      citation card advertises and holds the list to the release tags both ways.
      This gate is the reader's behaviour, proved offline in the `test` job; the
      live read is a step of `posture.yml` — weekly and on every push to main —
      whose gate is `watched`, seen within seven days, so a release with no DOI is
      seen the week it happens rather than at the next audit, not the minute it
      happens. The archive refuses a page above 25, found on the first live call
      — so the reader pages; and a record with no version, or two under one
      version, is red rather than dropped by the map (pre-cut review, 2026-08-30).
    proved_by:
      - kind: mutation
        ref: pr/100
        date: 2026-08-30
        caught: >-
          Three mutations red — the release→archive direction dropped (a release
          with no DOI passed), the concept check dropped (a record under another
          concept passed), and the paging stopped after page one (the 26th version
          was never read). Found live before the tests: the archive refuses
          `size=100` with a 400, which the first call met.
      - kind: mutation
        ref: pr/104
        date: 2026-08-30
        caught: >-
          `_uncountable` dropped from `problems()` and the duplicate-version branch
          disabled — each red in the test that feeds two `0.1.6` records and one
          without a version, the input the pre-cut review used to get a green.
  - id: the-pins-are-audited-here
    title: The tools this repository installs for itself are audited for advisories, and every finding is judged
    kind: job
    severity: blocking
    enforced_by: {job: advisories}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      This repository ships `advisories.py` — the decider that holds a scanner's
      findings to a register of accepted ones in both directions — and until
      2026-08-29 ran no scanner over its own pins. Forty hash-pinned packages,
      including the interpreter's own tooling, sat unaudited while the rule
      `ci-tools-cve-audit` was published from the same tree. The job lets
      `pip-audit` write and the decider decide: the scanner's exit code is not the
      verdict, because a finding already judged that still turns a job red is the
      check that gets switched off within a fortnight.
    proved_by:
      - kind: mutation
        ref: pr/42
        date: 2026-08-29
        caught: >-
          The command line red on a report carrying an unjudged advisory, red on a
          register entry that no finding matches any more, and green only when the
          two agree — with the scanner's own verdict overridden by `|| true` so the
          decider is the one that decides.
      - kind: ci-red
        ref: run/33266155590
        date: 2026-08-30
        caught: >-
          The job's first live red, on the throwaway pull request #71: an exemption
          planted in `advisories-accepted.txt` that no finding matched was refused
          with "the register accepts this and no scan reports it any more". Until
          then the job had been green on all 67 of its runs with an empty register,
          the one job here never seen red on the platform (re-audit census, 2026-08-30).

  - id: newcomer-handoff-is-checked-on-our-own-pull-requests
    title: The issue-handoff gate this bundle ships runs on this repository's pull requests
    kind: job
    severity: blocking
    enforced_by: {job: handoff}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      `check_issue_handoff.py` was born from a real afternoon lost by an outside
      contributor (2026-08-20) and shipped in this bundle for every consumer —
      while this repository, which also labels issues and also merges its own
      pull requests, never ran it on itself. A rule kept everywhere except at
      home is the shape the reference implementation measured at 2.7%.
    proved_by:
      - kind: mutation
        ref: pr/42
        date: 2026-08-29
        caught: >-
          The job's command and the three variables it reads are held by a test
          against the module's own contract; a workflow that dropped `PR_BODY`
          went red before it could let a silent take-back through.

  - id: the-cla-line-is-checked-on-our-own-pull-requests
    title: A pull request's acceptance of CLA.md is read by a job, not only asked for
    kind: job
    severity: blocking
    enforced_by: {job: cla}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      CONTRIBUTING asked every pull request for `I have read and agree to
      CLA.md v1. — <name> <email>` from the first one, and nothing read the
      line: it was a step a person did, or forgot, and the history could not
      say which. A five-model outside audit of v0.1.0 (2026-08-29) listed the
      promise among this repository's rules with no enforcer behind it — the
      same shape as the deciders that were shipped and never pointed at home.
      The job reads the description with the sign-off's own name-and-address
      shape; Dependabot is skipped, since a bump carries no copyright.
    proved_by:
      - kind: ci-red
        ref: run/33262135008
        date: 2026-08-29
        caught: >-
          The pull request that added the job was opened without the line on
          purpose. Every other check green, `cla` red with its own words — "no
          line 'I have read and agree to CLA.md v1. — <name> <email>' in the
          pull request description" — and green once the line was added.
      - kind: mutation
        ref: pr/74
        date: 2026-08-30
        caught: >-
          CONTRIBUTING's example line with its brackets removed, the example removed,
          and the job's failure text without the example — three mutations, each red
          in the test that runs the example through the job's own grep. Preceded by
          a live red on pull request #68, which wrote the address bare.
      - kind: mutation
        ref: pr/83
        date: 2026-08-30
        caught: >-
          The failure echo's broken quoting put back — the test that runs the FAIL
          branch through bash saw stderr "No such file or directory" and no example
          on stdout. Found by the pre-cut review of 2026-08-30.
      - kind: mutation
        ref: pr/90
        date: 2026-08-30
        caught: >-
          The skip condition put back to `github.actor` — red in the test that holds
          it to the pull request's author. On the same pull request the job ran and
          passed for a human author, so the change did not widen the skip.
      - kind: mutation
        ref: pr/93
        date: 2026-08-30
        caught: >-
          Dropping `edited` from ci.yml's pull_request types turned the test red;
          restored, one body edit on the pull request itself started CI run
          33284486764, which re-read the CLA line without a close/reopen.

  - id: preflight-and-the-harness-walk-this-repository
    title: The developer-side instruments this bundle ships are pointed at this repository
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_instruments_dogfood.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The dogfood suite pointed every *scanner* at this tree from the day it
      landed and said so — and stopped there. `preflight` and the fail-fix
      harness, the two instruments a developer actually runs, had no
      `scaffold.json` to read here and were never walked over their own
      repository. The rule `fail-fix-harness-honest` was published from a tree
      whose harness had never been asked about that tree.
    proved_by:
      - kind: mutation
        ref: pr/42
        date: 2026-08-29
        caught: >-
          Removing `preflight_jobs` from `scaffold.json` first stayed **green**:
          the fallback happens to name the same two jobs here, so a test asking
          only the plan could never tell the config from its absence — it now
          reads the config itself, and that mutation is red. Also red: the job
          dropping `|| true` so the scanner's exit decided, and the handoff job
          losing `PR_BODY`; the harness asked about a gate it cannot find returns
          its own code rather than a pass.
      - kind: mutation
        ref: pr/68
        date: 2026-08-30
        caught: >-
          Four planted defects red in the release job's shape — `--no-isolation`
          dropped from the build step, `setuptools` dropped from the pins, the SBOM
          environment's install put back to the unpinned `install dist/*.whl`, and
          the `pins/runtime` entry removed from Dependabot.
      - kind: mutation
        ref: pr/78
        date: 2026-08-30
        caught: >-
          A name dropped from `requirements.in`, a name added to it, and a root
          annotation removed from the compiled file — three mutations, each red in
          the test that holds the two lists together. Before it, the first left all
          1121 tests green in a worktree (re-audit round 16).
      - kind: mutation
        ref: pr/86
        date: 2026-08-30
        caught: >-
          `packaging` added to `[project].dependencies` alone, and the build backend
          switched to `hatchling` in `pyproject.toml` alone — each red in the test
          that holds the two requirement lists to the pins. Found by the pre-cut
          review of 2026-08-30.
      - kind: mutation
        ref: pr/94
        date: 2026-08-30
        caught: >-
          Stripping the version comment from one SHA-pinned `uses:` line in
          posture.yml failed the dogfood test with "names no version", and swapping
          one pin for a floating `@v7` failed its occurrence count (19 == 20).

  - id: the-security-policy-quotes-one-set-of-numbers
    title: SECURITY.md exists, quotes one set of timeframes, names no address, and points at a live channel
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_security_policy.py]}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      This repository publishes `security-policy-consistent` and, until
      2026-08-29, had no security policy of its own — a tool for other people's
      security posture with no way to report a hole in it. The rule's incident is
      three copies of a number disagreeing; the cheapest way to keep three copies
      agreeing is one copy, so the timeframes live in this file only and a test
      refuses a "days" figure anywhere else. Private vulnerability reporting was
      switched on the same day, so the channel the file names is one that answers.
    proved_by:
      - kind: mutation
        ref: pr/43
        date: 2026-08-29
        caught: >-
          A timeframe changed in one sentence only went red; an address planted in
          the file went red; a "within 7 days" added to CONTRIBUTING went red.

  - id: every-module-declares-its-role
    title: Every module in the package declares which of the four kinds it is
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_roles.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      `scripts-declare-their-role` is published from here, and every module wrote
      a `Role:` line by habit — until ten did not, among them the registry schema
      and the catalogue reader that everything else depends on, and nothing
      noticed, because a habit has no test. The kind is what lets a reviewer ask
      for the right evidence: a generator is proved by its output equalling the
      committed file, a reader by its numbers matching the source, and coverage
      answers for neither.
    proved_by:
      - kind: mutation
        ref: pr/43
        date: 2026-08-29
        caught: >-
          A module with its `Role:` line removed went red by name; a line naming a
          fifth kind went red; a module carrying two went red.

  - id: sast-is-a-job-and-its-alerts-are-judged
    title: CodeQL security-extended runs as a job, and every open alert on the ref is judged
    kind: job
    severity: blocking
    enforced_by: {job: codeql}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      `codeql-sast` is published from here — "as a job, not the default setup",
      because something clicked into place in a UI cannot be reviewed and can
      disappear silently — and this repository had neither the job nor the
      click. CodeQL's own step never fails on a finding: it uploads alerts to a
      page outsiders read first. So the job ends with a decider that reads the
      alerts back for this ref and refuses any that is neither in
      `pins/dev/code-scanning-accepted.txt` nor dismissed with a reason, in both
      directions — the same shape as the advisory register.
    proved_by:
      - kind: ci-red
        ref: pr/45
        date: 2026-08-29
        caught: >-
          A throwaway branch planted `eval()` over request input; the analysis
          raised the alert and the decider step went red with the rule named —
          `alert CodeQL/py/code-injection (open) has not been judged`. The same
          pull request's CodeQL step itself stayed green, which is the reason the
          decider exists. The branch was deleted, never merged.

  - id: a-secret-is-stopped-on-the-way-in
    title: gitleaks scans every commit of the history on every push and pull request
    kind: job
    severity: blocking
    enforced_by: {job: secret-scan}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      A secret that reaches history cannot truly be deleted on GitHub — old
      objects are still served by SHA — so stopping it on the way in is always
      cheaper. `push-secret-scan` was published from here with nothing scanning
      this history. The binary is a pinned release verified against its published
      checksum rather than the marketplace action, which carries a commercial
      end-user licence this repository's own licensing rule would have to
      explain.
    proved_by:
      - kind: ci-red
        ref: pr/45
        date: 2026-08-29
        caught: >-
          A throwaway branch first committed the documented AWS example key, and
          the job stayed **green** — gitleaks allowlists that exact value, so the
          probe proved nothing and is recorded here so nobody repeats it. A second
          commit planted a token in the `ghp_` shape: red, `leaks found: 1`, with
          neither the value nor the file printed (verbose off, redact on), 57
          commits scanned. The branch was deleted, never merged.
      - kind: mutation
        ref: pr/97
        date: 2026-08-30
        caught: >-
          The gitleaks pin's mover on the cron: the step removed, the version
          hardcoded instead of read from security.yml, and its `exit 1` turned to
          `exit 0` — each red in the test that runs the block through bash on a
          tree pinning 8.0.0.
      - kind: mutation
        ref: pr/105
        date: 2026-08-30
        caught: >-
          The mover's bare `grep | head | sed` pipeline put back: on a tree whose
          download line changed shape the step aborted with no message, and the test
          that expects "could not read the pinned gitleaks version" went red.

  - id: a-release-carries-its-sbom-and-provenance
    title: A release's wheel, sdist and SBOM are built in CI, attested keyless, and verified both ways before they are attached
    kind: job
    severity: watched
    enforced_by: {job: release-sign}
    watched_by:
      who: the maintainer
      within_days: 1
      cadence: per release
      how: >-
        The release page shows the job beside the assets it attaches, and the maintainer publishes releases by hand; `not_required.release-sign` promises one day, and a test holds the two numbers together.
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      `release-signed-and-attested` was published from here with two releases
      carrying neither an SBOM nor a signature — a downloader could not tell the
      wheel came from CI at all. The SBOM is taken from a clean environment
      holding exactly the built wheel, so it lists the package and what it pulls
      in rather than what a build machine happened to have. Verification is
      two-way inside the job, before the upload step can run: the real wheel must
      verify, and a copy with one byte appended must be refused — a verifier
      nobody has watched refusing is one nobody has proved reads anything.
    proved_by:
      - kind: mutation
        ref: pr/47
        date: 2026-08-29
        caught: >-
          The first dispatch against `v0.1.1` failed at the build step: the job
          checked out the tag and installed the tag's pins, which predate the
          tools that attest it (fixed in pr/48 — tools from the workflow's tree,
          the artifact from the tag). The second dispatch ran every step: the
          real wheel, its SBOM predicate and the sdist verified, the copy with one
          byte appended was refused, and only then were the three assets
          attached. Verified again from a developer's machine with
          `gh attestation verify`: two attestations (SLSA provenance, CycloneDX
          SBOM), and the tampered copy refused there too. The SBOM lists
          `verifiable-gates@0.1.1` and `PyYAML@6.0.3` and nothing else.

  - id: the-list-of-unproved-gates-only-shrinks
    title: Every gate carries `proved_by`, and the names allowed to lack it are a list that only shrinks
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_gate_evidence.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      `gates-carry-red-evidence` is published from here and says the list of
      gates without evidence can only shrink — and this repository had no such
      list. The schema keeps `proved_by` optional on purpose, which left nothing
      between "one gate without evidence" and "two": an outside audit on
      2026-08-29 found the one, and nothing would have noticed the second. The
      list reached zero the same day and is enforced from there: both
      directions, so a stale name is as red as a missing one, and a ceiling of
      zero that a commit has to raise on purpose.
    proved_by:
      - kind: mutation
        ref: pr/50
        date: 2026-08-29
        caught: >-
          A gate with its `proved_by` removed went red by name; a name added to
          the list without a gate to match went red; a proof row with its
          `caught` emptied went red.

  - id: a-deliberate-non-decision-has-a-record-and-an-expiry
    title: DECISIONS.md holds every deliberate choice with its reason and the condition that expires it
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_decisions.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The fourth practice on the sheet this repository publishes is that every
      significant decision has a record, including what was deliberately cut and
      the condition that would make the decision expire. An outside audit on
      2026-08-29 read at least eight of this repository's deliberate choices as
      gaps, because the reasons lived in comments, commit messages and a
      changelog — places an outside reader does not look, and places nothing
      expires. The record is a table with a shape a test can hold, and one
      mechanical expiry: a revisit date that, once passed, keeps the suite red
      until somebody re-decides.
    proved_by:
      - kind: mutation
        ref: pr/50
        date: 2026-08-29
        caught: >-
          A row with its `why` emptied went red by id; a duplicated id went red;
          a revisit date set to yesterday went red naming the decision; a column
          renamed in the header went red.

  - id: the-posture-is-read-on-a-schedule
    title: Branch protection and the repository switches are read weekly and on every push, and held to the register
    kind: job
    severity: watched
    enforced_by: {job: posture}
    watched_by:
      who: the maintainer
      within_days: 7
      cadence: weekly, the platform's cron, and every push to main
      how: >-
        The run page is the record and the platform e-mails the workflow's author on a scheduled failure; `pins/dev/posture-declared.json` `not_required.posture` makes the same seven-day promise, and a test holds the two numbers together. `red_streak_census`, on the same cron, measures how long a red actually stood against this number.
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      `platform-posture-verified` was published from here while this
      repository's own protection had been checked exactly once, by an outside
      audit on 2026-08-29, against a sentence in CONTRIBUTING. A switch changes
      by a click, not a commit, so no test in the tree can see it drift; the
      settings half of `posture` needs an administrator's token, which is a
      secret with a custodian, not a job token. So it runs on its own schedule
      and on every push to main, exits 2 when it cannot look, and holds sixteen
      switches (twelve at first; four more on 2026-08-30) and the required-checks set to `pins/dev/posture-declared.json`
      in every direction `check_problems` knows.
    proved_by:
      - kind: mutation
        ref: pr/52
        date: 2026-08-29
        caught: >-
          Run from a maintainer's machine before the secret existed: red on four
          checks that ran on pull requests and were not required (`advisories`,
          `codeql`, `handoff`, `secret-scan`), on `posture` itself for being
          neither required nor declared, and on four switches that did not hold
          their declared value (`allow_squash_merge`, `allow_merge_commit`,
          `delete_branch_on_merge`, `web_commit_signoff_required`); green only
          after the platform was changed to match and `posture` was excused with
          who sees it.
      - kind: ci-red
        ref: pr/53
        date: 2026-08-29
        caught: >-
          **A false green, produced by this gate.** With the secret in place the
          job reported all twelve switches holding; `allow_squash_merge` was then
          flipped on the platform and the job, dispatched again, still reported
          all twelve holding. The token could not see the repository switches:
          they came back `None`, `setting_problems` skips a `None`, and
          `unreadable` reports only switches declared unreadable — a readable one
          arriving empty fell between the two. A third reader, `blind`, now makes
          that red by name with the value it should hold; the mutation dropping
          it from the caller is red in the tests.
      - kind: ci-red
        ref: pr/55
        date: 2026-08-29
        caught: >-
          Both directions, live, with the secret in place: `enforce_admins`
          switched off on the platform — the dispatched job went red naming it
          and its declared value; switched back on — green, with the four merge
          switches no fine-grained token receives printed "by hand" with the
          value each should hold. The earlier attempt on
          `required_conversation_resolution` proved nothing: its toggle endpoint
          answered 404 both ways and the platform never changed, which two green
          runs would have hidden had the state not been read back each time.
      - kind: ci-red
        ref: run/33282261202
        date: 2026-08-30
        caught: >-
          Both directions, live, for the four switches added that day:
          `sha_pinning_required` turned off on the platform — the dispatched job
          went red naming it and its declared value; turned back on — green with
          all 16 switches holding (run 33282291263). The custodian's fine-grained
          token reads the Actions policy and the alerts switch.
      - kind: ci-red
        ref: run/33289361339
        date: 2026-08-30
        caught: >-
          The selected-actions detail, both ways live: a pattern `*` put under
          "selected" on the platform — the dispatched job went red printing the
          detail and the declared one; the pattern removed — green with all 17
          switches holding (run 33289388186).

  - id: a-declared-schedule-is-watched
    title: The schedule census runs on every test job, over a full clone, so a silent cron is red
    kind: step
    severity: blocking
    enforced_by: {job: test, step: every declared schedule is still firing}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      The first cron this repository ever declared arrived with `posture.yml`,
      and `schedules-still-fire` — published from here — says a declared
      schedule must be provably still firing, because "no runs at all" looks
      exactly as quiet as "no run went red". The census needs each workflow's
      birthday to tell "added on Thursday" from "the platform refused it", and a
      shallow clone reports every file as newborn; so the test job clones the
      full history. A workflow the platform has not met yet (404 — the file is
      not on `main`) is "never fired", which its birthday excuses until due.
    proved_by:
      - kind: mutation
        ref: pr/52
        date: 2026-08-29
        caught: >-
          The census run locally on the branch before the workflow reached `main`
          exited 2 on the 404 — the third answer where "never, and not due yet"
          was the true one; the reader now tells the two apart and a test holds
          it, while any other refusal still raises. `fetch-depth: 0` removed from
          the checkout went red.
      - kind: mutation
