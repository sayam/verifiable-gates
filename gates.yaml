  - id: the-sheet-is-rendered-not-written
    title: A rule sheet is a pure function of a catalogue, a preamble and a language
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_skill_renderer.py]}
    layer: internal
