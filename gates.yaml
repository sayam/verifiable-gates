  - id: a-shipped-file-declares-what-it-needs
    title: Shipped files are stdlib-only, or declare their dependency in the manifest — both ways
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_shipped_requirements.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      The scans and the doctor run on a bare CI runner, so they may import nothing but the
      standard library. preflight is the exception: it reads whole workflow files, which the
      narrow subset reader in the scans cannot do, and it runs on a developer's machine
      rather than a runner. The reference implementation shipped it with that dependency
      undeclared, which means a target project learns the requirement from a traceback in
      its own CI. The rule here is not "no dependencies" but "no silent ones", and it is
      checked in both directions: an undeclared import is a surprise for someone else, and a
      declaration nothing imports is a requirement every project carries forever for a
      reason that expired. On 2026-09-01 the pull request that had carried this row's first
      proof was deleted, with eight others, so that GitHub could garbage-collect commits
      whose metadata held a private address by mistake (support ticket 4717542): the address
      had to become unreachable, and a pull request referencing those commits is a
      reference. What that first proof caught is kept here, where it needs no link. On
      2026-08-25: the list of Python files to check is derived from the manifest, so a new
      shipped file that joins neither tier fails rather than being skipped.
    proved_by:
      - kind: mutation
        ref: pr/208
        date: 2026-09-01
        caught: >-
          Re-proved on the tree as it stands: `import requests` appended to `preflight.py`,
          a shipped file, turned
          `test_a_shipped_file_declares_anything_it_needs[preflight.py]` red — a dependency
          that no manifest declares would reach a target project as an ImportError.
  - id: preflight-loses-no-step
    title: Every workflow step reaches the plan exactly once, run or skipped with a reason
    kind: test
    severity: blocking
