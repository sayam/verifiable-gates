      The value of reading commands out of the workflow is that no second copy exists to
      drift. That holds only while every step ends up in the plan: one dropped silently
      gives the same false confidence as a harness reporting green while the tests are red.
      A step's env travels with it for the same reason — running the same command in a
      different environment answers a different question from the one CI asked, which is how
      a coverage step once overwrote the wrong file on a developer's machine. On 2026-09-01
      the pull request that had carried this row's first proof was deleted, with eight
      others, so that GitHub could garbage-collect commits whose metadata held a private
      address by mistake (support ticket 4717542): the address had to become unreachable,
      and a pull request referencing those commits is a reference. What that first proof
      caught is kept here, where it needs no link. On 2026-08-25 it was six mutations red:
      dropping an unrunnable step instead of skipping it aloud, discarding a step's env,
      letting the config beat --only, reading jobs from one workflow file instead of all,
