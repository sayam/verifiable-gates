# This repository's own gate registry — **still empty, and that is the correct
# state at stage 1.**
#
# This is the home of *registries that are checked against reality both ways*, so
# it has to keep one of its own from day one. But **no row goes in before the
# thing that enforces it exists** — a registry listing gates nobody enforces is
# precisely what this whole project exists to stop doing. The first row arrives
# with the first enforcer, in stage 2, when the checks and the doctor move in.
#
# The shape of this file is enforced by `verifiable_gates.registry` and
# `tests/test_registry.py`.

version: 1
gates:
  - id: english-except-where-it-binds
    title: Everything here is in English, except documents that bind someone legally
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_language_policy.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      This repository is written in English because it is meant to be picked up by
      people who do not read Thai, while the reference implementation it was
      extracted from is in Thai throughout. Stages 2 to 5 move code across that
      boundary repeatedly, so Thai arrives here quietly and by accident rather
      than by decision. The exception — README and CLA, English first and Thai
      below — exists because a document that binds someone has to be understood by
      the person bound, and the maintainer's first language is Thai. The check
      runs both ways: Thai outside the allowlist fails, and so does an allowlisted
      file with no Thai left in it, because an exception that no longer excuses
      anything is a hole with a label on it.
    proved_by:
      - kind: mutation
        ref: pr/3
        date: 2026-08-25
        caught: >-
          Red in all three directions — a Thai comment added to a source file, the
          Thai half stripped from CLA.md, and the allowlist pointed at a file that
          does not exist. It also caught a defect in itself while being written:
          walking the filesystem picked up verifiable_gates.egg-info/PKG-INFO, a
          build artefact embedding the bilingual README that exists only where the
          package was installed in editable mode. It now reads what git tracks.

  - id: checks-stay-standalone
    title: Every scanner survives being copied out of this package on its own
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_checks_are_standalone.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A scanner is shipped as a single file into a project that has installed
      nothing, and run there with a bare python3. That works only while each file
      imports stdlib only and nothing from this package — a property invisible in
      normal use, because the tests here import the modules. It is also exactly
      the shape a well-meaning refactor breaks: three scanners repeat six lines of
      argv handling, someone lifts them into a shared helper, the suite stays
      green, and every copied file breaks in a repository nobody here can see.
    proved_by:
      - kind: mutation
        ref: pr/4
        date: 2026-08-25
        caught: >-
          The AST checks and the subprocess runs disagree usefully: the AST pass
          catches a shared import before it ships, and copying each scanner to a
          directory where the package cannot be imported catches anything the AST
          pass would have missed. A misuse must exit 2, never 0, so a wrong call
          is never filed as a clean run.

  - id: scanners-tell-their-two-answers-apart
    title: Every scanner is shown a tree that violates it and one that does not
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_checks_behaviour.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A scanner that returns 0 for everything is indistinguishable from a clean
      project: CI stays green and the report says there is nothing to report. The
      pair — one tree that breaks the rule, one that keeps it — is the only thing
      that tells those two apart. The third case is the not-applicable one, which
      has to announce itself, because silence would file "we never looked" under
      "we looked and it was fine".
    proved_by:
      - kind: mutation
        ref: pr/4
        date: 2026-08-25
        caught: >-
          Nine mutations, one per scanner, each making it too generous — red every
          time. Coverage then found three behaviours the pairs never reached: the
          purge-path exemption, the npm branch, and module-level session imports.
          Each is the part a reader assumes works.

  - id: rules-we-ship-we-keep
    title: Scanners that apply to this repository are run against this repository
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_dogfood.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Governance audit round 23 of the reference implementation measured the gap
      between the rules a project exports and the rules it keeps, and the answer
      was 2.7%. The cheapest defence is to point every scanner that can apply here
      at here, from the day it lands. The test also refuses a not-applicable
      result: a scanner that finds nothing to check here is not dogfooding
      anything, and would otherwise sit in the list looking like a pass.
    proved_by:
      - kind: ci-red
        ref: pr/4
        date: 2026-08-25
        caught: >-
          It failed on its first run, on this repository, for a real reason:
          `pip install --no-deps -e .` installs the checkout itself and resolves
          nothing from an index, so there is no hash to pin — and the scanner
          flagged it anyway. The scanner was fixed rather than the repository, and
          the exemption now needs both halves, with a test for each: `--no-deps`
          on its own still reaches the index, and `-e .` on its own drags the
          whole dependency tree in unpinned.

  - id: a-bundle-installs-and-answers
    title: A fresh install gives a project something that runs, and never overwrites its decisions
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_install_and_doctor.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Testing the installer and the doctor apart leaves the only claim that
      matters proven by nobody: that they fit together in a directory where no
      package is present. The second property is the one that decays quietly —
      scaffold.json, gates.yaml and the workflow hold decisions somebody made, and
      an install that clobbered them would destroy exactly the work the bundle
      exists to protect while its output still read as success.
    proved_by:
      - kind: mutation
        ref: pr/5
        date: 2026-08-25
        caught: >-
          Red on all of it — overwriting the files that carry decisions, letting an
          incomplete bundle install anyway, reporting NA as pass, and dropping the
          count of suite gates still waiting. Coverage then found two branches no
          test reached: a scan that exists but does not compile, and the clean run
          returning 0, which had only ever been exercised through a subprocess
          where a wrong exit code is easy to lose among captured output.

  - id: the-manifest-is-an-input
    title: The manifest is validated as data, and a rule the bundle cannot decide cannot carry a script
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_manifest.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation's doctor read overlay.json from the directory
      beside it, which is right while one tool serves one registry and wrong the
      moment the tool is a package several projects install. Passing the path in is
      the seam that lets one doctor answer for many catalogues. The subtle rule the
      schema enforces is that a gate of kind suite may not carry a script: a suite
      gate is by definition one this bundle cannot decide, and a script would let it
      run, pass, and be counted — turning "the project still has to write this test"
      into "checked".
    proved_by:
      - kind: mutation
        ref: pr/5
        date: 2026-08-25
        caught: >-
          Counting suite entries as scans, and allowing a suite entry to carry a
          script, both went red. Every schema rule has a case that breaks it alone,
          because a validator that only ever sees valid input is one nobody has
          watched work.

  - id: the-shipped-reader-agrees-with-the-real-one
    title: The hand-written YAML reader agrees with PyYAML on this repository's own files
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_registry_scan.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The shipped registry scanner cannot use PyYAML — it runs in projects that
      have installed nothing — so it carries a hand-written subset reader. That
      makes it the riskiest code in the bundle: a reader more forgiving than the
      real one reports green on files it did not understand, and nothing about
      that looks wrong. Two defences: anything outside the subset raises, and on
      this repository's own files the two readers must agree value for value. The
      one accepted divergence, block scalar bodies, is measured rather than waved
      through — the count of blanked values must equal the count of block scalars.
    proved_by:
      - kind: mutation
        ref: pr/6
        date: 2026-08-25
        caught: >-
          Writing the test found two real defects on the first run. An anchor or
          an unclosed quote in *value* position was read as ordinary text, because
          the guard only looked at the start of a line — the reader was quietly
          more permissive than YAML. And `portable: false` came back as the string
          "false", which is truthy: any rule that ever read a boolean would have
          read it backwards, silently. Both fixed in the reader. Nine further
          mutations across the four directions and the reader went red.

  - id: the-box-opens-already-true
    title: A fresh install's registry passes its own check, and is not skipped as not-applicable
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_install_and_doctor.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Most rules in this bundle end with "register it in your gates.yaml". If the
      box does not contain that file, already true about itself, the instruction
      is prose — governance audit round 23 of the reference implementation is where
      that gap was first measured. The second half matters as much: the check must
      not report N/A, or an absent index would look like a satisfied one.
    proved_by:
      - kind: ci-red
        ref: pr/6
        date: 2026-08-25
        caught: >-
          Red on its first run. The shipped starting registry declared its rows as
          `kind: step` naming steps that the shipped starting workflow does not
          have, so a project that installed the bundle and changed nothing would
          have failed its own registry check immediately. The defaults were wrong
          together and only disagreed once something ran both.
