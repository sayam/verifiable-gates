  - id: a-bundle-installs-and-answers
    title: A fresh install gives a project something that runs, and never overwrites its decisions
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_install_and_doctor.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Testing the installer and the doctor apart leaves the only claim that matters proven
      by nobody: that they fit together in a directory where no package is present. The
      second property is the one that decays quietly — scaffold.json, gates.yaml and the
      workflow hold decisions somebody made, and an install that clobbered them would
      destroy exactly the work the bundle exists to protect while its output still read as
      success. On 2026-09-01 the pull request that had carried this row's first proof was
      deleted, with eight others, so that GitHub could garbage-collect commits whose
      metadata held a private address by mistake (support ticket 4717542): the address had
      to become unreachable, and a pull request referencing those commits is a reference.
      What that first proof caught is kept here, where it needs no link. On 2026-08-25 it
      went red on all of it — overwriting the files that carry decisions, letting an
      incomplete bundle install anyway, reporting NA as pass, and dropping the count of
      suite gates still waiting; coverage then found a scan that exists but does not
      compile, and the clean run returning 0, which had only ever been exercised through a
      subprocess where a wrong exit code is easy to lose.
