  - id: one-reader-for-workflow-triggers
    title: There is one reader for `on:`, and it covers all three shapes GitHub accepts
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_workflow_reader.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A parser is a command like any other, and a second copy of it drifts just as
      fast. The reference implementation had this idiom copied in **five places**,
      three of them broken the same way — `on: [push, pull_request]` used the
      value as a dict key, which a list cannot be — and the copies had already
      drifted: one guarded itself with `isinstance`, two did not. The shape nobody
      expects is that the key is usually the boolean `True`: YAML 1.1 reads an
      unquoted `on:` as a boolean, so a reader looking only for the string finds
      nothing in almost every real workflow, and answers as though no triggers
      were declared.
    proved_by:
