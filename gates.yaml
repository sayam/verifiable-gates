  - id: the-box-opens-already-true
    title: A fresh install's registry passes its own check, and is not skipped as not-applicable
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_box_opens_true.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Most rules in this bundle end with "register it in your gates.yaml". If the box does
      not contain that file, already true about itself, the instruction is prose —
      governance audit round 23 of the reference implementation is where that gap was first
      measured. The second half matters as much: the check must not report N/A, or an absent
      index would look like a satisfied one. On 2026-09-01 the pull request that had carried
      this row's first proof was deleted, with eight others, so that GitHub could garbage-
      collect commits whose metadata held a private address by mistake (support ticket
      4717542): the address had to become unreachable, and a pull request referencing those
      commits is a reference. What that first proof caught is kept here, where it needs no
      link. On 2026-08-25 it was red on its first run: the shipped starting registry
      declared its rows as `kind: step` naming steps that the shipped starting workflow does
      not have, so a project that installed the bundle and changed nothing would have failed
      its own registry check immediately. The defaults were wrong together and only
      disagreed once something ran both.
