  - id: the-manifest-is-an-input
    title: The manifest is validated as data, and a rule the bundle cannot decide cannot carry a script
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_manifest.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation's doctor read overlay.json from the directory beside it,
      which is right while one tool serves one registry and wrong the moment the tool is a
      package several projects install. Passing the path in is the seam that lets one doctor
      answer for many catalogues. The subtle rule the schema enforces is that a gate of kind
      suite may not carry a script: a suite gate is by definition one this bundle cannot
      decide, and a script would let it run, pass, and be counted — turning "the project
      still has to write this test" into "checked". On 2026-09-01 the pull request that had
      carried this row's first proof was deleted, with eight others, so that GitHub could
      garbage-collect commits whose metadata held a private address by mistake (support
      ticket 4717542): the address had to become unreachable, and a pull request referencing
      those commits is a reference. What that first proof caught is kept here, where it
      needs no link. On 2026-08-25: counting suite entries as scans, and allowing a suite
      entry to carry a script, both went red — every schema rule has a case that breaks it
      alone, because a validator that only ever sees valid input is one nobody has watched
      work.
    proved_by:
      - kind: mutation
        ref: pr/111
        date: 2026-08-30
        caught: >-
          The climb check switched off (`_leaves` always false): red on
          `../../outside/x`, on an absolute path and on `a/../../b.py`, and red
          in the installer's end-to-end case that watches the landing spot.
      - kind: mutation
        ref: pr/141
        date: 2026-08-31
        caught: >-
          All nine overlay titles edited away from the catalogue's (and one id
          renamed) — green before the hold, red after; the only earlier hold was
          that a title existed (outside audit, 2026-08-31, reproduced).
      - kind: mutation
