  - id: the-manifest-is-an-input
    title: The manifest is validated as data, and a rule the bundle cannot decide cannot carry a script
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_manifest.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation's doctor read overlay.json from the directory
      beside it, which is right while one tool serves one registry and wrong the
      moment the tool is a package several projects install. Passing the path in is
      the seam that lets one doctor answer for many catalogues. The subtle rule the
      schema enforces is that a gate of kind suite may not carry a script: a suite
      gate is by definition one this bundle cannot decide, and a script would let it
      run, pass, and be counted — turning "the project still has to write this test"
      into "checked".
    proved_by:
      - kind: mutation
        ref: pr/5
        date: 2026-08-25
        caught: >-
          Counting suite entries as scans, and allowing a suite entry to carry a
          script, both went red. Every schema rule has a case that breaks it alone,
          because a validator that only ever sees valid input is one nobody has
          watched work.
      - kind: mutation
        ref: pr/111
        date: 2026-08-30
        caught: >-
          The climb check switched off (`_leaves` always false): red on
          `../../outside/x`, on an absolute path and on `a/../../b.py`, and red
          in the installer's end-to-end case that watches the landing spot.

  - id: the-shipped-reader-agrees-with-the-real-one
    title: The hand-written YAML reader agrees with PyYAML on this repository's own files
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_registry_scan.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The shipped registry scanner cannot use PyYAML — it runs in projects that
      have installed nothing — so it carries a hand-written subset reader. That
      makes it the riskiest code in the bundle: a reader more forgiving than the
      real one reports green on files it did not understand, and nothing about
      that looks wrong. Two defences: anything outside the subset raises, and on
      this repository's own files the two readers must agree value for value. The
      one accepted divergence, block scalar bodies, is measured rather than waved
      through — the count of blanked values must equal the count of block scalars.
    proved_by:
      - kind: mutation
        ref: pr/6
        date: 2026-08-25
        caught: >-
          Writing the test found two real defects on the first run. An anchor or
          an unclosed quote in *value* position was read as ordinary text, because
          the guard only looked at the start of a line — the reader was quietly
          more permissive than YAML. And `portable: false` came back as the string
          "false", which is truthy: any rule that ever read a boolean would have
          read it backwards, silently. Both fixed in the reader. Nine further
          mutations across the four directions and the reader went red.
      - kind: mutation
        ref: pr/57
        date: 2026-08-29
        caught: >-
          The scanner restored to its v0.1.3 text, where a `gates_path` the
          project named and did not have answered `NA: no docs/gates.yaml`, exit
          0 — the new case went red on that answer. Restored byte for byte.

  - id: the-box-opens-already-true
    title: A fresh install's registry passes its own check, and is not skipped as not-applicable
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_box_opens_true.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Most rules in this bundle end with "register it in your gates.yaml". If the
      box does not contain that file, already true about itself, the instruction
      is prose — governance audit round 23 of the reference implementation is where
      that gap was first measured. The second half matters as much: the check must
      not report N/A, or an absent index would look like a satisfied one.
    proved_by:
      - kind: ci-red
        ref: pr/6
        date: 2026-08-25
        caught: >-
          Red on its first run. The shipped starting registry declared its rows as
          `kind: step` naming steps that the shipped starting workflow does not
          have, so a project that installed the bundle and changed nothing would
          have failed its own registry check immediately. The defaults were wrong
          together and only disagreed once something ran both.

  - id: a-shipped-file-declares-what-it-needs
    title: Shipped files are stdlib-only, or declare their dependency in the manifest — both ways
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_shipped_requirements.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      The scans and the doctor run on a bare CI runner, so they may import nothing
      but the standard library. preflight is the exception: it reads whole workflow
      files, which the narrow subset reader in the scans cannot do, and it runs on
      a developer's machine rather than a runner. The reference implementation
      shipped it with that dependency undeclared, which means a target project
      learns the requirement from a traceback in its own CI. The rule here is not
      "no dependencies" but "no silent ones", and it is checked in both
      directions: an undeclared import is a surprise for someone else, and a
      declaration nothing imports is a requirement every project carries forever
      for a reason that expired.
    proved_by:
      - kind: mutation
        ref: pr/7
        date: 2026-08-25
        caught: >-
          The list of Python files to check is derived from the manifest, so a new
          shipped file that joins neither tier fails rather than being skipped.

  - id: preflight-loses-no-step
    title: Every workflow step reaches the plan exactly once, run or skipped with a reason
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_preflight.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The value of reading commands out of the workflow is that no second copy
      exists to drift. That holds only while every step ends up in the plan: one
      dropped silently gives the same false confidence as a harness reporting green
      while the tests are red. A step's env travels with it for the same reason —
      running the same command in a different environment answers a different
      question from the one CI asked, which is how a coverage step once overwrote
      the wrong file on a developer's machine.
    proved_by:
      - kind: mutation
        ref: pr/7
        date: 2026-08-25
        caught: >-
          Six mutations red: dropping an unrunnable step instead of skipping it
          aloud, discarding a step's env, letting the config beat --only, reading
          jobs from one workflow file instead of all, hiding an uninstalled hook,
          and returning 0 after a step failed.
      - kind: mutation
        ref: pr/39
        date: 2026-08-29
        caught: >-
          Three mutations red on the environment a step is lent — handing the
          shell over whole again (a secret the step never named reached bash),
          dropping the by-name borrowing (a step that named `$GH_TOKEN` ran
          without it), and borrowing in silence (the name was lent but never
          printed).

  - id: the-sheet-is-rendered-not-written
    title: A rule sheet is a pure function of a catalogue, a preamble and a language
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_skill_renderer.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A hand-written rule sheet is a third register, and it drifts from the
      catalogue the moment somebody edits one side. Generating it fixes that only
      while the render is byte-deterministic, so a project can hold its committed
      file against a fresh one and see a difference rather than trust there is
      none. Three things were constants in the reference implementation and are
      inputs here: the catalogue, so one renderer serves any set of rules; the
      preamble — the opening of a sheet is prose a project writes about itself,
      and baking one project's paragraphs into the tool would make every other
      project ship that project's story; and the language, because the catalogue
      carries the published English beside each rule's original wording, and a
      renderer that could reach only one of them would make the other dead weight
      in the file. Dead weight is what stops being maintained.
    proved_by:
      - kind: mutation
        ref: pr/8
        date: 2026-08-25
        caught: >-
          Five mutations red — rendering rules that were never marked exportable,
          leaving born_from unwrapped, making --check always agree, rendering from
          a registry that did not pass its own schema, and ignoring the caller's
          headings.
      - kind: mutation
        ref: pr/9
        date: 2026-08-25
        caught: >-
          Five more red once the renderer read a catalogue instead of a registry —
          ignoring the language suffix, dropping the fallback so a missing
          translation rendered blank instead of the published text, pinning the
          headings to English whatever the language, writing the file during
          --check, and ignoring the requested layer.

  - id: the-harness-never-passes-what-it-cannot-decide
    title: The fail-fix harness answers machine-readably, and reports skips rather than hiding them
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_harness.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The harness turns a checklist into a loop, and the shape of its answer is
      the value: gate id, cause, and the trap the rule came from. A loop that
      knows only what broke will satisfy the letter of a check; one that knows
      what the rule protected has a chance at the cause. It runs gates of kind
      test and cannot decide job or step, whose commands live in the workflow —
      reporting those as anything but "skipped, because" would turn "nobody
      checked this" into "this passed".
    proved_by:
      - kind: mutation
        ref: pr/8
        date: 2026-08-25
        caught: >-
          Six mutations red, including running job gates as if they were tests,
          dropping the hint, returning 0 after a gate failed, and treating an
          unknown gate id as a clean run. A seventh attempt produced a syntax
          error rather than a behaviour change, which is not a result — it was
          redone so the code still parsed before drawing any conclusion.
      - kind: mutation
        ref: pr/61
        date: 2026-08-29
        caught: >-
          The harness restored to a bare `registry.load(...)`: the new case did
          not fail, it *errored* — the reader's TypeError escaped `main()` as a
          traceback, which is the answer that is neither pass, fail nor misuse.
          Restored byte for byte, exit 2 with the reader's words.

  - id: a-published-rule-carries-its-origin
    title: A published rule names the incident behind it, belongs to a published layer, and names no framework
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_rules_catalogue.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The registry handover split what was one file in the reference
      implementation into two, because a rule and its enforcement have different
      lifetimes. Enforcement moves whenever a project reorganises its tests and is
      written in that project's framework; the rule changes only when reality
      teaches something new. Keeping both in one file worked while there was one
      project, and stops working the moment a second adopts a rule: its
      `enforced_by` would point at files that project does not have, and a
      registry whose rows point at nothing is the thing this bundle exists to
      prevent. Three invariants are enforced rather than left to a reader, and
      each is a mistake that is easy to make and silent once made. A rule with no
      `born_from` is somebody's preference, and years later nobody can tell
      whether the conditions that created it still hold, so it can never be
      retired. A rule at layer `internal` is tied to one architecture, and
      publishing it as universal is an overclaim — a governance audit of the
      reference implementation measured five rules carrying the wrong label, so
      the catalogue cannot express the value at all. And a rule naming one stack's
      library means nothing to a reader on another stack while still claiming to
      be universal; the `reference` block is exempt on purpose, because naming
      that project's own files is what makes it evidence.
    proved_by:
      - kind: mutation
        ref: pr/9
        date: 2026-08-25
        caught: >-
          Eight mutations red — admitting `internal` into the published layers,
          dropping `born_from` from the required fields, disabling the framework
          scan outright, extending it into the `reference` block so a cited
          filename became a violation, skipping the duplicate-id check, accepting
          a `script` the bundle does not ship, allowing `..` in a script path, and
          reading a catalogue whose version this reader does not speak.
      - kind: mutation
        ref: pr/77
        date: 2026-08-30
        caught: >-
          A rule's `script:` line deleted, the manifest's entry turned from `scan`
          to `suite`, and the path changed on one side — three mutations, each red.
          Before the test, the first of these left all 1121 tests green in a
          worktree (re-audit round 16).

  - id: the-sheets-match-the-catalogue
    title: The committed sheets are a fresh render, and between them they publish every rule
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_sheets.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Generated files that live in git are worth keeping only while something
      compares them against a fresh render on every run. Without that, a sheet
      somebody improved by hand looks exactly like a sheet in step with the
      catalogue, and the reason for generating it is gone. The second half is the
      one that decays quietly: the sheets have to **partition** the catalogue. A
      rule belonging to no layer's sheet is published nowhere while still counting
      as published, and nothing about either file would look wrong — the sheet is
      shorter and the catalogue is unchanged.
    proved_by:
      - kind: mutation
        ref: pr/9
        date: 2026-08-25
        caught: >-
          Three planted defects red — a sentence added to a sheet by hand, a rule
          moved to a layer that no sheet renders so it vanished from both, and the
          "do not edit" banner removed from a generated file.
      - kind: mutation
        ref: pr/43
        date: 2026-08-29
        caught: >-
          The sheets gained a declared ceiling, two-way: the sheet over its ceiling
          went red, and a ceiling raised 41 lines above the sheet went red too —
          the space above reality is the space that fills unseen.

  - id: the-schema-is-read-the-way-it-is-written
    title: The registry schema is proved against both a well-formed registry and a broken one
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_registry.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      Everything else in this bundle reads a registry through this module, so a
      permissive reader is a hole under every other check at once. It had no row of
      its own until the registry handover went looking, which is itself the lesson:
      the first file written in a repository is the one nobody thinks to register,
      because at the time there was no index to register it in.
    proved_by:
      - kind: mutation
        ref: pr/10
        date: 2026-08-25
        caught: >-
          Four mutations red — accepting a gate at layer internal that also claims
          to be portable, accepting one with no origin, opening the pillar
          vocabulary, and accepting proof of a kind nobody defined. Two earlier
          attempts reported "not red" and were the author's error rather than the
          suite's: one patched a line that does not exist, and one widened the
          vocabulary with a value no test uses.
      - kind: mutation
        ref: pr/61
        date: 2026-08-29
        caught: >-
          The reader restored to its v0.1.3 text — a missing `gates` key read as
          `[]`, a row that is not a mapping dropped before `problems()` saw it —
          and six cases went red: the missing key, a string, an int and a list
          row here, and the harness's two cases fed the same files. Restored
          byte for byte, 56 green.
      - kind: mutation
        ref: pr/62
        date: 2026-08-29
        caught: >-
          The schema restored to "ref is non-empty" and "date is ten characters
          with dashes": sixteen cases red — `trust me`, `pr/0`, `PR/1`, a bare
          `#pr/1`, a full URL and six more refs, and `9999-99-99`, `2026-02-30`
          and three more dates. Restored byte for byte, 62 green; this
          repository's own 66 refs and every date pass as they are.

  - id: every-commit-is-shaped-and-signed
    title: Every commit added by a branch is a Conventional Commit and carries a sign-off
    kind: job
    severity: blocking
    enforced_by: {job: commit-lint}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation learned both halves the hard way. A required
      check that gets skipped leaves a pull request BLOCKED forever with nothing red
      to see, so the job runs on what the branch actually adds rather than on the
      whole history. And the sign-off is the one thing a project cannot add
      retroactively: it is a statement by the person who wrote the commit, at the
      time they wrote it, and it was the single unmet item of OSPS Baseline level 2
      there.
    proved_by:
      - kind: ci-red
        ref: pr/7
        date: 2026-08-25
        caught: >-
          It refused commit 3a08fd10c — a subject of 73 characters, one over the
          limit — and held the pull request until it was rewritten.

  - id: the-static-battery-runs-on-every-push
    title: Lint, formatting and types are decided by CI, not by whoever remembered to run them
    kind: job
    severity: blocking
    enforced_by: {job: lint}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A check that only runs where somebody remembers to run it is a check that
      stops running on the busiest day. The battery is one job so that a single red
      answer names every static problem at once, rather than one per push over three
      pushes.

      **This gate has never gone red, and carries no `proved_by` because of it.**
      It has run on every push since the repository's first, and every finding it
      would have caught was caught locally first — the rule catalogue's branch had
      six, and `ruff` reported all six before the branch was pushed. That is a good
      outcome and a weak proof: a job that has never failed is indistinguishable
      from a job that checks nothing, which is the very thing
      `gates-carry-red-evidence` says out loud. The honest record is this
      paragraph, not a citation of a run that did not happen. The two real red runs
      in this repository's history are on `test` and `commit-lint`, and they are
      cited by the gates that own them.
    proved_by:
      - kind: ci-red
        ref: pr/43
        date: 2026-08-29
        caught: >-
          xenon at the aspirational thresholds (A/A/A) was red on 23 blocks and 17
          modules before the step was added — so the floor was set where reality
          stood (C/C/B, docstrings 84%) and recorded as a ratchet, and every step
          carries `!cancelled()` so the first red cannot hide the next.

  - id: the-worksheet-keeps-its-verdicts
    title: The ASVS worksheet is refreshed from a pinned standard, and the crosswalk is derived — neither ever writes a verdict
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_asvs_worksheet.py, tests/test_gates_crosswalk.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The reference implementation's first worksheet generator did not cut the
      head of the document before reading rows — and the preamble held a backlog
      table whose rows begin with the very same requirement ids. It rewrote those
      rows in the assessment table's shape, silently, because the result was
      still a valid markdown table. The generator's whole contract is that a
      refresh is not a reset: every status and evidence a person wrote survives,
      a requirement the standard dropped leaves, a new one arrives *unassessed*
      rather than passed. The crosswalk is the same contract from the other
      side — it is derived one way from the rows' evidence through the registry's
      partition, so a mapping written by hand (a third place to drift) never
      exists, and a row nothing runs for is listed as such rather than folded in.
    proved_by:
      - kind: mutation
        ref: pr/32
        date: 2026-08-28
        caught: >-
          Five mutations red — a rebuild that drops existing verdicts, a reader
          that does not cut the preamble above the marker (the original bug), a
          crosswalk that stops mapping `ci:job` evidence, a render that ignores
          the levels in scope, and a passed-rows reader that answers empty
          instead of loud when nothing passes.
