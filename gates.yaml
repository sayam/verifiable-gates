      The layer above it is not: a workflow never triggered counts **zero runs**,
      and "no runs at all" looks exactly like "no run went red" in every tool
      there is — including any census counting what happened rather than what
      should have. In the reference implementation a scheduled workflow had fired
      exactly once in the repository's lifetime, and if it had stopped that day no
      test, job or cadence row would have known. GitHub also disables schedules
      for repositories quiet for 60 days, which is silence arriving from outside.
      Dependabot is read as one clock from the platform's `dynamic` runs, held to
      the shortest interval its config declares — the census once called it
      unverifiable and printed a label where a verdict belonged (2026-08-31).
    proved_by:
      - kind: mutation
        ref: pr/17
        date: 2026-08-26
        caught: >-
          Five mutations red — turning an unreadable history into a silent pass
          (the failure this census exists to prevent, at the moment it is most
