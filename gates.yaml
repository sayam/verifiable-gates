          merge, and the field was patched from the command the step runs.

  - id: a-check-name-is-not-a-job-id
    title: The names a repository's checks will appear under are computed, not assumed
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_check_names.py]}
    layer: internal
    pillar: manageability
    portable: false
    born_from: >-
      Branch protection is a list of check *names*, and a name is not a job id: a
      job declaring `name:` uses that instead, and a job with a matrix produces one
      check per row. Two failures follow, and they look opposite. **A required name
      no job can produce leaves every pull request waiting for a check that never
      arrives** — nothing is red, the pull request simply never becomes mergeable.
      **A check nobody requires** runs, goes red, and merges anyway. Both are
      invisible from inside a repository unless something works out the names the
      platform is going to use. The reference implementation shipped a report saying
      `dialect` had failed ten times and, in the same breath, that `dialects` had
      never gone red: the same jobs, one named by its check and one by its id, with
      no reader able to see they were one thing. The wider "everything this
      repository can produce" set exists for the same reason a register does: held
      against the pull-request set instead, a "not required, and here is why" entry
      can never appear in it, so nothing consults it and it becomes a text file.
    proved_by:
      - kind: mutation
        ref: pr/20
        date: 2026-08-26
        caught: >-
          Six mutations red — reading the job id where a name was declared,
          collapsing matrix rows whose values do not appear in the name, requiring
          scheduled workflows on pull requests, narrowing the everything-set to the
          pull-request one so a register could never be consulted, counting a matrix
          as one run, and counting distinct names where the advertised number counts
          runs.

  - id: platform-settings-are-held-to-what-was-declared
    title: The settings every other gate leans on are checked, not merely written down
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_posture.py]}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      Every gate in a repository rests on settings that live somewhere else — that
      the default branch takes changes only through a pull request, that
      administrators are not exempt, that the required checks are the ones that
      actually run — and **nothing inside a repository can see any of it**. Switch
      one off in a web form and the documents keep saying what they always said. It
      is the control every other control leans on and the one nobody watches. Three
      rules make the check worth running. **Cannot read is not the same as switched
      off**: reporting the first as the second sends somebody to fix what was never
      broken, and reporting it as fine is worse, so it gets a third answer. **A
      value nobody can read still has a declared value** — the reference
      implementation lost one setting entirely because it lived in the unreadable
      class, so its register recorded that no machine could see it and nothing
      anywhere recorded what it should be; the rule it carried was then kept by one
      person's memory and forgotten about thirty times running. **Both directions**,
      because an exemption goes quiet exactly when the thing it excuses disappears —
      and an exemption register held against the wrong set can never match anything,
      which is how that project's own sat unread from the day it was written.
    proved_by:
      - kind: mutation
        ref: pr/20
        date: 2026-08-26
        caught: >-
          Ten mutations red — holding the exemption register against the
          pull-request set so it could never be consulted, never reporting a stale
          exemption, missing a required check no job can produce (the failure where
          nothing is red and the pull request simply never merges), reporting an
          unreadable field as switched off, absorbing any empty field as expected,
          demanding a register line for an alert the platform had fixed, counting a
          dismissal with no reason as a judgement, reading "no permission to look"
          as "no alerts", losing the link between a matrix row and the job it
          belongs to, and freezing the wording so it could no longer be an input.
      - kind: mutation
        ref: pr/66
        date: 2026-08-29
        caught: >-
          CONTRIBUTING's list of required checks bound to the register: `cla`
          dropped from the sentence — red, naming the seven it had and the
          eight the workflows and the register require; `cla` excused in the
          register instead — red the other way. Both restored byte for byte.
      - kind: mutation
        ref: pr/88
        date: 2026-08-30
        caught: >-
          The two new endpoints, three ways — an alerts refusal read as "off"
          instead of the third answer, the Actions-policy keys not read, and
          `required_signatures` not read — each red. The last was found live first:
          the first `posture --settings` run with the wider register had `blind`
          report a declared switch the reader never asked for.
      - kind: mutation
        ref: pr/104
        date: 2026-08-30
        caught: >-
          The alerts switch's refusal check widened back to any "404" — a 403 whose
          words contain 404 read as "off" instead of the third answer, red.
      - kind: mutation
        ref: pr/106
        date: 2026-08-30
        caught: >-
          The selected-actions detail: its patterns not read, and the detail never
          read at all — each red in the test that puts a pattern `*` under
          "selected" and expects a wrong value.
      - kind: mutation
        ref: pr/116
        date: 2026-08-30
        caught: >-
          The register itself, four ways: `enforce_admins.want` flipped, red;
          `sha_pinning_required` removed, red twice; a switch added, red; a why
          emptied, red. An outside audit did the first two on 2026-08-30 and
          the suite stayed green — the job that reads the register is not a
          required check, so nothing in a pull request saw either.

  - id: every-advisory-has-been-judged
    title: Every finding has been decided about, and every decision still describes something
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_advisories.py]}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      A scanner that fails on anything it finds gets switched off. Some findings
      genuinely cannot be acted on — a pinned transitive dependency upstream has
      not moved, a distribution patch that does not exist — and a check red from
      its first day and red forever is one somebody silences inside a fortnight,
      taking the real findings with it. So the rule is not "no findings" but
      **every finding has been decided about**, which makes the register of
      accepted ones the thing that has to be right. It is held **both ways**, and
      the second way is the one that rots: the tools never mention an id they did
      not need to ignore, so an entry outlives its subject in silence and sits
      there excusing nothing, until the day it silently excuses something real.
      Two readers carry their own lesson — a package audit groups by affected
      package rather than by advisory, so counting headlines gives six where the
      cause is one; and the id has to be the public one, never a registry's
      internal number, or nobody reviewing the register can look an entry up.
    proved_by:
      - kind: mutation
        ref: pr/22
        date: 2026-08-26
        caught: >-
          Five mutations red — never reporting a stale entry (the direction the
          tools are silent about), counting a package audit by headline so one
          cause became six, using the registry's internal number as the id,
          collapsing "no fix exists" into "a fix exists we cannot take", and
          reading the register's own comments as entries.

  - id: a-scan-proves-it-scanned
    title: A run that found nothing is told apart from a run that read nothing
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_scan_coverage.py]}
    layer: internal
    pillar: security
    portable: false
    born_from: >-
      Exit zero from a static analyser means "no findings", which is
      indistinguishable from "no files". A whole directory can drop out — a
      default exclude nobody read, a working directory that was not what somebody
      assumed — and the result is green, quiet and permanent, with **nothing in
      the output differing from the day it worked**. It happened: a scanner's own
      built-in defaults excluded the reference implementation's test tree, so 61
      of 136 files were never scanned while the workflow named two directories it
      excluded itself. Nobody lied and nobody measured. A minimum count is not the
      answer — a floor catches "everything vanished" and misses "one directory
      vanished", which is the shape the bug took. What is checked is the set of
      files the run reports reading against the set that should have been read,
      plus three things that each fail green on their own: no rules loaded, a rule
      skipped, an error the tool reported about itself. Reading *more* than
      expected is safety, not a fault, so only the missing direction is red.
    proved_by:
      - kind: mutation
        ref: pr/22
        date: 2026-08-26
        caught: >-
          Six mutations red — flipping the direction of the set difference so
          reading extra became the fault and reading nothing became fine, passing
          an empty rule set, passing a skipped rule, swallowing the scanner's own
          errors, matching a declared skip as a name prefix rather than a
          directory so `apple/` vanished with `app/`, and dropping the pattern
          that decides what counts as code.

  - id: the-instrument-is-measured-first
    title: The probe that judges generated apps is itself judged, both ways, per item
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_asvs_probe.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A claim that a bundle of rules changes what agents write is worth exactly
      what its instrument can distinguish. **A probe answering "passed" for
      everything reports that the rules made no difference** — a wrong conclusion
      with nothing to contradict it. So a pair of apps is planted, one violating
      every item and one satisfying every item, and each item has to tell them
      apart. The harder direction is subtler: an instrument tied to one idiom
      measures "written like our example?" and leans by construction toward
      whichever arm read our own rules. The first version reported the rules arm as
      *worse* on three items, and all three were its own fault — it read a web
      session accessor as a database lookup, punished a shared lookup whose callers
      all checked ownership, and matched a fixture's fake key as a hardcoded
      secret. **When the person measuring owns what is measured, the dangerous
      error is not the flattering number — it is the one that contradicts them and
      gets believed at once because it looks honest.**
    proved_by:
      - kind: mutation
        ref: sayam/flask-todolist#pr/151
        date: 2026-08-19
        caught: >-
          Pointed at a real repository for the first time, 4,171 of the 4,299 files
          it read were library sources. Six directions red — no longer excluding
          environments, no longer stripping comments, counting a role check as a
          missing owner check, ignoring the scope enclosing a nested function,
          treating a module constant as request input, and letting the line counter
          use a different filter from the probe.

  - id: one-battery-across-every-arm
    title: Every arm of a comparison is measured with the same instrument, unchanged
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_measure_apps.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A comparison stops being one the moment the instrument differs between arms,
      and the ways that happens are quiet. A different configuration is a different
      gate. A skipped scanner reported as zero is indistinguishable in a table from
      a scanner that found nothing. And **the arm that installed the bundle
      receives tooling, a config and a starting workflow** — counting those as its
      own output adds the measurer's work to one side of the measurer's own
      experiment. Removing them is the direction that costs the bundle, which is
      the correct direction when the person measuring has a stake in the answer, and
      it is the rule most tempting to skip. The line counter has to read the same
      tree the probe reads, or "lines the agent wrote" silently swallows an
      environment somebody left in the directory.
    proved_by:
      - kind: mutation
        ref: pr/23
        date: 2026-08-26
        caught: >-
          The tests hold each of those open directly: the installer's artefacts are
          removed while the app's own work survives, an arm that installed nothing
          loses nothing, the original is never edited, `na` never collapses into
          `ok`, one configuration reaches every app, a scanner that was not asked
          for reports skipped rather than zero, a scanner that broke is loud rather
          than zero, and an environment in the tree does not enter the line count.

  - id: english-except-where-it-binds
    title: Everything here is in English, except documents that bind someone legally
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_language_policy.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      This repository is written in English because it is meant to be picked up by
      people who do not read Thai, while the reference implementation it was
      extracted from is in Thai throughout. Stages 2 to 5 move code across that
      boundary repeatedly, so Thai arrives here quietly and by accident rather
      than by decision. The exception — README and CLA, English first and Thai
      below — exists because a document that binds someone has to be understood by
      the person bound, and the maintainer's first language is Thai. The registry
      handover added a second kind of exception with a different shape: the rule
      catalogue keeps each rule's original wording beside the published English,
      because a translation of an incident report is a retelling and the retelling
      is not the record. That Thai is data, so it is not excused by file — it is
      excused only by position, in a `*_th` value, in a cited step name, or inside
      a string literal in the code that renders those fields. A Thai comment, key
      or identifier stays forbidden in every file, which is the leak this check
      was built for. The check
      runs both ways: Thai outside the allowlist fails, and so does an allowlisted
      file with no Thai left in it, because an exception that no longer excuses
      anything is a hole with a label on it.

      The comparison reports added a third kind, the same principle one level up —
      at whole files rather than fields. A research report is *thought* in one
      language and *published* in another, so the original is kept beside the
      published English, and that allowance is held three ways because each rots
      differently: an original translated in place stops being an original · an
      original with no active counterpart is a document with no owner · and an
      allowance widened from one directory to a whole tree changes nothing the day
      it is written while silently admitting everything written under that tree
      afterwards.
    proved_by:
      - kind: mutation
        ref: pr/3
        date: 2026-08-25
        caught: >-
          Red in all three directions — a Thai comment added to a source file, the
          Thai half stripped from CLA.md, and the allowlist pointed at a file that
          does not exist. It also caught two defects in itself. Walking the
          filesystem picked up verifiable_gates.egg-info/PKG-INFO, a build artefact
          embedding the bilingual README that exists only where the package was
          installed in editable mode. Then reading only *tracked* files let a new
          file pass locally and fail in CI, which happened for real in stage 2e —
          it now reads tracked plus untracked-not-ignored, the set a developer is
          one `git add` away from committing.

  - id: checks-stay-standalone
    title: Every scanner survives being copied out of this package on its own
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_checks_are_standalone.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      A scanner is shipped as a single file into a project that has installed
      nothing, and run there with a bare python3. That works only while each file
      imports stdlib only and nothing from this package — a property invisible in
      normal use, because the tests here import the modules. It is also exactly
      the shape a well-meaning refactor breaks: three scanners repeat six lines of
      argv handling, someone lifts them into a shared helper, the suite stays
      green, and every copied file breaks in a repository nobody here can see.
    proved_by:
      - kind: mutation
        ref: pr/4
        date: 2026-08-25
        caught: >-
          The AST checks and the subprocess runs disagree usefully: the AST pass
          catches a shared import before it ships, and copying each scanner to a
          directory where the package cannot be imported catches anything the AST
          pass would have missed. A misuse must exit 2, never 0, so a wrong call
          is never filed as a clean run.

