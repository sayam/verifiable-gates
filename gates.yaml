  - id: a-threshold-sits-against-reality-both-ways
    title: A ratchet's threshold is held to what is true today, in both directions
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_ratchets.py]}
    layer: internal
    pillar: devx
    portable: false
    born_from: >-
      The direction everyone watches needs no help: a coverage tool refuses to
      pass beneath its own floor. The direction that matters is the other one —
      **nobody raises the floor after the code gets better** — and a floor left
      behind quietly permits every line of that improvement to be given back. The
      reference implementation measured it: six days after setting a floor of 96
      at a measured 96.31%, reality had reached 97.11% and the floor had not
      moved, a full point of slack worth roughly fifty covered lines. Three
      further shapes had to be kept apart because the advice that fixes one is
      wrong for the others: a ceiling travels the same way in reverse, a removal
      guard exists to catch deletion and must grow freely or the cost of bumping a
      number teaches people to stop reading the check, and a floor some other tool
      already enforces downward must not be reported here as well or a reader gets
      two instructions for one problem.
    proved_by:
      - kind: mutation
        ref: pr/18
        date: 2026-08-26
        caught: >-
          Seven mutations red — reporting a fall a tool already owns so the reader
          got contradictory advice, taking a removal guard's free growth away,
          watching a ceiling only upward so space won was never banked, reporting
          a removal as a threshold regressing, freezing the wording so it could no
          longer be an input, letting one overridden message blank the four a
          project did not mention, and accepting a misspelled kind that then
          behaved like a floor.

